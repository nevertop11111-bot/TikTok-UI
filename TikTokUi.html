<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>TikTok UI · N21</title>
  <style>
    :root {
      --bg: #000;
      --surface: #121212;
      --card: #1a1a1a;
      --text: #fff;
      --text2: #aaa;
      --accent: #ff0050;
      --accent2: #00f2ea;
      --border: rgba(255,255,255,0.1);
      --bottom-bar-height: 60px;
      --top-bar-height: 56px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); font-family: 'Inter', 'Segoe UI', sans-serif;
      height: 100vh; overflow: hidden; color: var(--text);
    }
    .auth-screen {
      position: fixed; inset: 0; background: var(--bg); z-index: 100;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
    }
    .auth-screen.hidden { display: none; }
    .auth-box {
      background: var(--surface); border-radius: 24px; padding: 2rem;
      width: 90%; max-width: 360px; text-align: center;
      border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .auth-box h1 { font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 700; }
    .auth-box h1 span { color: var(--accent); }
    .auth-box input {
      width: 100%; padding: 14px; margin: 8px 0; border-radius: 14px;
      border: 1px solid var(--border); background: #000; color: #fff; font-size: 1rem;
      outline: none; transition: 0.2s;
    }
    .auth-box input:focus { border-color: var(--accent); }
    .auth-box button {
      width: 100%; padding: 14px; margin: 6px 0; border-radius: 14px;
      border: none; font-size: 1rem; cursor: pointer; font-weight: 600;
      transition: 0.2s;
    }
    .btn-login { background: var(--accent); color: #fff; }
    .btn-register { background: var(--accent2); color: #000; }
    .auth-error { color: #ff4444; font-size: 0.85rem; margin-top: 10px; display: none; }

    .app { height: 100vh; display: flex; flex-direction: column; }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; background: var(--surface); z-index: 10;
      border-bottom: 1px solid var(--border);
      height: var(--top-bar-height);
    }
    .top-bar h2 { font-size: 1.3rem; font-weight: 700; }
    .top-bar button {
      background: none; border: 1px solid var(--border); color: #fff;
      padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
    }
    .content { flex: 1; position: relative; overflow: hidden; }
    .panel {
      position: absolute; inset: 0; overflow-y: auto; display: none;
      flex-direction: column; padding-bottom: var(--bottom-bar-height);
    }
    .panel.active { display: flex; }

    .feed-panel {
      scroll-snap-type: y mandatory; overflow-y: scroll;
      height: calc(100vh - var(--top-bar-height) - var(--bottom-bar-height));
    }
    .video-card {
      width: 100%; height: calc(100% + 2px);
      scroll-snap-align: start; position: relative;
      display: flex; align-items: center; justify-content: center;
      background: #000; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .video-card video { width: 100%; height: 100%; object-fit: contain; }

    .video-avatar {
      position: absolute; left: 16px; bottom: 100px;
      display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 5;
    }
    .video-avatar img {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid #fff; background: #333; object-fit: cover;
    }
    .video-avatar .plus-btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 50%; width: 22px; height: 22px;
      font-size: 0.9rem; line-height: 1; display: flex; align-items: center; justify-content: center;
      cursor: pointer; margin-top: -8px;
    }

    .video-info {
      position: absolute; bottom: 20px; left: 70px; right: 60px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      padding: 10px 12px; border-radius: 14px; cursor: pointer; transition: opacity 0.2s;
    }
    .video-info.hidden { opacity: 0; pointer-events: none; }
    .video-info .username { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 4px; }
    .video-info .desc { font-size: 0.8rem; color: #ccc; margin-top: 4px; }

    .video-actions {
      position: absolute; right: 12px; bottom: 30px;
      display: flex; flex-direction: column; gap: 18px; align-items: center;
    }
    .video-actions button {
      background: none; border: none; color: #fff; font-size: 1.6rem;
      cursor: pointer; display: flex; flex-direction: column; align-items: center;
    }
    .video-actions span { font-size: 0.7rem; margin-top: -2px; }

    .sound-btn {
      position: absolute; top: 16px; right: 16px;
      background: rgba(0,0,0,0.5); border-radius: 50%; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #fff; z-index: 5; cursor: pointer;
    }
    .speed-indicator {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.75); color: #fff; padding: 8px 18px;
      border-radius: 24px; font-size: 1.1rem; font-weight: 700; display: none; z-index: 6;
    }
    .like-animation {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 5rem; color: var(--accent); pointer-events: none;
      animation: likeBoom 0.6s ease-out forwards;
    }
    @keyframes likeBoom {
      0% { transform: translate(-50%,-50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; }
    }
    .progress-bar {
      position: absolute; bottom: 0; left: 0; height: 3px;
      background: var(--accent); width: 0%; z-index: 7; transition: width 0.1s linear;
    }

    .profile-panel { align-items: center; padding: 2rem 1rem; gap: 0.8rem; }
    .profile-panel .avatar-img {
      width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
      background: #333; cursor: pointer;
    }
    .profile-panel h3 { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .profile-panel .nickname { color: var(--text2); font-size: 0.9rem; cursor: pointer; }
    .profile-panel .stats { color: var(--text2); font-size: 0.85rem; }
    .profile-panel button {
      background: var(--accent); color: #fff; padding: 10px 24px;
      border-radius: 24px; border: none; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; margin: 4px;
    }
    .profile-videos {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
      width: 100%; margin-top: 0.5rem;
    }
    .profile-videos .thumb {
      position: relative; aspect-ratio: 9/16; background: #000;
      overflow: hidden; cursor: pointer;
    }
    .profile-videos .thumb video { width: 100%; height: 100%; object-fit: cover; }

    .verified-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%; background: #22c55e;
      font-size: 10px; color: #fff;
    }

    .log-panel { padding: 1rem; }
    .log-entry {
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
      padding: 6px 10px; border-radius: 8px; margin: 2px 0;
      background: rgba(255,255,255,0.03); border-left: 4px solid var(--accent);
    }
    .log-entry.info { border-left-color: #6c8cff; }
    .log-entry.warn { border-left-color: #f59e0b; }
    .log-entry.error { border-left-color: #ff4444; }
    .log-entry .log-time { color: #888; margin-right: 8px; font-size: 0.65rem; }

    .comments-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50;
      display: none; align-items: flex-end; justify-content: center;
    }
    .comments-overlay.active { display: flex; }
    .comments-panel {
      background: var(--surface); width: 100%; max-height: 70%;
      border-radius: 24px 24px 0 0; padding: 1.2rem; overflow-y: auto;
    }
    .comments-panel h3 { margin-bottom: 1rem; font-size: 1.1rem; }
    .comment-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .comment-item .author { font-weight: 700; color: var(--accent); margin-right: 6px; }
    .comment-input { display: flex; gap: 8px; margin-top: 12px; }
    .comment-input input {
      flex: 1; padding: 12px; border-radius: 20px;
      border: 1px solid var(--border); background: #000; color: #fff;
    }
    .comment-input button {
      background: var(--accent); color: #fff; border: none;
      border-radius: 20px; padding: 12px 18px; cursor: pointer; font-weight: 600;
    }

    .bottom-bar {
      height: var(--bottom-bar-height); background: var(--surface);
      border-top: 1px solid var(--border); display: flex; align-items: center;
      justify-content: space-around; position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
    }
    .bottom-bar .nav-item {
      display: flex; flex-direction: column; align-items: center;
      color: var(--text2); cursor: pointer; font-size: 0.7rem; padding: 6px 0;
    }
    .bottom-bar .nav-item.active { color: #fff; }
    .bottom-bar .nav-item .icon { font-size: 1.4rem; margin-bottom: 2px; }

    .unmute-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 10px 24px;
      border-radius: 30px; font-size: 1rem; font-weight: 600; z-index: 8;
      display: none; cursor: pointer;
    }
    .unmute-overlay.show { display: block; }

    .settings-panel {
      background: var(--surface); border-radius: 20px; padding: 1.5rem;
      width: 100%; max-width: 500px; margin: 0 auto;
      display: none; flex-direction: column; gap: 1rem;
    }
    .settings-panel.active { display: flex; }
    .settings-tabs { display: flex; gap: 4px; margin-bottom: 1rem; }
    .settings-tab {
      flex: 1; text-align: center; padding: 8px; background: rgba(255,255,255,0.05);
      border-radius: 12px; cursor: pointer; font-size: 0.8rem;
    }
    .settings-tab.active { background: var(--accent); color: #fff; }

    .admin-user-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px; background: rgba(255,255,255,0.03); border-radius: 10px; margin: 4px 0;
      flex-wrap: wrap; gap: 4px;
    }
    .admin-user-item button { padding: 4px 10px; font-size: 0.7rem; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 60;
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--surface); border-radius: 20px; padding: 1.5rem;
      width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto;
      border: 1px solid var(--border);
    }
    .modal-box h3 { margin-bottom: 1rem; }
    .modal-box select, .modal-box input {
      width: 100%; padding: 10px; border-radius: 12px;
      border: 1px solid var(--border); background: #000; color: #fff; margin: 4px 0;
    }
  </style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h1>Tik<span>Tok</span> UI</h1>
    <p style="color:#aaa;margin-bottom:1.2rem;">Локальное хранилище</p>
    <input type="text" id="authLogin" placeholder="Логин">
    <input type="password" id="authPass" placeholder="Пароль">
    <button class="btn-login" id="loginBtn">Войти</button>
    <button class="btn-register" id="registerBtn">Создать аккаунт</button>
    <p class="auth-error" id="authError"></p>
  </div>
</div>

<div class="app" id="app">
  <div class="top-bar">
    <h2>TikTok UI</h2>
    <div style="display:flex;gap:8px;">
      <button id="randomFeedBtn">🔀</button>
      <button id="toggleInfoBtn">📝</button>
      <button id="logoutBtn">Выйти</button>
    </div>
  </div>
  <div class="content">
    <div class="panel feed-panel active" id="feedPanel"></div>
    <div class="panel feed-panel" id="trendingPanel"></div>
    <div class="panel profile-panel" id="profilePanel">
      <img class="avatar-img" id="profileAvatar" src="" alt="Аватар">
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <h3 id="profileName"></h3>
      <p class="nickname" id="profileNick"></p>
      <p class="stats" id="profileStats"></p>
      <button id="settingsBtn">⚙️ Настройки</button>
      <div class="settings-panel" id="settingsPanel">
        <div class="settings-tabs">
          <div class="settings-tab active" data-settings="account">Управление</div>
          <div class="settings-tab" data-settings="privacy">Конфиденциальность</div>
          <div class="settings-tab" data-settings="admin" style="display:none;">Админ-панель</div>
        </div>
        <div id="settingsContent"></div>
      </div>
      <button id="changeNickBtn">✏️ Ник</button>
      <button id="changeUserBtn">✏️ @user</button>
      <button id="changePasswordBtn">🔒 Пароль</button>
      <button id="profileUploadBtn">📤 Загрузить видео</button>
      <input type="file" id="videoInput" accept="video/*" style="display:none;">
      <div id="uploadStatus" style="color:var(--text2);"></div>
      <button id="followBtn" style="display:none;">Подписаться</button>
      <div class="profile-videos" id="profileVideos"></div>
    </div>
    <div class="panel log-panel" id="logPanel"></div>
  </div>
  <div class="bottom-bar">
    <div class="nav-item active" data-panel="feedPanel"><span class="icon">🏠</span> Лента</div>
    <div class="nav-item" data-panel="trendingPanel"><span class="icon">🔥</span> Тренды</div>
    <div class="nav-item" data-panel="profilePanel"><span class="icon">👤</span> Профиль</div>
    <div class="nav-item" data-panel="logPanel"><span class="icon">📋</span> Логи</div>
  </div>
</div>

<div class="comments-overlay" id="commentsOverlay">
  <div class="comments-panel" id="commentsPanel">
    <h3>💬 Комментарии</h3>
    <div id="commentsList"></div>
    <div class="comment-input"><input type="text" id="commentInput" placeholder="Написать..."><button id="sendCommentBtn">Отправить</button></div>
    <button id="closeCommentsBtn" style="margin-top:12px;width:100%;background:var(--surface);color:#fff;border:1px solid var(--border);padding:12px;border-radius:20px;">Закрыть</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
(async function() {
  const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
  const logs=[];
  let lc=0;
  function addLog(msg,type='info'){
    lc++;const t=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    logs.push({num:lc,time:t,msg,type});if(logs.length>500)logs.shift();
    renderLogs();console[type==='error'?'error':type==='warn'?'warn':'log'](`#${lc} ${msg}`);
  }
  function renderLogs(){
    const p=$('#logPanel');if(!p)return;
    p.innerHTML=logs.map(l=>`<div class="log-entry ${l.type}"><span class="log-time">${l.time}</span>#${l.num} ${l.msg}</div>`).join('');
    p.scrollTop=p.scrollHeight;
  }
  addLog('Старт N21');

  indexedDB.deleteDatabase('TikTokDB_v5');
  indexedDB.deleteDatabase('TikTokDB_v4');
  indexedDB.deleteDatabase('TikTokDB_v3');
  indexedDB.deleteDatabase('TikTokDB');

  const DB='TikTokUI_N21', DBV=1;
  const ST_ACC='accounts', ST_VID='videos', ST_FOL='follows', ST_COM='comments', ST_HIST='history', ST_MOD='modlog';
  let db, currentUser=localStorage.getItem('tiktok_user')||'';
  let audioEnabled=true, showInfo=true;

  function openDB(){
    return new Promise((resolve, reject)=>{
      const req=indexedDB.open(DB, DBV);
      req.onupgradeneeded=e=>{
        const d=e.target.result;
        if(!d.objectStoreNames.contains(ST_ACC)) d.createObjectStore(ST_ACC, {keyPath:'login'});
        if(!d.objectStoreNames.contains(ST_VID)) d.createObjectStore(ST_VID, {keyPath:'id', autoIncrement:true});
        if(!d.objectStoreNames.contains(ST_FOL)) d.createObjectStore(ST_FOL, {keyPath:'id', autoIncrement:true});
        if(!d.objectStoreNames.contains(ST_COM)) d.createObjectStore(ST_COM, {keyPath:'id', autoIncrement:true});
        if(!d.objectStoreNames.contains(ST_HIST)) d.createObjectStore(ST_HIST, {keyPath:'id', autoIncrement:true});
        if(!d.objectStoreNames.contains(ST_MOD)) d.createObjectStore(ST_MOD, {keyPath:'id', autoIncrement:true});
      };
      req.onsuccess=async e=>{
        db=e.target.result;
        const adminAcc=await new Promise(r=>{
          const tx=db.transaction([ST_ACC],'readonly');
          tx.objectStore(ST_ACC).get('Grustish').onsuccess=ev=>r(ev.target.result);
        });
        if(!adminAcc){
          const tx=db.transaction([ST_ACC],'readwrite');
          tx.objectStore(ST_ACC).put({
            login:'Grustish',
            password:'Grustish112',
            created:Date.now(),
            nickname:'Grustish Admin',
            avatar:'',
            role:'admin',
            verified:true,
            banned:false,
            banReason:'',
            banUntil:0,
            warnings:[]
          });
          addLog('Администратор Grustish создан');
        }
        addLog('База данных готова');
        resolve();
      };
      req.onerror=()=>{addLog('Ошибка БД','error');reject();};
    });
  }
  await openDB();

  async function getAcc(login){return new Promise(r=>{db.transaction([ST_ACC],'readonly').objectStore(ST_ACC).get(login).onsuccess=e=>r(e.target.result||null)})}
  async function saveAcc(login,data){db.transaction([ST_ACC],'readwrite').objectStore(ST_ACC).put({login,...data})}
  async function getAllAccs(){return new Promise(r=>{db.transaction([ST_ACC],'readonly').objectStore(ST_ACC).getAll().onsuccess=e=>r(e.target.result||[])})}
  async function addModAction(action){db.transaction([ST_MOD],'readwrite').objectStore(ST_MOD).add({...action,ts:Date.now()})}

  async function registerUser(l,p){
    if(await getAcc(l)){addLog('Логин занят','warn');return false}
    await saveAcc(l,{password:p, created:Date.now(), nickname:l, avatar:'', role:'user', verified:false, banned:false, banReason:'', banUntil:0, warnings:[]});
    addLog('Аккаунт создан');
    return true;
  }
  async function loginUser(l,p){const u=await getAcc(l); return u&&u.password===p}
  async function checkBan(l){
    const u=await getAcc(l);
    if(!u) return false;
    if(u.banned && u.banUntil>0 && Date.now()>u.banUntil){
      u.banned=false; u.banReason=''; u.banUntil=0;
      await saveAcc(l,u);
      return false;
    }
    return u.banned;
  }

  function saveVideo(blob,name,dur,user){
    return new Promise(r=>{db.transaction([ST_VID],'readwrite').objectStore(ST_VID).add({blob,name,duration:dur,user,ts:Date.now(),likes:0,views:0,comments:0}).onsuccess=e=>r(e.target.result)});
  }
  function getAllVideos(){return new Promise(r=>{db.transaction([ST_VID],'readonly').objectStore(ST_VID).getAll().onsuccess=e=>r(e.target.result||[])})}
  function updateVideo(id,data){return new Promise(r=>{const tx=db.transaction([ST_VID],'readwrite');const s=tx.objectStore(ST_VID);s.get(id).onsuccess=e=>{const v=e.target.result;Object.assign(v,data);s.put(v);r()}})}
  function deleteVideo(id){return new Promise(r=>{db.transaction([ST_VID],'readwrite').objectStore(ST_VID).delete(id).onsuccess=()=>r()})}
  function getVideoById(id){return new Promise(r=>{db.transaction([ST_VID],'readonly').objectStore(ST_VID).get(id).onsuccess=e=>r(e.target.result)})}

  async function follow(follower,following){db.transaction([ST_FOL],'readwrite').objectStore(ST_FOL).add({follower,following,ts:Date.now()})}
  async function unfollow(follower,following){const tx=db.transaction([ST_FOL],'readwrite');const s=tx.objectStore(ST_FOL);const all=await new Promise(r=>{s.getAll().onsuccess=e=>r(e.target.result)});const rec=all.find(f=>f.follower===follower&&f.following===following);if(rec)s.delete(rec.id)}
  async function isFollowing(follower,following){const all=await new Promise(r=>{db.transaction([ST_FOL],'readonly').objectStore(ST_FOL).getAll().onsuccess=e=>r(e.target.result)});return all.some(f=>f.follower===follower&&f.following===following)}
  async function getFollowersCount(u){const all=await new Promise(r=>{db.transaction([ST_FOL],'readonly').objectStore(ST_FOL).getAll().onsuccess=e=>r(e.target.result)});return all.filter(f=>f.following===u).length}
  async function getFollowingCount(u){const all=await new Promise(r=>{db.transaction([ST_FOL],'readonly').objectStore(ST_FOL).getAll().onsuccess=e=>r(e.target.result)});return all.filter(f=>f.follower===u).length}

  function addComment(videoId,user,text){return new Promise(r=>{db.transaction([ST_COM],'readwrite').objectStore(ST_COM).add({videoId,user,text,ts:Date.now()}).onsuccess=async()=>{const v=await getVideoById(videoId);if(v)await updateVideo(videoId,{comments:(v.comments||0)+1});r()}})}
  function getComments(videoId){return new Promise(r=>{db.transaction([ST_COM],'readonly').objectStore(ST_COM).getAll().onsuccess=e=>r(e.target.result.filter(c=>c.videoId===videoId))})}

  function addHistory(videoId,user){db.transaction([ST_HIST],'readwrite').objectStore(ST_HIST).add({videoId,user,ts:Date.now()})}
  function getHistory(user){return new Promise(r=>{db.transaction([ST_HIST],'readonly').objectStore(ST_HIST).getAll().onsuccess=e=>r(e.target.result.filter(h=>h.user===user))})}

  function showAuthError(m){$('#authError').textContent=m;$('#authError').style.display='block';setTimeout(()=>$('#authError').style.display='none',3000)}
  $('#loginBtn').addEventListener('click',async()=>{
    const l=$('#authLogin').value.trim(),p=$('#authPass').value.trim();
    if(!l||!p)return showAuthError('Заполните поля');
    if(await loginUser(l,p)){
      if(await checkBan(l)){
        const acc=await getAcc(l);
        showAuthError(`Аккаунт заблокирован${acc.banReason?': '+acc.banReason:''}. ${acc.banUntil? 'До '+new Date(acc.banUntil).toLocaleString():'Навсегда'}`);
        return;
      }
      const acc=await getAcc(l);
      if(acc.warnings&&acc.warnings.length>0){
        alert(`У вас ${acc.warnings.length} предупреждений:\n${acc.warnings.join('\n')}`);
      }
      currentUser=l;localStorage.setItem('tiktok_user',l);
      $('#authScreen').classList.add('hidden');
      await loadApp();
    }else showAuthError('Неверный логин или пароль');
  });
  $('#registerBtn').addEventListener('click',async()=>{
    const l=$('#authLogin').value.trim(),p=$('#authPass').value.trim();
    if(!l||!p)return showAuthError('Заполните поля');
    if(l.length<3)return showAuthError('Логин: мин 3 символа');

      currentUser=l;localStorage.setItem('tiktok_user',l);
      $('#authScreen').classList.add('hidden');
      await loadApp();
    }else showAuthError('Логин занят');
  });
  $('#logoutBtn').addEventListener('click',()=>{localStorage.removeItem('tiktok_user');location.reload()});

  $$('.nav-item').forEach(item=>{item.addEventListener('click',async()=>{$$('.nav-item').forEach(i=>i.classList.remove('active'));item.classList.add('active');const id=item.dataset.panel;$$('.panel').forEach(p=>p.classList.remove('active'));$('#'+id).classList.add('active');if(id==='trendingPanel')await renderTrending();if(id==='profilePanel')await renderProfile(currentUser);if(id==='logPanel')renderLogs()})});

  $('#toggleInfoBtn').addEventListener('click',()=>{showInfo=!showInfo;document.querySelectorAll('.video-info').forEach(el=>el.classList.toggle('hidden',!showInfo))});

  function isVideo(file){if(file.type&&file.type.startsWith('video/'))return true;const n=file.name.toLowerCase();return n.endsWith('.mp4')||n.endsWith('.webm')||n.endsWith('.mov')||n.endsWith('.mkv')||n.endsWith('.avi')||n.endsWith('.3gp')}
  async function processVideo(file){
    if(!isVideo(file))return;
    let dur=0;
    try{dur=await new Promise((res,rej)=>{const v=document.createElement('video');v.preload='metadata';const u=URL.createObjectURL(file);v.src=u;v.onloadedmetadata=()=>{URL.revokeObjectURL(u);res(v.duration)};v.onerror=()=>{URL.revokeObjectURL(u);rej()};setTimeout(()=>{URL.revokeObjectURL(u);rej()},8000)})}catch(e){}
    if(dur>18000)return;
    await saveVideo(file,file.name,dur,currentUser);
    addLog('Видео загружено');
    await renderFeed(true);
    await renderProfile(currentUser);
  }
  $('#videoInput').addEventListener('change',async e=>{const f=e.target.files[0];if(f)await processVideo(f);$('#videoInput').value=''});
  $('#profileUploadBtn').addEventListener('click',()=>$('#videoInput').click());

  $('#profileAvatar').addEventListener('click',()=>$('#avatarInput').click());
  $('#avatarInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=async ev=>{await saveAcc(currentUser,{...await getAcc(currentUser),avatar:ev.target.result});addLog('Аватар обновлён');renderProfile(currentUser)};reader.readAsDataURL(f)});

  $('#changeNickBtn').addEventListener('click',async()=>{const nick=prompt('Новый ник:',(await getAcc(currentUser))?.nickname||currentUser);if(nick&&nick.trim()){await saveAcc(currentUser,{...await getAcc(currentUser),nickname:nick.trim()});addLog('Ник изменён');renderProfile(currentUser)}});

  $('#changeUserBtn').addEventListener('click',async()=>{
    const newLogin=prompt('Новый @user:',currentUser);
    if(newLogin&&newLogin.trim()&&newLogin!==currentUser){
      if(await getAcc(newLogin.trim())){addLog('Занят','warn');return}
      const acc=await getAcc(currentUser);
      await saveAcc(newLogin.trim(),acc);
      db.transaction([ST_ACC],'readwrite').objectStore(ST_ACC).delete(currentUser);
      currentUser=newLogin.trim();localStorage.setItem('tiktok_user',currentUser);
      addLog('@user изменён');renderProfile(currentUser);
    }
  });

  $('#changePasswordBtn').addEventListener('click',async()=>{
    const old=prompt('Старый пароль:');
    const acc=await getAcc(currentUser);
    if(!acc||acc.password!==old){addLog('Неверный пароль','warn');return}
    const newPass=prompt('Новый пароль:');
    if(newPass&&newPass.length>=3){await saveAcc(currentUser,{...acc,password:newPass});addLog('Пароль изменён')}
  });

  $('#settingsBtn').addEventListener('click',async()=>{
    const acc=await getAcc(currentUser);
    document.querySelector('.settings-tab[data-settings="admin"]').style.display = (acc&&acc.role==='admin')?'block':'none';
    $('#settingsPanel').classList.toggle('active');
    if($('#settingsPanel').classList.contains('active')) switchSettingsTab('account');
  });

  $$('.settings-tab').forEach(tab=>{tab.addEventListener('click',()=>switchSettingsTab(tab.dataset.settings))});

  function switchSettingsTab(tab){
    $$('.settings-tab').forEach(t=>t.classList.remove('active'));
    document.querySelector(`.settings-tab[data-settings="${tab}"]`).classList.add('active');
    const content=$('#settingsContent');
    if(tab==='account'){
      content.innerHTML=`<p>Управление аккаунтом.</p><button id="deleteOwnAccountBtn" style="background:#ff4444;color:#fff;margin-top:10px;">🗑️ Удалить аккаунт</button>`;
      $('#deleteOwnAccountBtn')?.addEventListener('click',async()=>{
        if(confirm('Удалить ваш аккаунт безвозвратно?')){
          await db.transaction([ST_ACC],'readwrite').objectStore(ST_ACC).delete(currentUser);
          localStorage.removeItem('tiktok_user'); location.reload();
        }
      });
    }else if(tab==='privacy'){
      content.innerHTML=`<p>Настройки конфиденциальности (заглушка).</p>`;
    }else if(tab==='admin'){
      renderAdminPanel(content);
    }
  }

  // ========== АДМИН-ПАНЕЛЬ ==========
  async function renderAdminPanel(container){
    container.innerHTML='<p>Загрузка...</p>';
    const users=await getAllAccs();
    const videos=await getAllVideos();
    let html=`<h4>Пользователи (${users.length})</h4>`;
    users.forEach(u=>{
      const banInfo = u.banned ? (u.banUntil ? `🚫 до ${new Date(u.banUntil).toLocaleDateString()}` : '🚫 навсегда') : '';
      html+=`<div class="admin-user-item">
        <span>@${u.login} ${u.verified?'<span class="verified-badge">✓</span>':''} ${banInfo} (${u.role})</span>
        <div style="display:flex;gap:4px;flex-wrap:wrap;">
          <button data-user="${u.login}" class="verify-btn">${u.verified?'Снять':'Вериф.'}</button>
          <button data-user="${u.login}" class="ban-btn">Бан</button>
          <button data-user="${u.login}" class="warn-btn">⚠️</button>
          <button data-user="${u.login}" class="view-btn">👁️</button>
          <button data-user="${u.login}" class="delete-user-btn">🗑️</button>
        </div>
      </div>`;
    });
    html+=`<h4 style="margin-top:1rem;">Видео (${videos.length})</h4>`;
    videos.forEach(v=>{
      html+=`<div class="admin-user-item"><span>🎬 ${v.name} от @${v.user}</span><button data-videoid="${v.id}" class="delete-video-admin-btn">🗑️</button></div>`;
    });
    container.innerHTML=html;

    container.querySelectorAll('.verify-btn').forEach(b=>b.addEventListener('click',async()=>{
      const login=b.dataset.user; const acc=await getAcc(login);
      if(acc){acc.verified=!acc.verified; await saveAcc(login,acc); addLog(`${login} верификация: ${acc.verified}`); renderAdminPanel(container);}
    }));
    container.querySelectorAll('.delete-user-btn').forEach(b=>b.addEventListener('click',async()=>{
      const login=b.dataset.user;
      if(confirm(`Удалить @${login}?`)){await db.transaction([ST_ACC],'readwrite').objectStore(ST_ACC).delete(login); addLog(`Удалён ${login}`); renderAdminPanel(container);}
    }));
    container.querySelectorAll('.delete-video-admin-btn').forEach(b=>b.addEventListener('click',async()=>{
      const id=+b.dataset.videoid; if(confirm('Удалить видео?')){await deleteVideo(id); addLog(`Видео #${id} удалено`); renderAdminPanel(container);}
    }));
    container.querySelectorAll('.ban-btn').forEach(b=>b.addEventListener('click',()=>showBanModal(b.dataset.user, container)));
    container.querySelectorAll('.warn-btn').forEach(b=>b.addEventListener('click',()=>showWarnModal(b.dataset.user, container)));
    container.querySelectorAll('.view-btn').forEach(b=>b.addEventListener('click',async()=>{
      const acc=await getAcc(b.dataset.user);
      alert(`@${acc.login}\nНик: ${acc.nickname}\nРоль: ${acc.role}\nВерифицирован: ${acc.verified?'да':'нет'}\nБан: ${acc.banned? (acc.banReason||'') : 'нет'}\nПредупреждений: ${(acc.warnings||[]).length}`);
    }));
  }

  function showBanModal(login, container){
    const overlay=$('#modalOverlay');
    overlay.classList.add('active');
    $('#modalBox').innerHTML=`
      <h3>Бан @${login}</h3>
      <select id="banDuration">
        <option value="0">Навсегда</option>
        <option value="1">1 день</option>
        <option value="7">7 дней</option>
        <option value="30">30 дней</option>
      </select>
      <input type="text" id="banReason" placeholder="Причина">
      <button id="applyBanBtn">Забанить</button>
      <button id="cancelBanBtn">Отмена</button>
    `;
    $('#cancelBanBtn').addEventListener('click',()=>overlay.classList.remove('active'));
    $('#applyBanBtn').addEventListener('click',async()=>{
      const duration=+$('#banDuration').value;
      const reason=$('#banReason').value.trim();
      const acc=await getAcc(login);
      if(acc){
        acc.banned=true;
        acc.banReason=reason;
        acc.banUntil = duration>0 ? Date.now()+duration*86400000 : 0;
        await saveAcc(login,acc);
        addLog(`Бан ${login}: ${reason||'без причины'}`);
        await addModAction({type:'ban', target:login, reason, duration});
        overlay.classList.remove('active');
        renderAdminPanel(container);
      }
    });
  }

  function showWarnModal(login, container){
    const overlay=$('#modalOverlay');
    overlay.classList.add('active');
    $('#modalBox').innerHTML=`
      <h3>Предупреждение @${login}</h3>
      <select id="warnReason">
        <option>Спам</option>
        <option>Оскорбление</option>
        <option>Нарушение авторских прав</option>
        <option>Другое</option>
      </select>
      <button id="applyWarnBtn">Выдать</button>
      <button id="cancelWarnBtn">Отмена</button>
    `;
    $('#cancelWarnBtn').addEventListener('click',()=>overlay.classList.remove('active'));
    $('#applyWarnBtn').addEventListener('click',async()=>{
      const reason=$('#warnReason').value;
      const acc=await getAcc(login);
      if(acc){
        acc.warnings.push(reason);
        await saveAcc(login,acc);
        addLog(`Предупреждение ${login}: ${reason}`);
        await addModAction({type:'warn', target:login, reason});
        overlay.classList.remove('active');
        renderAdminPanel(container);
      }
    });
  }

  async function renderFeed(random=true){
    const videos=await getAllVideos();
    const feed=$('#feedPanel');feed.innerHTML='';
    if(!videos.length){feed.innerHTML='<div style="text-align:center;color:var(--text2);padding:3rem;">Нет видео</div>';return}
    if(random)videos.sort(()=>Math.random()-0.5);
    else videos.sort((a,b)=>b.ts-a.ts);
    videos.forEach(v=>feed.appendChild(createCard(v)));
  }
  async function renderTrending(){
    const videos=await getAllVideos();
    const feed=$('#trendingPanel');feed.innerHTML='';
    if(!videos.length){feed.innerHTML='<div style="text-align:center;color:var(--text2);padding:3rem;">Нет видео</div>';return}
    videos.sort((a,b)=>b.likes-a.likes);
    videos.forEach(v=>feed.appendChild(createCard(v)));
  }
  $('#randomFeedBtn').addEventListener('click',()=>renderFeed(true));

  function createCard(v){
    const card=document.createElement('div');card.className='video-card';
    const url=URL.createObjectURL(v.blob);
    card.innerHTML=`
      <video src="${url}" loop playsinline></video>
      <div class="progress-bar"></div>
      <div class="sound-btn">🔊</div>
      <div class="unmute-overlay">🔊 Нажмите для звука</div>
      <div class="speed-indicator">2x</div>
      <div class="video-avatar">
        <img src="" alt="" onerror="this.style.display='none'">
        <button class="plus-btn" data-user="${v.user}">+</button>
      </div>
      <div class="video-info ${showInfo?'':'hidden'}" data-user="${v.user}">
        <div class="username">@${v.user} · ${new Date(v.ts).toLocaleDateString()}</div>
        <div class="desc">${v.name}</div>
      </div>
      <div class="video-actions">
        <button class="like-btn" data-id="${v.id}" data-likes="${v.likes}">❤️<span>${v.likes||0}</span></button>
        <button class="comment-btn" data-id="${v.id}">💬<span>${v.comments||0}</span></button>
        <button class="del-btn" data-id="${v.id}" style="${v.user===currentUser?'':'display:none'}">🗑️</button>
      </div>`;
    const video=card.querySelector('video');
    const soundBtn=card.querySelector('.sound-btn');
    const unmute=card.querySelector('.unmute-overlay');
    const prog=card.querySelector('.progress-bar');
    const speed=card.querySelector('.speed-indicator');
    let timer,long=false;

    getAcc(v.user).then(acc=>{if(acc?.avatar)card.querySelector('.video-avatar img').src=acc.avatar});

    const updateSound=()=>{video.muted=!audioEnabled;soundBtn.textContent=audioEnabled?'🔊':'🔇';if(unmute)unmute.classList.toggle('show',!audioEnabled)};
    updateSound();
    video.play().catch(()=>{});
    soundBtn.addEventListener('click',e=>{e.stopPropagation();audioEnabled=!audioEnabled;localStorage.setItem('tiktok_audio',audioEnabled);updateSound()});
    unmute?.addEventListener('click',e=>{e.stopPropagation();audioEnabled=true;localStorage.setItem('tiktok_audio',true);updateSound()});
    video.addEventListener('timeupdate',()=>{if(video.duration)prog.style.width=(video.currentTime/video.duration*100)+'%'});
    new IntersectionObserver((entries)=>{entries.forEach(en=>{if(en.isIntersecting){video.currentTime=0;video.play().catch(()=>{});addHistory(v.id,currentUser)}else{video.pause()}})},{threshold:0.7}).observe(card);

    function likeAnim(){const h=document.createElement('div');h.className='like-animation';h.textContent='❤️';card.appendChild(h);h.addEventListener('animationend',()=>h.remove())}
    card.addEventListener('dblclick',async e=>{e.preventDefault();v.likes=(v.likes||0)+1;card.querySelector('.like-btn span').textContent=v.likes;await updateVideo(v.id,{likes:v.likes});likeAnim()});
    card.addEventListener('touchstart',()=>{timer=setTimeout(()=>{long=true;video.playbackRate=2;speed.style.display='block'},500)});
    card.addEventListener('touchend',()=>{clearTimeout(timer);if(long){video.playbackRate=1;speed.style.display='none';long=false}});
    card.addEventListener('touchmove',()=>{clearTimeout(timer);if(long){video.playbackRate=1;speed.style.display='none';long=false}});

    card.querySelector('.plus-btn')?.addEventListener('click',async e=>{e.stopPropagation();const u=e.target.dataset.user;if(u&&u!==currentUser){if(await isFollowing(currentUser,u))await unfollow(currentUser,u);else await follow(currentUser,u)}});
    card.querySelector('.video-info')?.addEventListener('click',async e=>{e.stopPropagation();const u=e.currentTarget.dataset.user;if(u){$$('.nav-item').forEach(i=>i.classList.remove('active'));document.querySelector('[data-panel="profilePanel"]').classList.add('active');$$('.panel').forEach(p=>p.classList.remove('active'));$('#profilePanel').classList.add('active');await renderProfile(u)}});
    card.querySelector('.like-btn').addEventListener('click',async function(e){e.stopPropagation();v.likes=+this.dataset.likes+1;this.dataset.likes=v.likes;this.querySelector('span').textContent=v.likes;await updateVideo(v.id,{likes:v.likes});likeAnim()});
    card.querySelector('.comment-btn').addEventListener('click',async function(e){e.stopPropagation();const id=+this.dataset.id;currentVideoId=id;await renderComments(id);$('#commentsOverlay').classList.add('active')});
    card.querySelector('.del-btn')?.addEventListener('click',async function(e){e.stopPropagation();if(!confirm('Удалить?'))return;await deleteVideo(+this.dataset.id);await renderFeed(true);await renderProfile(currentUser)});
    return card;
  }

  let currentVideoId=null;
  async function renderComments(id){
    const comments=await getComments(id);
    const list=$('#commentsList');list.innerHTML='';
    if(!comments.length)list.innerHTML='<div style="color:var(--text2);padding:1rem;">Нет комментариев</div>';
    comments.forEach(c=>{list.innerHTML+=`<div class="comment-item"><span class="author">@${c.user}</span>${c.text}</div>`});
  }
  $('#sendCommentBtn').addEventListener('click',async()=>{const t=$('#commentInput').value.trim();if(!t||!currentVideoId)return;await addComment(currentVideoId,currentUser,t);$('#commentInput').value='';await renderComments(currentVideoId)});
  $('#closeCommentsBtn').addEventListener('click',()=>$('#commentsOverlay').classList.remove('active'));
  $('#commentsOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)$('#commentsOverlay').classList.remove('active')});

  async function renderProfile(user){
    const acc=await getAcc(user);
    $('#profileAvatar').src=acc?.avatar||'';
    let nameHtml = '@'+user;
    if(acc?.verified) nameHtml += ' <span class="verified-badge">✓</span>';
    $('#profileName').innerHTML = nameHtml;
    $('#profileNick').textContent=acc?.nickname||user;
    const videos=await getAllVideos();
    const my=videos.filter(v=>v.user===user);
    const mb=(my.reduce((s,v)=>s+(v.blob?.size||0),0)/(1024*1024)).toFixed(1);
    const followers=await getFollowersCount(user);
    const following=await getFollowingCount(user);
    const hist=await getHistory(user);
    $('#profileStats').innerHTML=`Видео: ${my.length}<br>Занято: ${mb} МБ<br>Подписчики: ${followers} · Подписки: ${following}<br>Просмотров: ${hist.length}`;
    if(user!==currentUser){
      const isF=await isFollowing(currentUser,user);
      $('#followBtn').style.display='block';$('#followBtn').textContent=isF?'Отписаться':'Подписаться';
      $('#followBtn').onclick=async()=>{if(isF)await unfollow(currentUser,user);else await follow(currentUser,user);renderProfile(user)};
    }else{$('#followBtn').style.display='none'}
    const grid=$('#profileVideos');grid.innerHTML='';
    if(my.length){my.sort((a,b)=>b.ts-a.ts).forEach(v=>{const d=document.createElement('div');d.className='thumb';d.innerHTML=`<video src="${URL.createObjectURL(v.blob)}" muted loop></video>`;d.addEventListener('click',()=>{$$('.nav-item').forEach(i=>i.classList.remove('active'));document.querySelector('[data-panel="feedPanel"]').classList.add('active');$$('.panel').forEach(p=>p.classList.remove('active'));$('#feedPanel').classList.add('active');renderFeedStartingFrom(v.id)});grid.appendChild(d)})}else{grid.innerHTML='<div style="color:var(--text2);padding:1rem;text-align:center;">Нет видео</div>'}
  }
  async function renderFeedStartingFrom(videoId){
    const videos=await getAllVideos();const feed=$('#feedPanel');feed.innerHTML='';
    videos.sort((a,b)=>b.ts-a.ts);const idx=videos.findIndex(v=>v.id===videoId);
    const reordered=videos.slice(idx).concat(videos.slice(0,idx));
    reordered.forEach(v=>feed.appendChild(createCard(v)));feed.scrollTop=0;
  }

  async function loadApp(){
    addLog(`Вход: ${currentUser}`);
    await renderFeed(true);
    await renderProfile(currentUser);
    renderLogs();
  }
  if(currentUser){$('#authScreen').classList.add('hidden');window.addEventListener('DOMContentLoaded',loadApp)}
})();
</script>
</body>
</html>
