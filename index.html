<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>TikTok UI · Admin v2</title>
  <style>
    :root {
      --bg: #000; --surface: #121212; --card: #1a1a1a;
      --text: #fff; --text2: #aaa; --accent: #ff0050; --accent2: #00f2ea;
      --border: rgba(255,255,255,0.1); --bottom-bar-height: 60px; --top-bar-height: 56px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); font-family: 'Inter', 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; color: var(--text); }
    .auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .auth-screen.hidden { display: none; }
    .auth-box { background: var(--surface); border-radius: 24px; padding: 2rem; width: 90%; max-width: 360px; text-align: center; border: 1px solid var(--border); }
    .auth-box h1 { font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 700; }
    .auth-box h1 span { color: var(--accent); }
    .auth-box input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 14px; border: 1px solid var(--border); background: #000; color: #fff; font-size: 1rem; outline: none; }
    .auth-box input:focus { border-color: var(--accent); }
    .auth-box button { width: 100%; padding: 14px; margin: 6px 0; border-radius: 14px; border: none; font-size: 1rem; cursor: pointer; font-weight: 600; }
    .btn-login { background: var(--accent); color: #fff; }
    .btn-register { background: var(--accent2); color: #000; }
    .auth-error { color: #ff4444; font-size: 0.85rem; margin-top: 10px; display: none; }

    .app { height: 100vh; display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: var(--surface); z-index: 10; border-bottom: 1px solid var(--border); height: var(--top-bar-height); }
    .top-bar h2 { font-size: 1.3rem; font-weight: 700; }
    .top-bar button { background: none; border: 1px solid var(--border); color: #fff; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
    .content { flex: 1; position: relative; overflow: hidden; }
    .panel { position: absolute; inset: 0; overflow-y: auto; display: none; flex-direction: column; padding-bottom: var(--bottom-bar-height); }
    .panel.active { display: flex; }
    .feed-panel { scroll-snap-type: y mandatory; overflow-y: scroll; height: calc(100vh - var(--top-bar-height) - var(--bottom-bar-height)); }
    .video-card { width: 100%; height: calc(100% + 2px); scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #000; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .video-card video { width: 100%; height: 100%; object-fit: contain; }
    .video-avatar { position: absolute; left: 16px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 5; }
    .video-avatar img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; background: #333; object-fit: cover; }
    .video-avatar .plus-btn { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 0.9rem; cursor: pointer; margin-top: -8px; }
    .video-info { position: absolute; bottom: 20px; left: 70px; right: 60px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 10px 12px; border-radius: 14px; cursor: pointer; transition: opacity 0.2s; }
    .video-info.hidden { opacity: 0; pointer-events: none; }
    .video-info .username { font-weight: 600; font-size: 0.9rem; }
    .video-info .desc { font-size: 0.8rem; color: #ccc; margin-top: 4px; }
    .video-actions { position: absolute; right: 12px; bottom: 30px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
    .video-actions button { background: none; border: none; color: #fff; font-size: 1.6rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
    .video-actions span { font-size: 0.7rem; margin-top: -2px; }
    .sound-btn { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.5); border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #fff; z-index: 5; cursor: pointer; }
    .speed-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 8px 18px; border-radius: 24px; font-size: 1.1rem; font-weight: 700; display: none; z-index: 6; }
    .like-animation { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 5rem; color: var(--accent); pointer-events: none; animation: likeBoom 0.6s ease-out forwards; }
    @keyframes likeBoom { 0% { transform: translate(-50%,-50%) scale(0.5); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; } }
    .progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--accent); width: 0%; z-index: 7; transition: width 0.1s linear; }
    .profile-panel { align-items: center; padding: 2rem 1rem; gap: 0.8rem; }
    .profile-panel .avatar-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #333; cursor: pointer; }
    .profile-panel h3 { font-size: 1.2rem; font-weight: 700; }
    .profile-panel .nickname { color: var(--text2); font-size: 0.9rem; }
    .profile-panel .stats { color: var(--text2); font-size: 0.85rem; }
    .profile-panel button { background: var(--accent); color: #fff; padding: 10px 24px; border-radius: 24px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin: 4px; }
    .profile-videos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 100%; margin-top: 0.5rem; }
    .profile-videos .thumb { position: relative; aspect-ratio: 9/16; background: #000; overflow: hidden; cursor: pointer; }
    .profile-videos .thumb video { width: 100%; height: 100%; object-fit: cover; }
    .log-panel { padding: 1rem; }
    .log-entry { font-family: monospace; font-size: 0.7rem; padding: 6px 10px; border-radius: 8px; margin: 2px 0; background: rgba(255,255,255,0.03); border-left: 4px solid var(--accent); }
    .log-entry.info { border-left-color: #6c8cff; }
    .log-entry.warn { border-left-color: #f59e0b; }
    .log-entry.error { border-left-color: #ff4444; }
    .log-entry .log-time { color: #888; margin-right: 8px; font-size: 0.65rem; }
    .comments-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
    .comments-overlay.active { display: flex; }
    .comments-panel { background: var(--surface); width: 100%; max-height: 70%; border-radius: 24px 24px 0 0; padding: 1.2rem; overflow-y: auto; }
    .comments-panel h3 { margin-bottom: 1rem; font-size: 1.1rem; }
    .comment-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .comment-item .author { font-weight: 700; color: var(--accent); margin-right: 6px; }
    .comment-input { display: flex; gap: 8px; margin-top: 12px; }
    .comment-input input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid var(--border); background: #000; color: #fff; }
    .comment-input button { background: var(--accent); color: #fff; border: none; border-radius: 20px; padding: 12px 18px; cursor: pointer; font-weight: 600; }
    .bottom-bar { height: var(--bottom-bar-height); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; position: absolute; bottom: 0; left: 0; right: 0; z-index: 20; }
    .bottom-bar .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text2); cursor: pointer; font-size: 0.7rem; padding: 6px 0; }
    .bottom-bar .nav-item.active { color: #fff; }
    .bottom-bar .nav-item .icon { font-size: 1.4rem; margin-bottom: 2px; }
    .settings-panel { background: var(--surface); border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 500px; margin: 0 auto; display: none; flex-direction: column; gap: 1rem; }
    .settings-panel.active { display: flex; }
    .settings-tabs { display: flex; gap: 4px; margin-bottom: 1rem; }
    .settings-tab { flex: 1; text-align: center; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 12px; cursor: pointer; font-size: 0.8rem; }
    .settings-tab.active { background: var(--accent); color: #fff; }
    .admin-user-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 12px; margin: 6px 0; flex-wrap: wrap; gap: 6px; border: 1px solid var(--border); }
    .admin-user-item button { padding: 6px 12px; font-size: 0.7rem; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; }
    .admin-user-item button.danger { background: rgba(255,50,50,0.3); border-color: rgba(255,50,50,0.5); }
    .admin-user-item button.success { background: rgba(50,255,100,0.2); border-color: rgba(50,255,100,0.4); }
    .admin-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 1rem; }
    .admin-stat { background: rgba(255,255,255,0.05); padding: 10px 16px; border-radius: 14px; border: 1px solid var(--border); font-size: 0.8rem; }
    .admin-stat b { display: block; font-size: 1.2rem; }
    .admin-search { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: #000; color: #fff; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h1>Tik<span>Tok</span> UI</h1>
    <p style="color:#aaa;margin-bottom:1.2rem;">Облачная версия</p>
    <input type="text" id="authLogin" placeholder="Логин"><input type="password" id="authPass" placeholder="Пароль">
    <button class="btn-login" id="loginBtn">Войти</button><button class="btn-register" id="registerBtn">Создать аккаунт</button>
    <p class="auth-error" id="authError"></p>
  </div>
</div>

<div class="app" id="app">
  <div class="top-bar"><h2>TikTok UI</h2><div style="display:flex;gap:8px;"><button id="randomFeedBtn">🔀</button><button id="toggleInfoBtn">📝</button><button id="logoutBtn">Выйти</button></div></div>
  <div class="content">
    <div class="panel feed-panel active" id="feedPanel"></div>
    <div class="panel feed-panel" id="trendingPanel"></div>
    <div class="panel profile-panel" id="profilePanel">
      <img class="avatar-img" id="profileAvatar" src="" alt="Аватар"><input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <h3 id="profileName"></h3><p class="nickname" id="profileNick"></p><p class="stats" id="profileStats"></p>
      <button id="settingsBtn">⚙️ Настройки</button>
      <div class="settings-panel" id="settingsPanel">
        <div class="settings-tabs">
          <div class="settings-tab active" data-settings="account">Управление</div>
          <div class="settings-tab" data-settings="privacy">Конфиденциальность</div>
          <div class="settings-tab" data-settings="admin" style="display:none;">Админ-панель</div>
        </div>
        <div id="settingsContent"></div>
      </div>
      <button id="changeNickBtn">✏️ Ник</button><button id="changeUserBtn">✏️ @user</button><button id="changePasswordBtn">🔒 Пароль</button>
      <button id="profileUploadBtn">📤 Загрузить видео</button><input type="file" id="videoInput" accept="video/*" style="display:none;">
      <div id="uploadStatus" style="color:var(--text2);"></div><button id="followBtn" style="display:none;">Подписаться</button>
      <div class="profile-videos" id="profileVideos"></div>
    </div>
    <div class="panel log-panel" id="logPanel"></div>
  </div>
  <div class="bottom-bar">
    <div class="nav-item active" data-panel="feedPanel"><span class="icon">🏠</span> Лента</div>
    <div class="nav-item" data-panel="trendingPanel"><span class="icon">🔥</span> Тренды</div>
    <div class="nav-item" data-panel="profilePanel"><span class="icon">👤</span> Профиль</div>
    <div class="nav-item" data-panel="logPanel"><span class="icon">📋</span> Логи</div>
  </div>
</div>
<div class="comments-overlay" id="commentsOverlay"><div class="comments-panel" id="commentsPanel"><h3>💬 Комментарии</h3><div id="commentsList"></div><div class="comment-input"><input type="text" id="commentInput" placeholder="Написать..."><button id="sendCommentBtn">Отправить</button></div><button id="closeCommentsBtn" style="margin-top:12px;width:100%;background:var(--surface);color:#fff;border:1px solid var(--border);padding:12px;border-radius:20px;">Закрыть</button></div></div>

<script>
const SUPABASE_URL='https://gtyjjzmvdhglxfjrwejh.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0eWpqem12ZGhnbHhmanJ3ZWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDc1NjMsImV4cCI6MjEwMTYyMzU2M30.8KOimAzsQbj5xPukQswdW05dvW5sat3xvyfxB44_J5Y';
async function sr(e,m='GET',b=null){const h={'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY};const r=await fetch(SUPABASE_URL+'/rest/v1/'+e,{method:m,headers:h,body:b?JSON.stringify(b):undefined});if(!r.ok){const t=await r.text();throw new Error(t)}const t=await r.text();return t?JSON.parse(t):[]}
const sg=(t,f='')=>sr(t+'?select=*'+f),si=(t,d)=>sr(t,'POST',d),su=(t,i,d)=>sr(t+'?id=eq.'+i,'PATCH',d),sd=(t,i)=>sr(t+'?id=eq.'+i,'DELETE');
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
let currentUser=localStorage.getItem('tiktok_user')||'',audioEnabled=true,showInfo=true,currentVideoId=null,logs=[],lc=0;
function addLog(m,t='info'){lc++;const ti=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});logs.push({num:lc,time:ti,msg:m,type:t});if(logs.length>500)logs.shift();renderLogs();console.log(`#${lc} ${m}`)}
function renderLogs(){const p=$('#logPanel');if(!p)return;p.innerHTML=logs.map(l=>`<div class="log-entry ${l.type}"><span class="log-time">${l.time}</span>#${l.num} ${l.msg}</div>`).join('');p.scrollTop=p.scrollHeight}
async function getUser(l){try{const u=await sg('users','&login=eq.'+encodeURIComponent(l));return u[0]||null}catch(e){return null}}
async function updateUser(l,d){const u=await getUser(l);if(u)await su('users',u.id,d)}
async function registerUser(l,p){try{if(await getUser(l))return false;await si('users',{login:l,password:p,nickname:l,avatar:'',role:'user',verified:false,banned:false,ban_reason:'',ban_until:0,warnings:[],created:Date.now()});return true}catch(e){return false}}
async function loginUser(l,p){try{const u=await getUser(l);if(!u)return false;if(u.banned){if(u.ban_until>0&&Date.now()>u.ban_until){await updateUser(l,{banned:false});return u.password===p}return false}return u.password===p}catch(e){return false}}
async function uploadVideo(blob,name,dur,user){try{const fn=Date.now()+'_'+name.replace(/[^a-zA-Z0-9.]/g,'_');const res=await fetch(SUPABASE_URL+'/storage/v1/object/tiktok-videos/'+fn,{method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':blob.type||'application/octet-stream'},body:blob});if(!res.ok)throw new Error('Storage error');const url=SUPABASE_URL+'/storage/v1/object/public/tiktok-videos/'+fn;await si('videos',{user_id:user,name:name,url:url,duration:dur||0,likes:0,views:0,comments:0,created:Date.now()});addLog('Видео загружено');return true}catch(e){addLog('Ошибка: '+e.message,'error');throw e}}
async function getAllVideos(){try{return await sg('videos')}catch(e){return[]}}
async function updateVideo(id,d){await su('videos',id,d)}
async function deleteVideo(id){await sd('videos',id)}
async function follow(a,b){await si('follows',{follower:a,following:b,created:Date.now()})}
async function unfollow(a,b){try{const f=await sg('follows','&follower=eq.'+encodeURIComponent(a)+'&following=eq.'+encodeURIComponent(b));if(f.length)await sd('follows',f[0].id)}catch(e){}}
async function isFollowing(a,b){try{const f=await sg('follows','&follower=eq.'+encodeURIComponent(a)+'&following=eq.'+encodeURIComponent(b));return f.length>0}catch(e){return false}}
async function getFollowersCount(u){try{return(await sg('follows','&following=eq.'+encodeURIComponent(u))).length}catch(e){return 0}}
async function getFollowingCount(u){try{return(await sg('follows','&follower=eq.'+encodeURIComponent(u))).length}catch(e){return 0}}
async function addComment(vid,user,text){await si('comments',{video_id:vid,user_id:user,text:text,created:Date.now()});const v=await sg('videos','&id=eq.'+vid);if(v[0])await updateVideo(vid,{comments:(v[0].comments||0)+1})}
async function getComments(vid){try{return await sg('comments','&video_id=eq.'+vid)}catch(e){return[]}}
async function addHistory(vid,user){await si('history',{video_id:vid,user_id:user,created:Date.now()})}
async function getHistory(user){try{return await sg('history','&user_id=eq.'+encodeURIComponent(user))}catch(e){return[]}}

function showAuthError(m){const e=$('#authError');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
$('#loginBtn').addEventListener('click',async()=>{const l=$('#authLogin').value.trim(),p=$('#authPass').value.trim();if(!l||!p)return showAuthError('Заполните поля');if(await loginUser(l,p)){currentUser=l;localStorage.setItem('tiktok_user',l);$('#authScreen').classList.add('hidden');await loadApp()}else showAuthError('Неверный логин или пароль')});
$('#registerBtn').addEventListener('click',async()=>{const l=$('#authLogin').value.trim(),p=$('#authPass').value.trim();if(!l||!p)return showAuthError('Заполните поля');if(l.length<3)return showAuthError('Логин: мин 3 символа');if(await registerUser(l,p)){currentUser=l;localStorage.setItem('tiktok_user',l);$('#authScreen').classList.add('hidden');await loadApp()}else showAuthError('Логин занят')});
$('#logoutBtn').addEventListener('click',()=>{localStorage.removeItem('tiktok_user');location.reload()});
$$('.nav-item').forEach(item=>item.addEventListener('click',async()=>{$$('.nav-item').forEach(i=>i.classList.remove('active'));item.classList.add('active');const id=item.dataset.panel;$$('.panel').forEach(p=>p.classList.remove('active'));$('#'+id).classList.add('active');if(id==='trendingPanel')await renderTrending();if(id==='profilePanel')await renderProfile(currentUser);if(id==='logPanel')renderLogs()}));
async function renderFeed(random=true){const v=await getAllVideos();const f=$('#feedPanel');f.innerHTML='';if(!v.length){f.innerHTML='<div style="text-align:center;color:var(--text2);padding:3rem;">Нет видео</div>';return}if(random)v.sort(()=>Math.random()-0.5);else v.sort((a,b)=>b.created-a.created);v.forEach(x=>f.appendChild(createCard(x)))}
async function renderTrending(){const v=await getAllVideos();const f=$('#trendingPanel');f.innerHTML='';if(!v.length){f.innerHTML='<div style="text-align:center;color:var(--text2);padding:3rem;">Нет видео</div>';return}v.sort((a,b)=>b.likes-a.likes);v.forEach(x=>f.appendChild(createCard(x)))}
$('#randomFeedBtn').addEventListener('click',()=>renderFeed(true));
$('#toggleInfoBtn').addEventListener('click',()=>{showInfo=!showInfo;document.querySelectorAll('.video-info').forEach(el=>el.classList.toggle('hidden',!showInfo))});
function createCard(v){const c=document.createElement('div');c.className='video-card';c.innerHTML=`<video src="${v.url}" loop playsinline></video><div class="progress-bar"></div><div class="sound-btn">🔊</div><div class="speed-indicator">2x</div><div class="video-avatar"><img src="" onerror="this.style.display='none'"><button class="plus-btn" data-user="${v.user_id}">+</button></div><div class="video-info ${showInfo?'':'hidden'}" data-user="${v.user_id}"><div class="username">@${v.user_id} · ${new Date(v.created).toLocaleDateString()}</div><div class="desc">${v.name}</div></div><div class="video-actions"><button class="like-btn" data-id="${v.id}">❤️<span>${v.likes||0}</span></button><button class="comment-btn" data-id="${v.id}">💬<span>${v.comments||0}</span></button><button class="del-btn" data-id="${v.id}" style="${v.user_id===currentUser?'':'display:none'}">🗑️</button></div>`;const video=c.querySelector('video'),soundBtn=c.querySelector('.sound-btn'),prog=c.querySelector('.progress-bar'),speed=c.querySelector('.speed-indicator');let timer,long=false;getUser(v.user_id).then(acc=>{if(acc?.avatar)c.querySelector('.video-avatar img').src=acc.avatar});const us=()=>{video.muted=!audioEnabled;soundBtn.textContent=audioEnabled?'🔊':'🔇'};us();video.play().catch(()=>{});soundBtn.addEventListener('click',e=>{e.stopPropagation();audioEnabled=!audioEnabled;us()});video.addEventListener('timeupdate',()=>{if(video.duration)prog.style.width=(video.currentTime/video.duration*100)+'%'});new IntersectionObserver(e=>{e.forEach(en=>{if(en.isIntersecting){video.currentTime=0;video.play().catch(()=>{});addHistory(v.id,currentUser)}else video.pause()})},{threshold:0.7}).observe(c);function la(){const h=document.createElement('div');h.className='like-animation';h.textContent='❤️';c.appendChild(h);h.addEventListener('animationend',()=>h.remove())}c.addEventListener('dblclick',async e=>{e.preventDefault();const l=(v.likes||0)+1;c.querySelector('.like-btn span').textContent=l;await updateVideo(v.id,{likes:l});la()});c.addEventListener('touchstart',()=>{timer=setTimeout(()=>{long=true;video.playbackRate=2;speed.style.display='block'},500)});c.addEventListener('touchend',()=>{clearTimeout(timer);if(long){video.playbackRate=1;speed.style.display='none';long=false}});c.querySelector('.plus-btn')?.addEventListener('click',async e=>{e.stopPropagation();const u=e.target.dataset.user;if(u&&u!==currentUser){if(await isFollowing(currentUser,u))await unfollow(currentUser,u);else await follow(currentUser,u)}});c.querySelector('.video-info')?.addEventListener('click',async e=>{e.stopPropagation();const u=e.currentTarget.dataset.user;if(u){$$('.nav-item').forEach(i=>i.classList.remove('active'));document.querySelector('[data-panel="profilePanel"]').classList.add('active');$$('.panel').forEach(p=>p.classList.remove('active'));$('#profilePanel').classList.add('active');await renderProfile(u)}});c.querySelector('.like-btn').addEventListener('click',async function(e){e.stopPropagation();const l=(v.likes||0)+1;this.querySelector('span').textContent=l;await updateVideo(v.id,{likes:l});la()});c.querySelector('.comment-btn').addEventListener('click',async function(e){e.stopPropagation();currentVideoId=+this.dataset.id;await renderComments(currentVideoId);$('#commentsOverlay').classList.add('active')});c.querySelector('.del-btn')?.addEventListener('click',async function(e){e.stopPropagation();if(!confirm('Удалить?'))return;await deleteVideo(+this.dataset.id);await renderFeed(true);await renderProfile(currentUser)});return c}
async function renderComments(id){const cm=await getComments(id);const l=$('#commentsList');l.innerHTML='';if(!cm.length)l.innerHTML='<div style="color:var(--text2);padding:1rem;">Нет комментариев</div>';cm.forEach(c=>{l.innerHTML+=`<div class="comment-item"><span class="author">@${c.user_id}</span>${c.text}</div>`})}
$('#sendCommentBtn').addEventListener('click',async()=>{const t=$('#commentInput').value.trim();if(!t||!currentVideoId)return;await addComment(currentVideoId,currentUser,t);$('#commentInput').value='';await renderComments(currentVideoId)});
$('#closeCommentsBtn').addEventListener('click',()=>$('#commentsOverlay').classList.remove('active'));
async function renderProfile(user){const acc=await getUser(user);if(!acc)return;$('#profileAvatar').src=acc.avatar||'';$('#profileName').innerHTML='@'+user+(acc.verified?' <span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#22c55e;font-size:10px;color:#fff;">✓</span>':'');$('#profileNick').textContent=acc.nickname||user;const v=await getAllVideos(),my=v.filter(x=>x.user_id===user);const fw=await getFollowersCount(user),fg=await getFollowingCount(user),hist=await getHistory(user);$('#profileStats').innerHTML=`Видео: ${my.length}<br>Подписчики: ${fw} · Подписки: ${fg}<br>Просмотров: ${hist.length}`;if(user!==currentUser){const isF=await isFollowing(currentUser,user);$('#followBtn').style.display='block';$('#followBtn').textContent=isF?'Отписаться':'Подписаться';$('#followBtn').onclick=async()=>{if(isF)await unfollow(currentUser,user);else await follow(currentUser,user);await renderProfile(user)}}else $('#followBtn').style.display='none';const grid=$('#profileVideos');grid.innerHTML='';if(my.length){my.sort((a,b)=>b.created-a.created).forEach(x=>{const d=document.createElement('div');d.className='thumb';d.innerHTML=`<video src="${x.url}" muted loop></video>`;d.addEventListener('click',()=>{$$('.nav-item').forEach(i=>i.classList.remove('active'));document.querySelector('[data-panel="feedPanel"]').classList.add('active');$$('.panel').forEach(p=>p.classList.remove('active'));$('#feedPanel').classList.add('active');renderFeedStartingFrom(x.id)});grid.appendChild(d)})}else grid.innerHTML='<div style="color:var(--text2);padding:1rem;">Нет видео</div>'}
async function renderFeedStartingFrom(vid){const v=await getAllVideos();const f=$('#feedPanel');f.innerHTML='';v.sort((a,b)=>b.created-a.created);const i=v.findIndex(x=>x.id===vid);const r=v.slice(i).concat(v.slice(0,i));r.forEach(x=>f.appendChild(createCard(x)));f.scrollTop=0}
$('#profileUploadBtn').addEventListener('click',()=>$('#videoInput').click());
$('#videoInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const s=$('#uploadStatus');s.textContent='Загрузка...';try{await uploadVideo(f,f.name,0,currentUser);s.textContent='✅ Загружено!';await renderFeed(true);await renderProfile(currentUser)}catch(err){s.textContent='❌ Ошибка'}setTimeout(()=>s.textContent='',3000);$('#videoInput').value=''});
$('#profileAvatar').addEventListener('click',()=>$('#avatarInput').click());
$('#avatarInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{await updateUser(currentUser,{avatar:ev.target.result});await renderProfile(currentUser)};r.readAsDataURL(f)});
$('#changeNickBtn').addEventListener('click',async()=>{const n=prompt('Новый ник:',(await getUser(currentUser))?.nickname||currentUser);if(n&&n.trim()){await updateUser(currentUser,{nickname:n.trim()});await renderProfile(currentUser)}});
$('#changePasswordBtn').addEventListener('click',async()=>{const acc=await getUser(currentUser);const o=prompt('Старый пароль:');if(!acc||acc.password!==o)return;const n=prompt('Новый пароль:');if(n&&n.length>=3){await updateUser(currentUser,{password:n})}});
$('#settingsBtn').addEventListener('click',async()=>{const acc=await getUser(currentUser);document.querySelector('.settings-tab[data-settings="admin"]').style.display=(acc&&acc.role==='admin')?'block':'none';$('#settingsPanel').classList.toggle('active');if($('#settingsPanel').classList.contains('active'))switchSettingsTab('account')});
$$('.settings-tab').forEach(tab=>tab.addEventListener('click',()=>switchSettingsTab(tab.dataset.settings)));
function switchSettingsTab(tab){$$('.settings-tab').forEach(t=>t.classList.remove('active'));document.querySelector(`.settings-tab[data-settings="${tab}"]`).classList.add('active');const c=$('#settingsContent');if(tab==='account'){c.innerHTML=`<p>Управление аккаунтом.</p><button id="delAccBtn" style="background:#ff4444;color:#fff;">🗑️ Удалить аккаунт</button>`;$('#delAccBtn')?.addEventListener('click',async()=>{if(confirm('Удалить?')){const acc=await getUser(currentUser);if(acc)await sd('users',acc.id);localStorage.removeItem('tiktok_user');location.reload()}})}else if(tab==='privacy'){c.innerHTML='<p>Конфиденциальность.</p>'}else if(tab==='admin'){renderAdminPanel(c)}}

// ===== НОВАЯ АДМИН-ПАНЕЛЬ =====
async function renderAdminPanel(container){
  container.innerHTML='<p>Загрузка...</p>';
  const users=await sg('users'),videos=await sg('videos');
  const bannedCount=users.filter(u=>u.banned).length;
  const verifiedCount=users.filter(u=>u.verified).length;
  const totalLikes=videos.reduce((s,v)=>s+(v.likes||0),0);
  
  let html=`
    <input type="text" class="admin-search" id="adminSearch" placeholder="🔍 Поиск пользователя..." oninput="window._adminSearch()">
    <div class="admin-stats">
      <div class="admin-stat"><b>${users.length}</b> Пользователей</div>
      <div class="admin-stat"><b>${videos.length}</b> Видео</div>
      <div class="admin-stat"><b>${bannedCount}</b> Забанено</div>
      <div class="admin-stat"><b>${verifiedCount}</b> Верифицировано</div>
      <div class="admin-stat"><b>${totalLikes}</b> Лайков</div>
    </div>
    <h4>👥 Пользователи</h4>
    <div id="adminUserList"></div>
    <h4 style="margin-top:1rem;">🎬 Видео</h4>
    <div id="adminVideoList"></div>
  `;
  container.innerHTML=html;
  window._adminAllUsers=users;
  window._adminAllVideos=videos;
  window._adminRenderUserList(users);
  window._adminRenderVideoList(videos);
}

window._adminSearch=function(){
  const q=$('#adminSearch')?.value?.toLowerCase()||'';
  const filtered=window._adminAllUsers.filter(u=>u.login.toLowerCase().includes(q));
  window._adminRenderUserList(filtered);
};

window._adminRenderUserList=function(users){
  const list=$('#adminUserList');if(!list)return;
  list.innerHTML=users.map(u=>{
    const banInfo=u.banned?(u.ban_until?`🚫 до ${new Date(u.ban_until).toLocaleDateString()}`:'🚫 навсегда'):'';
    const warnCount=(u.warnings||[]).length;
    return `<div class="admin-user-item" id="user-${u.login}">
      <div style="flex:1;min-width:150px;">
        <b>@${u.login}</b> ${u.verified?'<span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#22c55e;font-size:10px;color:#fff;">✓</span>':''}
        <span style="color:var(--text2);font-size:0.7rem;">(${u.role})</span>
        <div style="font-size:0.65rem;color:var(--text2);">${banInfo} ${warnCount>0?'⚠️'+warnCount:''}</div>
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        <button class="success" onclick="window._adminVerify('${u.login}')">${u.verified?'✓ Снять':'✓ Вериф.'}</button>
        <button class="danger" onclick="window._adminBan('${u.login}')">${u.banned?'🔓 Разбан':'🔒 Бан'}</button>
        <button onclick="window._adminWarn('${u.login}')">⚠️ Предупредить</button>
        <button onclick="window._adminSetRole('${u.login}')">👑 Роль</button>
        <button onclick="window._adminViewUser('${u.login}')">👁️</button>
        <button class="danger" onclick="window._adminDeleteUser('${u.login}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
};

window._adminRenderVideoList=function(videos){
  const list=$('#adminVideoList');if(!list)return;
  list.innerHTML=videos.map(v=>`<div class="admin-user-item"><span style="flex:1;">🎬 ${v.name}<br><small>@${v.user_id} · ❤️${v.likes||0} · 💬${v.comments||0}</small></span><div style="display:flex;gap:4px;"><button onclick="window._adminDeleteVideo(${v.id})" class="danger">🗑️</button></div></div>`).join('');
};

window._adminVerify=async function(l){const a=await getUser(l);if(a){await updateUser(l,{verified:!a.verified});addLog('Верификация: '+l);renderAdminPanel($('#settingsContent'))}};
window._adminBan=async function(l){const a=await getUser(l);if(!a)return;if(a.banned){await updateUser(l,{banned:false,ban_reason:'',ban_until:0});addLog('Разбан: '+l);renderAdminPanel($('#settingsContent'));return}const r=prompt('Причина бана:');if(r===null)return;const d=prompt('Дней (0=навсегда, 1, 7, 30):','0');if(d===null)return;const days=parseInt(d)||0;await updateUser(l,{banned:true,ban_reason:r,ban_until:days>0?Date.now()+days*86400000:0});addLog('Бан: '+l);renderAdminPanel($('#settingsContent'))};
window._adminWarn=async function(l){const r=prompt('Причина предупреждения:');if(!r)return;const a=await getUser(l);if(a){const w=a.warnings||[];w.push(r);await updateUser(l,{warnings:w});addLog('Предупреждение: '+l);renderAdminPanel($('#settingsContent'))}};
window._adminSetRole=async function(l){const r=prompt('Роль (user/admin/moderator):');if(!r)return;const a=await getUser(l);if(a){await updateUser(l,{role:r});addLog('Роль: '+l+' → '+r);renderAdminPanel($('#settingsContent'))}};
window._adminViewUser=async function(l){const a=await getUser(l);if(a){alert(`👤 @${a.login}\nНик: ${a.nickname}\nРоль: ${a.role}\nВериф: ${a.verified?'да':'нет'}\nБан: ${a.banned?(a.ban_reason||'да'):'нет'}\nПредупреждений: ${(a.warnings||[]).length}\n${(a.warnings||[]).join('\n')}`)}};
window._adminDeleteUser=async function(l){if(confirm('Удалить @'+l+' навсегда?')){const a=await getUser(l);if(a)await sd('users',a.id);addLog('Удалён: '+l);renderAdminPanel($('#settingsContent'))}};
window._adminDeleteVideo=async function(id){if(confirm('Удалить видео?')){await deleteVideo(id);addLog('Видео удалено');renderAdminPanel($('#settingsContent'))}};

async function loadApp(){addLog(`Вход: ${currentUser}`);await renderFeed(true);await renderProfile(currentUser);renderLogs()}
async function createDefaultAdmin(){if(!await getUser('Grustish')){await si('users',{login:'Grustish',password:'Grustish112',nickname:'Grustish Admin',avatar:'',role:'admin',verified:true,banned:false,ban_reason:'',ban_until:0,warnings:[],created:Date.now()})}}
if(currentUser){$('#authScreen').classList.add('hidden');window.addEventListener('DOMContentLoaded',async()=>{await createDefaultAdmin();await loadApp()})}
</script>
</body>
</html>
