<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok UI ☁️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; overflow: hidden; }

    #authScreen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; }
    #authScreen.hidden { display: none; }
    #authBox { background: #111; border-radius: 20px; padding: 30px 25px; width: 90%; max-width: 350px; text-align: center; }
    #authBox h1 { font-size: 32px; margin-bottom: 5px; }
    #authBox h1 span { color: #ff0040; }
    #authBox p { color: #888; margin-bottom: 20px; font-size: 14px; }
    #authBox input { width: 100%; padding: 14px; margin: 6px 0; border-radius: 12px; border: 1px solid #222; background: #000; color: #fff; font-size: 16px; outline: none; }
    #authBox button { width: 100%; padding: 14px; margin: 6px 0; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
    #loginBtn { background: #ff0040; color: #fff; }
    #registerBtn { background: #00e5ff; color: #000; }
    #authError { color: #ff4444; margin-top: 10px; font-size: 14px; min-height: 20px; }

    #app { height: 100vh; display: flex; flex-direction: column; }
    #topBar { height: 50px; background: #0a0a0a; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
    #topBar span { font-weight: bold; font-size: 18px; }
    #topBar button { background: none; border: 1px solid #333; color: #fff; padding: 7px 15px; border-radius: 15px; font-size: 13px; cursor: pointer; }

    #content { flex: 1; position: relative; overflow: hidden; }
    .page { position: absolute; inset: 0; overflow-y: auto; display: none; padding-bottom: 60px; }
    .page.active { display: block; }

    #feedPage { scroll-snap-type: y mandatory; overflow-y: scroll; }
    .vid { width: 100%; height: calc(100vh - 110px); scroll-snap-align: start; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    .vid video { width: 100%; height: 100%; object-fit: contain; }
    .vid .info { position: absolute; bottom: 20px; left: 15px; right: 55px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 12px; }
    .vid .info .uname { font-weight: bold; font-size: 14px; }
    .vid .info .title { font-size: 12px; color: #ccc; margin-top: 3px; }
    .vid .btns { position: absolute; right: 10px; bottom: 25px; display: flex; flex-direction: column; gap: 15px; }
    .vid .btns button { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .vid .btns span { font-size: 11px; display: block; text-align: center; }
    .vid .sound { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    #profilePage { padding: 25px; text-align: center; }
    #avatarImg { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #222; cursor: pointer; }
    #profilePage h3 { margin-top: 10px; font-size: 20px; }
    #profilePage .st { color: #888; font-size: 13px; margin: 5px 0 15px; }
    #profilePage button { display: block; width: 90%; max-width: 300px; margin: 6px auto; padding: 12px; border-radius: 20px; border: 1px solid #333; background: #111; color: #fff; font-size: 14px; cursor: pointer; }

    .verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #22c55e; font-size: 12px; color: #fff; margin-left: 5px; vertical-align: middle; }

    #adminPage { padding: 15px; }
    #adminPage .stat { display: inline-block; background: #111; padding: 12px 16px; border-radius: 12px; margin: 4px; font-size: 13px; text-align: center; }
    #adminPage .stat b { display: block; font-size: 20px; color: #ff0040; }
    #adminPage input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #222; background: #000; color: #fff; margin: 12px 0; font-size: 14px; outline: none; }
    #adminPage .row { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #111; border-radius: 10px; margin: 4px 0; font-size: 13px; flex-wrap: wrap; gap: 6px; }
    #adminPage .row button { padding: 5px 12px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; font-size: 11px; cursor: pointer; }
    #adminPage .row .del { background: #ff0040; border-color: #ff0040; }
    #adminPage .row .ban { background: #ff3333; border-color: #ff3333; }
    #adminPage .row .ok { background: #22c55e; border-color: #22c55e; color: #000; }

    #chatPage { padding: 15px; }
    .chatRow { display: flex; align-items: center; padding: 12px; background: #111; border-radius: 12px; margin: 4px 0; cursor: pointer; }
    .chatAv { width: 40px; height: 40px; border-radius: 50%; background: #222; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; margin: 3px 0; font-size: 13px; }
    .msg.sent { background: #ff0040; align-self: flex-end; }
    .msg.recv { background: #1a1a1a; border: 1px solid #222; align-self: flex-start; }
    #chatInput { display: flex; gap: 8px; padding: 10px; background: #0a0a0a; position: sticky; bottom: 0; }
    #chatInput input { flex: 1; padding: 10px; border-radius: 18px; border: 1px solid #222; background: #000; color: #fff; }
    #chatInput button { background: #ff0040; color: #fff; border: none; border-radius: 18px; padding: 10px 18px; cursor: pointer; font-weight: bold; }

    #logPage { padding: 10px; }
    .log-entry { padding: 8px 12px; background: #0a0a0a; border-left: 4px solid #ff0040; margin: 3px 0; border-radius: 4px; font-size: 12px; font-family: monospace; }
    .log-entry .ltime { color: #888; margin-right: 8px; }

    #bottomBar { height: 60px; background: #0a0a0a; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid #1a1a1a; position: absolute; bottom: 0; left: 0; right: 0; z-index: 20; flex-shrink: 0; }
    #bottomBar .nav { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 11px; cursor: pointer; transition: color 0.2s; }
    #bottomBar .nav.on { color: #fff; }
    #bottomBar .nav .ico { font-size: 22px; }

    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #ff0040; color: #fff; padding: 10px 20px; border-radius: 20px; z-index: 99; font-weight: bold; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<div id="authScreen">
  <div id="authBox">
    <h1>Tik<span>Tok</span> UI</h1>
    <p>☁️ Облачная версия</p>
    <input id="loginInput" placeholder="Логин" value="Grustish">
    <input id="passInput" type="password" placeholder="Пароль" value="Grusti01">
    <button id="loginBtn">🚀 Войти</button>
    <button id="registerBtn">✨ Создать аккаунт</button>
    <div id="authError"></div>
  </div>
</div>

<div id="app">
  <div id="topBar"><span>TikTok UI</span><button id="logoutBtn">Выйти</button></div>
  <div id="content">
    <div id="feedPage" class="page active"></div>
    <div id="chatPage" class="page"></div>
    <div id="profilePage" class="page">
      <img id="avatarImg" src=""><input type="file" id="avatarFile" accept="image/*" hidden>
      <h3 id="profileName"></h3><div class="st" id="profileStats"></div>
      <button id="chNickBtn">✏️ Изменить ник</button>
      <button id="chPassBtn">🔒 Изменить пароль</button>
      <button id="uploadBtn">📤 Загрузить видео</button>
      <input type="file" id="videoFile" accept="video/*" hidden>
      <div id="uploadStatus" style="color:#888;margin-top:8px;"></div>
    </div>
    <div id="adminPage" class="page"></div>
    <div id="logPage" class="page"></div>
  </div>
  <div id="bottomBar">
    <div class="nav on" data-p="feedPage"><span class="ico">🏠</span>Главная</div>
    <div class="nav" data-p="chatPage"><span class="ico">💬</span>Чаты</div>
    <div class="nav" data-p="profilePage"><span class="ico">👤</span>Профиль</div>
    <div class="nav" id="adminNav" data-p="adminPage" style="display:none;"><span class="ico">🛡️</span>Админ</div>
    <div class="nav" data-p="logPage"><span class="ico">📋</span>Логи</div>
  </div>
</div>
<div id="toast"></div>

<script>
// ==================== НАСТРОЙКИ ОБЛАКА ====================
const URL = 'https://gtyjjzmvdhglxfjrwejh.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0eWpqem12ZGhnbHhmanJ3ZWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDc1NjMsImV4cCI6MjEwMTYyMzU2M30.8KOimAzsQbj5xPukQswdW05dvW5sat3xvyfxB44_J5Y';

// ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
let ME = '';
let ADMIN = false;
let SOUND = false;
const LOGS = [];

// ==================== ТОСТ ====================
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ==================== ЛОГИ ====================
function addLog(msg) {
  const now = new Date();
  const time = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  LOGS.push({ time, msg });
  if (LOGS.length > 200) LOGS.shift();
  renderLogs();
}

function renderLogs() {
  const lp = document.getElementById('logPage');
  if (!lp.classList.contains('active')) return;
  lp.innerHTML = LOGS.map(l => `<div class="log-entry"><span class="ltime">${l.time}</span>${l.msg}</div>`).join('');
  lp.scrollTop = lp.scrollHeight;
}

// ==================== ЗАПРОСЫ К ОБЛАКУ ====================
async function api(path, method = 'GET', body = null) {
  const h = { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY };
  const o = { method, headers: h };
  if (body) o.body = JSON.stringify(body);
  const r = await fetch(URL + '/rest/v1/' + path, o);
  const t = await r.text();
  if (!r.ok) { console.error('❌', method, path, t); throw new Error(t); }
  return t ? JSON.parse(t) : [];
}

// ==================== НАВИГАЦИЯ ====================
document.querySelectorAll('#bottomBar .nav').forEach(n => n.onclick = () => {
  document.querySelectorAll('#bottomBar .nav').forEach(x => x.classList.remove('on'));
  n.classList.add('on');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const id = n.dataset.p;
  document.getElementById(id).classList.add('active');
  if (id === 'feedPage') loadFeed();
  if (id === 'chatPage') loadChats();
  if (id === 'profilePage') loadProfile();
  if (id === 'adminPage') loadAdmin();
  if (id === 'logPage') renderLogs();
});

// ==================== СОЗДАНИЕ АДМИНА ====================
async function ensureAdmin() {
  try {
    const u = await api('users?login=eq.Grustish');
    if (!u.length) {
      await api('users', 'POST', {

        avatar: '', role: 'admin', verified: true, banned: false,

      addLog('👑 Админ Grustish создан автоматически');

// ==================== ВХОД ====================
document.getElementById('loginBtn').onclick = async () => {
  const l = document.getElementById('loginInput').value.trim();
  const p = document.getElementById('passInput').value.trim();
  if (!l || !p) return document.getElementById('authError').textContent = 'Заполните поля';
  try {
    const u = await api('users?login=eq.' + encodeURIComponent(l));
    if (!u.length) return document.getElementById('authError').textContent = 'Пользователь не найден';
    if (u[0].banned) return document.getElementById('authError').textContent = '🚫 Вы забанены';
    if (u[0].password !== p) return document.getElementById('authError').textContent = 'Неверный пароль';
    enter(u[0]);
  } catch (e) {
    document.getElementById('authError').textContent = 'Ошибка (F12)';
    console.error(e);
  }
};

// ==================== РЕГИСТРАЦИЯ ====================
document.getElementById('registerBtn').onclick = async () => {
  const l = document.getElementById('loginInput').value.trim();
  const p = document.getElementById('passInput').value.trim();
  if (!l || !p) return document.getElementById('authError').textContent = 'Заполните поля';
  if (l.length < 2) return document.getElementById('authError').textContent = 'Логин короткий';
  if (p.length < 3) return document.getElementById('authError').textContent = 'Пароль короткий';
  try {
    const exist = await api('users?login=eq.' + encodeURIComponent(l));
    if (exist.length) return document.getElementById('authError').textContent = 'Логин занят';
    await api('users', 'POST', {
      login: l, password: p, nickname: l, avatar: '', role: 'user',
      verified: false, banned: false, ban_reason: '', ban_until: 0,
      warnings: '[]', created: new Date().toISOString()
    });
    addLog('✅ Регистрация: @' + l);
    toast('✅ Аккаунт создан!');
    enter({ login: l, role: 'user', verified: false, warnings: [] });
  } catch (e) {
    document.getElementById('authError').textContent = 'Ошибка (F12)';
    console.error(e);
  }
};

function enter(u) {
  ME = u.login;
  ADMIN = u.role === 'admin';
  localStorage.setItem('tiktok_user', ME);
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('adminNav').style.display = ADMIN ? 'flex' : 'none';
  addLog('🔑 Вход: @' + ME + (ADMIN ? ' [АДМИН]' : ''));
  loadFeed();
  loadProfile();
  toast('👋 Добро пожаловать, @' + ME + '!');
}

document.getElementById('logoutBtn').onclick = () => {
  addLog('🚪 Выход: @' + ME);
  localStorage.removeItem('tiktok_user');
  location.reload();
};

// ==================== ЛЕНТА ====================
async function loadFeed() {
  const fp = document.getElementById('feedPage');
  fp.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">Загрузка...</div>';
  try {
    const vids = await api('videos');
    if (!vids.length) { fp.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">📹 Нет видео</div>'; return; }
    fp.innerHTML = '';
    vids.sort(() => Math.random() - 0.5);
    vids.forEach(v => {
      const d = document.createElement('div');
      d.className = 'vid';
      const canDel = (v.user_id === ME) || ADMIN;
      d.innerHTML = `<video src="${v.url}" loop playsinline muted></video><div class="sound">🔇</div>
        <div class="info"><div class="uname">@${v.user_id}</div><div class="title">${v.name||''}</div></div>
        <div class="btns"><button class="lk">❤️<span>${v.likes||0}</span></button>${canDel?'<button class="dl">🗑️</button>':''}</div>`;
      const vid = d.querySelector('video'), snd = d.querySelector('.sound');
      new IntersectionObserver(([e]) => {
        if (e.isIntersecting) { vid.muted = !SOUND; snd.textContent = SOUND ? '🔊' : '🔇'; vid.play().catch(() => {}); }
        else { vid.muted = true; snd.textContent = '🔇'; vid.pause(); }
      }, { threshold: 0.7 }).observe(d);
      snd.onclick = e => { e.stopPropagation(); SOUND = !SOUND; vid.muted = !SOUND; snd.textContent = SOUND ? '🔊' : '🔇'; if (SOUND) vid.play().catch(() => {}); };
      d.querySelector('.lk').onclick = async e => {
        e.stopPropagation();
        const nl = (v.likes || 0) + 1;
        d.querySelector('.lk span').textContent = nl;
        await api('videos?id=eq.' + v.id, 'PATCH', { likes: nl });
      };
      const dl = d.querySelector('.dl');
      if (dl) dl.onclick = async e => {
        e.stopPropagation();
        if (!confirm('Удалить видео?')) return;
        await api('videos?id=eq.' + v.id, 'DELETE');
        addLog('🗑️ Удалено видео #' + v.id + ' от @' + v.user_id);
        toast('🗑️ Видео удалено');
        loadFeed();
      };
      fp.appendChild(d);
    });
  } catch (e) { fp.innerHTML = '<div style="text-align:center;padding:40px;color:red;">Ошибка загрузки</div>'; console.error(e); }
}

// ==================== ПРОФИЛЬ ====================
async function loadProfile() {
  try {
    const u = await api('users?login=eq.' + encodeURIComponent(ME));
    if (!u.length) return;
    const user = u[0];
    document.getElementById('avatarImg').src = user.avatar || '';
    let nm = '@' + ME;
    if (user.verified) nm += ' <span class="verified-badge">✓</span>';
    const w = typeof user.warnings === 'string' ? JSON.parse(user.warnings) : (user.warnings || []);
    if (w.length) nm += ' <span style="background:#f59e0b;color:#000;border-radius:8px;padding:1px 6px;font-size:11px;margin-left:4px;">⚠' + w.length + '</span>';
    document.getElementById('profileName').innerHTML = nm;
    const vids = await api('videos');
    const mv = vids.filter(v => v.user_id === ME);
    const flr = await api('follows?following=eq.' + encodeURIComponent(ME));
    const flg = await api('follows?follower=eq.' + encodeURIComponent(ME));
    document.getElementById('profileStats').textContent = '📹 ' + mv.length + ' видео · 👥 ' + flr.length + ' подп. · 🔔 ' + flg.length + ' подписок';
    ADMIN = user.role === 'admin';
    document.getElementById('adminNav').style.display = ADMIN ? 'flex' : 'none';
  } catch (e) { console.error(e); }
}

document.getElementById('avatarImg').onclick = () => document.getElementById('avatarFile').click();
document.getElementById('avatarFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async ev => {
    await api('users?login=eq.' + encodeURIComponent(ME), 'PATCH', { avatar: ev.target.result });
    document.getElementById('avatarImg').src = ev.target.result;
    addLog('🖼️ Аватар обновлён: @' + ME);
    toast('🖼️ Аватар обновлён');
  };
  r.readAsDataURL(f);
};

document.getElementById('uploadBtn').onclick = () => document.getElementById('videoFile').click();
document.getElementById('videoFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  document.getElementById('uploadStatus').textContent = '⏳ Загрузка...';
  try {
    const fn = Date.now() + '_' + f.name.replace(/[^a-zA-Z0-9.]/g, '_');
    const r = await fetch(URL + '/storage/v1/object/tiktok-videos/' + fn, {
      method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': f.type || 'video/mp4' }, body: f
    });
    if (!r.ok) throw new Error('Storage error');
    const vurl = URL + '/storage/v1/object/public/tiktok-videos/' + fn;
    const vid = await api('videos', 'POST', {
      user_id: ME, name: f.name, url: vurl, duration: 0, likes: 0,
      views: 0, comments: 0, created: new Date().toISOString()
    });
    document.getElementById('uploadStatus').textContent = '✅ Готово!';
    addLog('📤 Загружено видео: ' + f.name + ' (@' + ME + ')');
    toast('📤 Видео загружено!');
    document.getElementById('videoFile').value = '';
    loadFeed();
    loadProfile();
    setTimeout(() => document.getElementById('uploadStatus').textContent = '', 3000);
  } catch (er) {
    document.getElementById('uploadStatus').textContent = '❌ Ошибка';
    console.error(er);
  }
};

document.getElementById('chNickBtn').onclick = async () => {
  const u = await api('users?login=eq.' + encodeURIComponent(ME));
  const nn = prompt('Новый ник:', u[0]?.nickname || ME);
  if (nn && nn.trim()) {
    await api('users?login=eq.' + encodeURIComponent(ME), 'PATCH', { nickname: nn.trim() });
    addLog('✏️ Смена ника: @' + ME + ' → ' + nn.trim());
    toast('✏️ Ник изменён');

};

document.getElementById('chPassBtn').onclick = async () => {
  const u = await api('users?login=eq.' + encodeURIComponent(ME));
  const op = prompt('Старый пароль:');
  if (u[0]?.password !== op) return toast('❌ Неверный старый пароль');
  const np = prompt('Новый пароль (мин. 3 символа):');
  if (np && np.length >= 3) {
    await api('users?login=eq.' + encodeURIComponent(ME), 'PATCH', { password: np });
    addLog('🔒 Смена пароля: @' + ME);
    toast('🔒 Пароль изменён');
  }
};

// ==================== АДМИН-ПАНЕЛЬ ====================
async function loadAdmin() {
  const ap = document.getElementById('adminPage');
  if (!ADMIN) { ap.innerHTML = '<div style="padding:30px;text-align:center;color:red;">⛔ Доступ запрещён</div>'; return; }
  ap.innerHTML = '<div style="text-align:center;padding:30px;">Загрузка...</div>';
  try {
    const users = await api('users');
    const vids = await api('videos');
    const bc = users.filter(u => u.banned).length;
    const vc = users.filter(u => u.verified).length;
    ap.innerHTML = `<div><span class="stat"><b>${users.length}</b>Польз.</span><span class="stat"><b>${vids.length}</b>Видео</span><span class="stat"><b>${bc}</b>Банов</span><span class="stat"><b>${vc}</b>Вериф.</span></div>
      <input id="aSearch" placeholder="🔍 Поиск пользователя..." oninput="window._as()">
      <h4 style="margin-top:10px;color:#888;">👥 Пользователи</h4><div id="aUsers"></div>
      <h4 style="margin-top:15px;color:#888;">🎬 Видео</h4><div id="aVideos"></div>`;
    window._au = users;
    window._av = vids;
    renderAUsers(users);
    renderAVideos(vids);
  } catch (e) { ap.innerHTML = '<div style="color:red;">Ошибка загрузки</div>'; console.error(e); }
}

window._as = () => {
  const q = (document.getElementById('aSearch')?.value || '').toLowerCase();
  renderAUsers(window._au.filter(u => u.login.toLowerCase().includes(q)));
};

function renderAUsers(users) {
  const el = document.getElementById('aUsers');
  if (!el) return;
  el.innerHTML = users.map(u => {
    const w = typeof u.warnings === 'string' ? JSON.parse(u.warnings) : (u.warnings || []);
    let b = '';
    if (u.verified) b += ' <span class="verified-badge">✓</span> ';
    if (u.banned) b += ' <span style="color:red;font-weight:bold;">БАН</span> ';
    if (w.length) b += ' <span style="color:#f59e0b;">⚠' + w.length + '</span> ';
    return `<div class="row"><span><b>@${u.login}</b>${b}</span><div>
      <button class="ok vbtn" data-l="${u.login}">${u.verified?'Снять ✓':'✓ Вериф.'}</button>
      <button class="${u.banned?'ok':'ban'} bbtn" data-l="${u.login}">${u.banned?'Разбанить':'Забанить'}</button>
      <button class="wbtn" data-l="${u.login}" style="background:#f59e0b;color:#000;">⚠</button>
      <button class="del dbtn" data-l="${u.login}">🗑</button></div></div>`;
  }).join('');

  el.querySelectorAll('.vbtn').forEach(b => b.onclick = async () => {
    const u = await api('users?login=eq.' + encodeURIComponent(b.dataset.l));
    const nv = !u[0].verified;
    await api('users?login=eq.' + encodeURIComponent(b.dataset.l), 'PATCH', { verified: nv });
    addLog((nv ? '✅ Верифицирован' : '❌ Верификация снята') + ': @' + b.dataset.l);
    toast(nv ? '✅ Верифицирован' : '❌ Верификация снята');
    loadAdmin();
  });

  el.querySelectorAll('.bbtn').forEach(b => b.onclick = async () => {
    const u = await api('users?login=eq.' + encodeURIComponent(b.dataset.l));
    if (u[0].banned) {
      await api('users?login=eq.' + encodeURIComponent(b.dataset.l), 'PATCH', { banned: false, ban_reason: '', ban_until: 0 });
      addLog('🔓 Разбанен: @' + b.dataset.l);
      toast('🔓 Разбанен');
    } else {
      const r = prompt('Причина бана:');
      if (!r) return;
      const d = prompt('На сколько дней? (0 = навсегда)', '0');
      if (d === null) return;
      await api('users?login=eq.' + encodeURIComponent(b.dataset.l), 'PATCH', {
        banned: true, ban_reason: r, ban_until: parseInt(d) > 0 ? Date.now() + parseInt(d) * 86400000 : 0
      });
      addLog('🚫 Забанен: @' + b.dataset.l + ' | Причина: ' + r);
      toast('🚫 Забанен');
    }
    loadAdmin();
  });

  el.querySelectorAll('.wbtn').forEach(b => b.onclick = async () => {
    const r = prompt('Причина предупреждения:');
    if (!r) return;
    const u = await api('users?login=eq.' + encodeURIComponent(b.dataset.l));
    const w = typeof u[0].warnings === 'string' ? JSON.parse(u[0].warnings) : (u[0].warnings || []);
    w.push(r);
    await api('users?login=eq.' + encodeURIComponent(b.dataset.l), 'PATCH', { warnings: JSON.stringify(w) });
    addLog('⚠️ Предупреждение: @' + b.dataset.l + ' | ' + r);
    toast('⚠️ Предупреждение выдано');
    loadAdmin();
  });

  el.querySelectorAll('.dbtn').forEach(b => b.onclick = async () => {
    if (!confirm('Удалить пользователя @' + b.dataset.l + '? Это необратимо!')) return;
    const u = await api('users?login=eq.' + encodeURIComponent(b.dataset.l));
    await api('users?id=eq.' + u[0].id, 'DELETE');
    addLog('🗑️ Пользователь удалён: @' + b.dataset.l);
    toast('🗑️ Пользователь удалён');
    loadAdmin();
  });
}

function renderAVideos(vids) {
  const el = document.getElementById('aVideos');
  if (!el) return;
  el.innerHTML = vids.map(v => `<div class="row"><span>🎬 ${v.name||'Без названия'} · @${v.user_id}</span><button class="del" data-vid="${v.id}">🗑</button></div>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = async () => {
    if (!confirm('Удалить это видео?')) return;
    await api('videos?id=eq.' + b.dataset.vid, 'DELETE');
    addLog('🗑️ Видео #' + b.dataset.vid + ' удалено админом');
    toast('🗑️ Видео удалено');
    loadAdmin();
  });
}

// ==================== ЧАТ ====================
async function loadChats() {
  const cp = document.getElementById('chatPage');
  cp.innerHTML = '<div style="text-align:center;padding:30px;color:#888;">Загрузка...</div>';
  try {
    const ms = await api('messages?or=(from_user.eq.' + encodeURIComponent(ME) + ',to_user.eq.' + encodeURIComponent(ME) + ')');
    const set = new Set();
    ms.forEach(m => { if (m.from_user !== ME) set.add(m.from_user); if (m.to_user !== ME) set.add(m.to_user); });
    const chats = [...set];
    if (!chats.length) { cp.innerHTML = '<div style="text-align:center;padding:30px;color:#888;">💬 Нет сообщений</div>'; return; }
    cp.innerHTML = '';
    for (const c of chats) {
      const u = await api('users?login=eq.' + encodeURIComponent(c));
      if (!u.length) continue;
      const d = document.createElement('div');
      d.className = 'chatRow';
      d.innerHTML = `<div class="chatAv">${(u[0].nickname||c)[0].toUpperCase()}</div><div><b>@${c}</b></div>`;
      d.onclick = () => openChat(c);
      cp.appendChild(d);
    }
  } catch (e) { cp.innerHTML = '<div style="color:red;">Ошибка</div>'; }
}

async function openChat(wu) {
  const cp = document.getElementById('chatPage');
  cp.innerHTML = `<button onclick="loadChats()" style="background:none;border:none;color:#ff0040;font-size:16px;cursor:pointer;margin-bottom:10px;">← Назад</button>
    <div id="msgBox" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;"></div>
    <div id="chatInput"><input id="msgInput" placeholder="Сообщение..."><button id="sendMsg">Отправить</button></div>`;
  const box = document.getElementById('msgBox');
  const ms = await api('messages?or=(from_user.eq.' + ME + ',to_user.eq.' + ME + ')&or=(from_user.eq.' + wu + ',to_user.eq.' + wu + ')&order=created.asc');
  ms.forEach(m => {
    const d = document.createElement('div');
    d.className = 'msg ' + (m.from_user === ME ? 'sent' : 'recv');
    d.textContent = m.text;
    box.appendChild(d);
  });
  box.scrollTop = box.scrollHeight;
  document.getElementById('sendMsg').onclick = async () => {
    const t = document.getElementById('msgInput').value.trim();
    if (!t) return;
    await api('messages', 'POST', { from_user: ME, to_user: wu, text: t, created: new Date().toISOString() });
    addLog('💬 Сообщение: @' + ME + ' → @' + wu);
    const d = document.createElement('div');
    d.className = 'msg sent';
    d.textContent = t;
    box.appendChild(d);
    document.getElementById('msgInput').value = '';
    box.scrollTop = box.scrollHeight;
  };
}

// ==================== ЗАПУСК ====================
(async () => {
  await ensureAdmin();
  const sv = localStorage.getItem('tiktok_user');
  if (sv) {
    try {
      const u = await api('users?login=eq.' + encodeURIComponent(sv));
      if (u.length && !u[0].banned) {
        enter(u[0]);
      } else {
        localStorage.removeItem('tiktok_user');
      }
    } catch (e) {
      localStorage.removeItem('tiktok_user');
    }
  }
})();
