  else if (tab === 'admin') renderAdminPanel(c);
}

async function renderAdminPanel(container) {
  container.innerHTML = '<p>Загрузка...</p>';
  const users = await sg('users'), videos = await sg('videos');
  let html = `<div class="admin-stats"><div class="admin-stat"><b>${users.length}</b>Польз.</div><div class="admin-stat"><b>${videos.length}</b>Видео</div></div>

  container.innerHTML = html;
  window._aAllUsers = users; window._aAllVideos = videos;
  window._aRenderUsers(users); window._aRenderVideos(videos);
}

  $('#adminUserList').innerHTML = users.map(u => `<div class="admin-user-item" data-login="${u.login}"><div style="flex:1"><b>@${u.login}</b> ${u.verified?'✅':''} ${u.banned?'🚫':''}</div><div style="display:flex;gap:4px;"><button class="success a-verify">${u.verified?'Снять':'✓'}</button><button class="danger a-ban">${u.banned?'Разбан':'Бан'}</button><button class="a-warn">⚠️</button><button class="danger a-deluser">🗑️</button></div></div>`).join('');
  $('#adminUserList').querySelectorAll('.admin-user-item').forEach(item => {
    const l = item.dataset.login;
    item.querySelector('.a-verify').addEventListener('click', () => window._aVerify(l));
    item.querySelector('.a-ban').addEventListener('click', () => window._aBan(l));
    item.querySelector('.a-warn').addEventListener('click', () => window._aWarn(l));
    item.querySelector('.a-deluser').addEventListener('click', () => window._aDelUser(l));
  });
};
window._aRenderVideos = function(videos) {
  $('#adminVideoList').innerHTML = videos.map(v => `<div class="admin-user-item" data-videoid="${v.id}"><span>🎬 ${v.name} · @${v.user_id}</span><button class="danger a-delvideo">🗑️</button></div>`).join('');
  $('#adminVideoList').querySelectorAll('.admin-user-item').forEach(item => { item.querySelector('.a-delvideo').addEventListener('click', () => window._aDelVideo(+item.dataset.videoid)); });
};

window._aBan = async function(l) { const a = await getUser(l); if(!a)return; if(a.banned){ await updateUser(l, {banned:false,ban_reason:'',ban_until:0}); } else { const r = prompt('Причина:'); if(!r)return; const d = prompt('Дней (0=навсегда):','0'); if(d===null)return; await updateUser(l, {banned:true,ban_reason:r,ban_until:parseInt(d)>0?Date.now()+parseInt(d)*86400000:0}); } renderAdminPanel($('#settingsContent')); };
