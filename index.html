<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>TikTok UI · Cloud</title>
  <style>
    :root {
      --bg: #000;
      --surface: #121212;
      --card: #1a1a1a;
      --text: #fff;
      --text2: #aaa;
      --accent: #ff0050;
      --accent2: #00f2ea;
      --border: rgba(255,255,255,0.1);
      --bottom-bar-height: 60px;
      --top-bar-height: 56px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); font-family: 'Inter', 'Segoe UI', sans-serif;
      height: 100vh; overflow: hidden; color: var(--text);
    }
    .auth-screen {
      position: fixed; inset: 0; background: var(--bg); z-index: 100;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
    }
    .auth-screen.hidden { display: none; }
    .auth-box {
      background: var(--surface); border-radius: 24px; padding: 2rem;
      width: 90%; max-width: 360px; text-align: center;
      border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .auth-box h1 { font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 700; }
    .auth-box h1 span { color: var(--accent); }
    .auth-box input {
      width: 100%; padding: 14px; margin: 8px 0; border-radius: 14px;
      border: 1px solid var(--border); background: #000; color: #fff; font-size: 1rem;
      outline: none; transition: 0.2s;
    }
    .auth-box input:focus { border-color: var(--accent); }
    .auth-box button {
      width: 100%; padding: 14px; margin: 6px 0; border-radius: 14px;
      border: none; font-size: 1rem; cursor: pointer; font-weight: 600;
      transition: 0.2s;
    }
    .btn-login { background: var(--accent); color: #fff; }
    .btn-register { background: var(--accent2); color: #000; }
    .auth-error { color: #ff4444; font-size: 0.85rem; margin-top: 10px; display: none; }

    .app { height: 100vh; display: flex; flex-direction: column; }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; background: var(--surface); z-index: 10;
      border-bottom: 1px solid var(--border);
      height: var(--top-bar-height);
    }
    .top-bar h2 { font-size: 1.3rem; font-weight: 700; }
    .top-bar button {
      background: none; border: 1px solid var(--border); color: #fff;
      padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
    }
    .content { flex: 1; position: relative; overflow: hidden; }
    .panel {
      position: absolute; inset: 0; overflow-y: auto; display: none;
      flex-direction: column; padding-bottom: var(--bottom-bar-height);
    }
    .panel.active { display: flex; }

    .feed-panel {
      scroll-snap-type: y mandatory; overflow-y: scroll;
      height: calc(100vh - var(--top-bar-height) - var(--bottom-bar-height));
    }
    .video-card {
      width: 100%; height: calc(100% + 2px);
      scroll-snap-align: start; position: relative;
      display: flex; align-items: center; justify-content: center;
      background: #000; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .video-card video { width: 100%; height: 100%; object-fit: contain; }

    .video-avatar {
      position: absolute; left: 16px; bottom: 100px;
      display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 5;
    }
    .video-avatar img {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid #fff; background: #333; object-fit: cover;
    }
    .video-avatar .plus-btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 50%; width: 22px; height: 22px;
      font-size: 0.9rem; line-height: 1; display: flex; align-items: center; justify-content: center;
      cursor: pointer; margin-top: -8px;
    }

    .video-info {
      position: absolute; bottom: 20px; left: 70px; right: 60px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      padding: 10px 12px; border-radius: 14px; cursor: pointer; transition: opacity 0.2s;
    }
    .video-info.hidden { opacity: 0; pointer-events: none; }
    .video-info .username { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 4px; }
    .video-info .desc { font-size: 0.8rem; color: #ccc; margin-top: 4px; }

    .video-actions {
      position: absolute; right: 12px; bottom: 30px;
      display: flex; flex-direction: column; gap: 18px; align-items: center;
    }
    .video-actions button {
      background: none; border: none; color: #fff; font-size: 1.6rem;
      cursor: pointer; display: flex; flex-direction: column; align-items: center;
    }
    .video-actions span { font-size: 0.7rem; margin-top: -2px; }

    .sound-btn {
      position: absolute; top: 16px; right: 16px;
      background: rgba(0,0,0,0.5); border-radius: 50%; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #fff; z-index: 5; cursor: pointer;
    }
    .speed-indicator {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.75); color: #fff; padding: 8px 18px;
      border-radius: 24px; font-size: 1.1rem; font-weight: 700; display: none; z-index: 6;
    }
    .like-animation {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 5rem; color: var(--accent); pointer-events: none;
      animation: likeBoom 0.6s ease-out forwards;
    }
    @keyframes likeBoom {
      0% { transform: translate(-50%,-50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; }
    }
    .progress-bar {
      position: absolute; bottom: 0; left: 0; height: 3px;
      background: var(--accent); width: 0%; z-index: 7; transition: width 0.1s linear;
    }

    .profile-panel { align-items: center; padding: 2rem 1rem; gap: 0.8rem; }
    .profile-panel .avatar-img {
      width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
      background: #333; cursor: pointer;
    }
    .profile-panel h3 { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .profile-panel .nickname { color: var(--text2); font-size: 0.9rem; cursor: pointer; }
    .profile-panel .stats { color: var(--text2); font-size: 0.85rem; }
    .profile-panel button {
      background: var(--accent); color: #fff; padding: 10px 24px;
      border-radius: 24px; border: none; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; margin: 4px;
    }
    .profile-videos {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
      width: 100%; margin-top: 0.5rem;
    }
    .profile-videos .thumb {
      position: relative; aspect-ratio: 9/16; background: #000;
      overflow: hidden; cursor: pointer;
    }
    .profile-videos .thumb video { width: 100%; height: 100%; object-fit: cover; }

    .verified-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%; background: #22c55e;
      font-size: 10px; color: #fff;
    }

    .log-panel { padding: 1rem; }
    .log-entry {
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
      padding: 6px 10px; border-radius: 8px; margin: 2px 0;
      background: rgba(255,255,255,0.03); border-left: 4px solid var(--accent);
    }
    .log-entry.info { border-left-color: #6c8cff; }
    .log-entry.warn { border-left-color: #f59e0b; }
    .log-entry.error { border-left-color: #ff4444; }
    .log-entry .log-time { color: #888; margin-right: 8px; font-size: 0.65rem; }

    .comments-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50;
      display: none; align-items: flex-end; justify-content: center;
    }
    .comments-overlay.active { display: flex; }
    .comments-panel {
      background: var(--surface); width: 100%; max-height: 70%;
      border-radius: 24px 24px 0 0; padding: 1.2rem; overflow-y: auto;
    }
    .comments-panel h3 { margin-bottom: 1rem; font-size: 1.1rem; }
    .comment-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .comment-item .author { font-weight: 700; color: var(--accent); margin-right: 6px; }
    .comment-input { display: flex; gap: 8px; margin-top: 12px; }
    .comment-input input {
      flex: 1; padding: 12px; border-radius: 20px;
      border: 1px solid var(--border); background: #000; color: #fff;
    }
    .comment-input button {
      background: var(--accent); color: #fff; border: none;
      border-radius: 20px; padding: 12px 18px; cursor: pointer; font-weight: 600;
    }

    .bottom-bar {
      height: var(--bottom-bar-height); background: var(--surface);
      border-top: 1px solid var(--border); display: flex; align-items: center;
      justify-content: space-around; position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
    }
    .bottom-bar .nav-item {
      display: flex; flex-direction: column; align-items: center;
      color: var(--text2); cursor: pointer; font-size: 0.7rem; padding: 6px 0;
    }
    .bottom-bar .nav-item.active { color: #fff; }
    .bottom-bar .nav-item .icon { font-size: 1.4rem; margin-bottom: 2px; }

    .unmute-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 10px 24px;
      border-radius: 30px; font-size: 1rem; font-weight: 600; z-index: 8;
      display: none; cursor: pointer;
    }
    .unmute-overlay.show { display: block; }

    .settings-panel {
      background: var(--surface); border-radius: 20px; padding: 1.5rem;
      width: 100%; max-width: 500px; margin: 0 auto;
      display: none; flex-direction: column; gap: 1rem;
    }
    .settings-panel.active { display: flex; }
    .settings-tabs { display: flex; gap: 4px; margin-bottom: 1rem; }
    .settings-tab {
      flex: 1; text-align: center; padding: 8px; background: rgba(255,255,255,0.05);
      border-radius: 12px; cursor: pointer; font-size: 0.8rem;
    }
    .settings-tab.active { background: var(--accent); color: #fff; }

    .admin-user-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px; background: rgba(255,255,255,0.03); border-radius: 10px; margin: 4px 0;
      flex-wrap: wrap; gap: 4px;
    }
    .admin-user-item button { padding: 4px 10px; font-size: 0.7rem; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 60;
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--surface); border-radius: 20px; padding: 1.5rem;
      width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto;
      border: 1px solid var(--border);
    }
    .modal-box h3 { margin-bottom: 1rem; }
    .modal-box select, .modal-box input {
      width: 100%; padding: 10px; border-radius: 12px;
      border: 1px solid var(--border); background: #000; color: #fff; margin: 4px 0;
    }
  </style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h1>Tik<span>Tok</span> UI</h1>
    <p style="color:#aaa;margin-bottom:1.2rem;">Облачная версия</p>
    <input type="text" id="authLogin" placeholder="Логин">
    <input type="password" id="authPass" placeholder="Пароль">
    <button class="btn-login" id="loginBtn">Войти</button>
    <button class="btn-register" id="registerBtn">Создать аккаунт</button>
    <p class="auth-error" id="authError"></p>
  </div>
</div>

<div class="app" id="app">
  <div class="top-bar">
    <h2>TikTok UI</h2>
    <div style="display:flex;gap:8px;">
      <button id="randomFeedBtn">🔀</button>
      <button id="toggleInfoBtn">📝</button>
      <button id="logoutBtn">Выйти</button>
    </div>
  </div>
  <div class="content">
    <div class="panel feed-panel active" id="feedPanel"></div>
    <div class="panel feed-panel" id="trendingPanel"></div>
    <div class="panel profile-panel" id="profilePanel">
      <img class="avatar-img" id="profileAvatar" src="" alt="Аватар">
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <h3 id="profileName"></h3>
      <p class="nickname" id="profileNick"></p>
      <p class="stats" id="profileStats"></p>
      <button id="settingsBtn">⚙️ Настройки</button>
      <div class="settings-panel" id="settingsPanel">
        <div class="settings-tabs">
          <div class="settings-tab active" data-settings="account">Управление</div>
          <div class="settings-tab" data-settings="privacy">Конфиденциальность</div>
          <div class="settings-tab" data-settings="admin" style="display:none;">Админ-панель</div>
        </div>
        <div id="settingsContent"></div>
      </div>
      <button id="changeNickBtn">✏️ Ник</button>
      <button id="changeUserBtn">✏️ @user</button>
      <button id="changePasswordBtn">🔒 Пароль</button>
      <button id="profileUploadBtn">📤 Загрузить видео</button>
      <input type="file" id="videoInput" accept="video/*" style="display:none;">
      <div id="uploadStatus" style="color:var(--text2);"></div>
      <button id="followBtn" style="display:none;">Подписаться</button>
      <div class="profile-videos" id="profileVideos"></div>
    </div>
    <div class="panel log-panel" id="logPanel"></div>
  </div>
  <div class="bottom-bar">
    <div class="nav-item active" data-panel="feedPanel"><span class="icon">🏠</span> Лента</div>
    <div class="nav-item" data-panel="trendingPanel"><span class="icon">🔥</span> Тренды</div>
    <div class="nav-item" data-panel="profilePanel"><span class="icon">👤</span> Профиль</div>
    <div class="nav-item" data-panel="logPanel"><span class="icon">📋</span> Логи</div>
  </div>
</div>

<div class="comments-overlay" id="commentsOverlay">
  <div class="comments-panel" id="commentsPanel">
    <h3>💬 Комментарии</h3>
    <div id="commentsList"></div>
    <div class="comment-input"><input type="text" id="commentInput" placeholder="Написать..."><button id="sendCommentBtn">Отправить</button></div>
    <button id="closeCommentsBtn" style="margin-top:12px;width:100%;background:var(--surface);color:#fff;border:1px solid var(--border);padding:12px;border-radius:20px;">Закрыть</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
// ============================================================
// 1. КОНФИГУРАЦИЯ SUPABASE — ВСТАВЬТЕ СВОИ ДАННЫЕ
// ============================================================
const SUPABASE_URL = 'https://gtyjjzmvdhglxfjrwejh.supabase.co/rest/v1/';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0eWpqem12ZGhnbHhmanJ3ZWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDc1NjMsImV4cCI6MjEwMTYyMzU2M30.8KOimAzsQbj5xPukQswdW05dvW5sat3xvyfxB44_J5Y';

// ============================================================
// 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ДЛЯ SUPABASE
// ============================================================
async function supabaseRequest(endpoint, method = 'GET', body = null, token = null) {
  const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
  };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  
  const url = SUPABASE_URL + endpoint;
  const options = { method, headers };
  if (body) options.body = JSON.stringify(body);
  
  const response = await fetch(url, options);
  if (!response.ok) {
    const text = await response.text();
    throw new Error(`Ошибка Supabase: ${response.status} ${text}`);
  }
  return response.json();
}

async function supabaseGet(table, filter = '') {
  return supabaseRequest(table + '?select=*' + filter);
}

async function supabaseInsert(table, data) {
  return supabaseRequest(table, 'POST', data);
}

async function supabaseUpdate(table, id, data) {
  return supabaseRequest(table + '?id=eq.' + id, 'PATCH', data);
}

async function supabaseDelete(table, id) {
  return supabaseRequest(table + '?id=eq.' + id, 'DELETE');
}

// ============================================================
// 3. ОСНОВНАЯ ЛОГИКА ПРИЛОЖЕНИЯ
// ============================================================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let currentUser = localStorage.getItem('tiktok_user') || '';
let audioEnabled = true;
let showInfo = true;
let currentVideoId = null;
let logs = [];
let logCounter = 0;

function addLog(msg, type = 'info') {
  logCounter++;
  const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  logs.push({ num: logCounter, time, msg, type });
  if (logs.length > 500) logs.shift();
  renderLogs();
  console.log(`#${logCounter} ${msg}`);
}

function renderLogs() {
  const p = $('#logPanel');
  if (!p) return;
  p.innerHTML = logs.map(l => `<div class="log-entry ${l.type}"><span class="log-time">${l.time}</span>#${l.num} ${l.msg}</div>`).join('');
  p.scrollTop = p.scrollHeight;
}

function showAuthError(msg) {
  const el = $('#authError');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

// ----- АВТОРИЗАЦИЯ -----
async function registerUser(login, password) {
  try {
    const existing = await supabaseGet('users', `&login=eq.${encodeURIComponent(login)}`);
    if (existing.length > 0) return false;
    await supabaseInsert('users', {
      login,
      password,
      nickname: login,
      avatar: '',
      role: 'user',
      verified: false,
      banned: false,
      ban_reason: '',
      ban_until: 0,
      warnings: [],
      created: Date.now()
    });
    addLog(`Аккаунт ${login} создан`);
    return true;
  } catch(e) {
    addLog('Ошибка регистрации: ' + e.message, 'error');
    return false;
  }
}

async function loginUser(login, password) {
  try {
    const users = await supabaseGet('users', `&login=eq.${encodeURIComponent(login)}`);
    if (users.length === 0) return false;
    const user = users[0];
    if (user.banned) {
      const banUntil = user.ban_until || 0;
      if (banUntil > 0 && Date.now() > banUntil) {
        await supabaseUpdate('users', user.id, { banned: false, ban_reason: '', ban_until: 0 });
        return user.password === password;
      }
      showAuthError(`Аккаунт заблокирован${user.ban_reason ? ': ' + user.ban_reason : ''}`);
      return false;
    }
    return user.password === password;
  } catch(e) {
    addLog('Ошибка входа: ' + e.message, 'error');
    return false;
  }
}

async function getUser(login) {
  try {
    const users = await supabaseGet('users', `&login=eq.${encodeURIComponent(login)}`);
    return users[0] || null;
  } catch(e) { return null; }
}

async function updateUser(login, data) {
  const user = await getUser(login);
  if (!user) return;
  await supabaseUpdate('users', user.id, data);
}

async function getAllUsers() {
  try {
    return await supabaseGet('users');
  } catch(e) { return []; }
}

// ----- ВИДЕО -----
async function uploadVideo(blob, name, duration, user) {
  try {
    // Загружаем видео в Supabase Storage
    const formData = new FormData();
    formData.append('file', blob, name);
    const response = await fetch(`${SUPABASE_URL}/storage/v1/object/tiktok-videos/${Date.now()}_${name}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: blob
    });
    if (!response.ok) throw new Error('Ошибка загрузки видео');
    const data = await response.json();
    const videoUrl = `${SUPABASE_URL}/storage/v1/object/public/tiktok-videos/${data.Key}`;
    
    // Сохраняем запись в БД
    await supabaseInsert('videos', {
      user_id: user,
      name: name,
      url: videoUrl,
      duration: duration || 0,
      likes: 0,
      views: 0,
      comments: 0,
      created: Date.now()
    });
    addLog(`Видео ${name} загружено`);
    return true;
  } catch(e) {
    addLog('Ошибка загрузки видео: ' + e.message, 'error');
    return false;
  }
}

async function getAllVideos() {
  try {
    return await supabaseGet('videos');
  } catch(e) { return []; }
}

async function getVideo(id) {
  try {
    const videos = await supabaseGet('videos', `&id=eq.${id}`);
    return videos[0] || null;
  } catch(e) { return null; }
}

async function updateVideo(id, data) {
  await supabaseUpdate('videos', id, data);
}

async function deleteVideo(id) {
  await supabaseDelete('videos', id);
}

// ----- ПОДПИСКИ -----
async function follow(follower, following) {
  await supabaseInsert('follows', { follower, following, created: Date.now() });
}

async function unfollow(follower, following) {
  try {
    const follows = await supabaseGet('follows', `&follower=eq.${encodeURIComponent(follower)}&following=eq.${encodeURIComponent(following)}`);
    if (follows.length > 0) await supabaseDelete('follows', follows[0].id);
  } catch(e) {}
}

async function isFollowing(follower, following) {
  try {
    const follows = await supabaseGet('follows', `&follower=eq.${encodeURIComponent(follower)}&following=eq.${encodeURIComponent(following)}`);
    return follows.length > 0;
  } catch(e) { return false; }
}

async function getFollowersCount(user) {
  try {
    const follows = await supabaseGet('follows', `&following=eq.${encodeURIComponent(user)}`);
    return follows.length;
  } catch(e) { return 0; }
}

async function getFollowingCount(user) {
  try {
    const follows = await supabaseGet('follows', `&follower=eq.${encodeURIComponent(user)}`);
    return follows.length;
  } catch(e) { return 0; }
}

// ----- КОММЕНТАРИИ -----
async function addComment(videoId, user, text) {
  await supabaseInsert('comments', { video_id: videoId, user_id: user, text, created: Date.now() });
  const video = await getVideo(videoId);
  if (video) await updateVideo(videoId, { comments: (video.comments || 0) + 1 });
}

async function getComments(videoId) {
  try {
    return await supabaseGet('comments', `&video_id=eq.${videoId}`);
  } catch(e) { return []; }
}

// ----- ИСТОРИЯ -----
async function addHistory(videoId, user) {
  await supabaseInsert('history', { video_id: videoId, user_id: user, created: Date.now() });
}

async function getHistory(user) {
  try {
    return await supabaseGet('history', `&user_id=eq.${encodeURIComponent(user)}`);
  } catch(e) { return []; }
}

// ----- МОДЕРАЦИЯ -----
async function addModAction(type, target, reason, duration) {
  await supabaseInsert('modlog', { type, target, reason, duration, created: Date.now() });
}

function createCard(v) {
  const card = document.createElement('div');
  card.className = 'video-card';
  
  card.innerHTML = `
    <video src="${v.url}" loop playsinline></video>
    <div class="progress-bar"></div>
    <div class="sound-btn">🔊</div>
    <div class="unmute-overlay">🔊 Нажмите для звука</div>
    <div class="speed-indicator">2x</div>
    <div class="video-avatar">
      <img src="" alt="" onerror="this.style.display='none'">
      <button class="plus-btn" data-user="${v.user_id}">+</button>
    </div>
    <div class="video-info ${showInfo ? '' : 'hidden'}" data-user="${v.user_id}">
      <div class="username">@${v.user_id} · ${new Date(v.created).toLocaleDateString()}</div>
      <div class="desc">${v.name}</div>
    </div>
    <div class="video-actions">
      <button class="like-btn" data-id="${v.id}" data-likes="${v.likes}">❤️<span>${v.likes || 0}</span></button>
      <button class="comment-btn" data-id="${v.id}">💬<span>${v.comments || 0}</span></button>
      <button class="del-btn" data-id="${v.id}" style="${v.user_id === currentUser ? '' : 'display:none'}">🗑️</button>
    </div>
  `;
  
  const video = card.querySelector('video');
  const soundBtn = card.querySelector('.sound-btn');
  const unmute = card.querySelector('.unmute-overlay');
  const prog = card.querySelector('.progress-bar');
  const speed = card.querySelector('.speed-indicator');
  let timer, long = false;
  
  // Загрузка аватара
  getUser(v.user_id).then(acc => {
    if (acc?.avatar) card.querySelector('.video-avatar img').src = acc.avatar;
  });
  
  const updateSound = () => {
    video.muted = !audioEnabled;
    soundBtn.textContent = audioEnabled ? '🔊' : '🔇';
    if (unmute) unmute.classList.toggle('show', !audioEnabled);
  };
  updateSound();
  video.play().catch(() => {});
  soundBtn.addEventListener('click', e => {
    e.stopPropagation();
    audioEnabled = !audioEnabled;
    localStorage.setItem('tiktok_audio', audioEnabled);
    updateSound();
  });
  unmute?.addEventListener('click', e => {
    e.stopPropagation();
    audioEnabled = true;
    localStorage.setItem('tiktok_audio', true);
    updateSound();
  });
  
  video.addEventListener('timeupdate', () => {
    if (video.duration) prog.style.width = (video.currentTime / video.duration * 100) + '%';
  });
  
  new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        video.currentTime = 0;
        video.play().catch(() => {});
        addHistory(v.id, currentUser);
      } else {
        video.pause();
      }
    });
  }, { threshold: 0.7 }).observe(card);
  
  function likeAnim() {
    const h = document.createElement('div');
    h.className = 'like-animation';
    h.textContent = '❤️';
    card.appendChild(h);
    h.addEventListener('animationend', () => h.remove());
  }
  
  card.addEventListener('dblclick', async e => {
    e.preventDefault();
    const likes = (v.likes || 0) + 1;
    card.querySelector('.like-btn span').textContent = likes;
    await updateVideo(v.id, { likes });
    likeAnim();
  });
  
  card.addEventListener('touchstart', () => {
    timer = setTimeout(() => { long = true; video.playbackRate = 2; speed.style.display = 'block'; }, 500);
  });
  card.addEventListener('touchend', () => {
    clearTimeout(timer);
    if (long) { video.playbackRate = 1; speed.style.display = 'none'; long = false; }
  });
  card.addEventListener('touchmove', () => {
    clearTimeout(timer);
    if (long) { video.playbackRate = 1; speed.style.display = 'none'; long = false; }
  });
  
  card.querySelector('.plus-btn')?.addEventListener('click', async e => {
    e.stopPropagation();
    const u = e.target.dataset.user;
    if (u && u !== currentUser) {
      if (await isFollowing(currentUser, u)) await unfollow(currentUser, u);
      else await follow(currentUser, u);
    }
  });
  
  card.querySelector('.video-info')?.addEventListener('click', async e => {
    e.stopPropagation();
    const u = e.currentTarget.dataset.user;
    if (u) {
      $$('.nav-item').forEach(i => i.classList.remove('active'));
      document.querySelector('[data-panel="profilePanel"]').classList.add('active');
      $$('.panel').forEach(p => p.classList.remove('active'));
      $('#profilePanel').classList.add('active');
      await renderProfile(u);
    }
  });
  
  card.querySelector('.like-btn').addEventListener('click', async function(e) {
    e.stopPropagation();
    const likes = (v.likes || 0) + 1;
    this.dataset.likes = likes;
    this.querySelector('span').textContent = likes;
    await updateVideo(v.id, { likes });
    likeAnim();
  });
  
  card.querySelector('.comment-btn').addEventListener('click', async function(e) {
    e.stopPropagation();
    const id = +this.dataset.id;
    currentVideoId = id;
    await renderComments(id);
    $('#commentsOverlay').classList.add('active');
  });
  
  card.querySelector('.del-btn')?.addEventListener('click', async function(e) {
    e.stopPropagation();
    if (!confirm('Удалить?')) return;
    await deleteVideo(+this.dataset.id);
    await renderFeed(true);
    await renderProfile(currentUser);
  });
  
  return card;
}

async function renderProfile(user) {
  const acc = await getUser(user);
  if (!acc) return;
  $('#profileAvatar').src = acc.avatar || '';
  let nameHtml = '@' + user;
  if (acc.verified) nameHtml += ' <span class="verified-badge">✓</span>';
  $('#profileName').innerHTML = nameHtml;
  $('#profileNick').textContent = acc.nickname || user;
  
  const videos = await getAllVideos();
  const my = videos.filter(v => v.user_id === user);
  const followers = await getFollowersCount(user);
  const following = await getFollowingCount(user);
  const hist = await getHistory(user);
  const size = my.reduce((s, v) => s + 1, 0);
  $('#profileStats').innerHTML = `Видео: ${size}<br>Подписчики: ${followers} · Подписки: ${following}<br>Просмотров: ${hist.length}`;
  
  if (user !== currentUser) {
    const isF = await isFollowing(currentUser, user);
    $('#followBtn').style.display = 'block';
    $('#followBtn').textContent = isF ? 'Отписаться' : 'Подписаться';
    $('#followBtn').onclick = async () => {
      if (isF) await unfollow(currentUser, user);
      else await follow(currentUser, user);
      await renderProfile(user);
    };
  } else {
    $('#followBtn').style.display = 'none';
  }
  
  const grid = $('#profileVideos');
  grid.innerHTML = '';
  if (my.length) {
    my.sort((a, b) => b.created - a.created);
    my.forEach(v => {
      const d = document.createElement('div');
      d.className = 'thumb';
      d.innerHTML = `<video src="${v.url}" muted loop></video>`;
      d.addEventListener('click', () => {
        $$('.nav-item').forEach(i => i.classList.remove('active'));
        document.querySelector('[data-panel="feedPanel"]').classList.add('active');
        $$('.panel').forEach(p => p.classList.remove('active'));
        $('#feedPanel').classList.add('active');
        renderFeedStartingFrom(v.id);
      });
      grid.appendChild(d);
    });
  } else {
    grid.innerHTML = '<div style="color:var(--text2);padding:1rem;text-align:center;">Нет видео</div>';
  }
}

async function renderFeedStartingFrom(videoId) {
  const videos = await getAllVideos();
  const feed = $('#feedPanel');
  feed.innerHTML = '';
  videos.sort((a, b) => b.created - a.created);
  const idx = videos.findIndex(v => v.id === videoId);
  const reordered = videos.slice(idx).concat(videos.slice(0, idx));
  reordered.forEach(v => feed.appendChild(createCard(v)));
  feed.scrollTop = 0;
}

async function renderAdminPanel(container) {
  container.innerHTML = '<p>Загрузка...</p>';
  const users = await getAllUsers();
  const videos = await getAllVideos();
  let html = `<h4>Пользователи (${users.length})</h4>`;
  for (const u of users) {
    const banInfo = u.banned ? (u.ban_until ? `🚫 до ${new Date(u.ban_until).toLocaleDateString()}` : '🚫 навсегда') : '';
    html += `<div class="admin-user-item">
      <span>@${u.login} ${u.verified ? '<span class="verified-badge">✓</span>' : ''} ${banInfo} (${u.role})</span>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        <button data-user="${u.login}" class="verify-btn">${u.verified ? 'Снять' : 'Вериф.'}</button>
        <button data-user="${u.login}" class="ban-btn">Бан</button>
        <button data-user="${u.login}" class="warn-btn">⚠️</button>
        <button data-user="${u.login}" class="view-btn">👁️</button>
        <button data-user="${u.login}" class="delete-user-btn">🗑️</button>
      </div>
    </div>`;
  }
  html += `<h4 style="margin-top:1rem;">Видео (${videos.length})</h4>`;
  for (const v of videos) {
    html += `<div class="admin-user-item"><span>🎬 ${v.name} от @${v.user_id}</span><button data-videoid="${v.id}" class="delete-video-admin-btn">🗑️</button></div>`;
  }
  container.innerHTML = html;
  
  container.querySelectorAll('.verify-btn').forEach(b => b.addEventListener('click', async () => {
    const login = b.dataset.user;
    const acc = await getUser(login);
    if (acc) { acc.verified = !acc.verified; await updateUser(login, { verified: acc.verified }); addLog(`${login} верификация: ${acc.verified}`); renderAdminPanel(container); }
  }));
  container.querySelectorAll('.delete-user-btn').forEach(b => b.addEventListener('click', async () => {
    const login = b.dataset.user;
    if (confirm(`Удалить @${login}?`)) {
      const acc = await getUser(login);
      if (acc) await supabaseDelete('users', acc.id);
      addLog(`Удалён ${login}`);
      renderAdminPanel(container);
    }
  }));
  container.querySelectorAll('.delete-video-admin-btn').forEach(b => b.addEventListener('click', async () => {
    const id = +b.dataset.videoid;
    if (confirm('Удалить видео?')) { await deleteVideo(id); addLog(`Видео #${id} удалено`); renderAdminPanel(container); }
  }));
  container.querySelectorAll('.ban-btn').forEach(b => b.addEventListener('click', () => showBanModal(b.dataset.user, container)));
  container.querySelectorAll('.warn-btn').forEach(b => b.addEventListener('click', () => showWarnModal(b.dataset.user, container)));
  container.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', async () => {
    const acc = await getUser(b.dataset.user);
    alert(`@${acc.login}\nНик: ${acc.nickname}\nРоль: ${acc.role}\nВерифицирован: ${acc.verified ? 'да' : 'нет'}\nБан: ${acc.banned ? (acc.ban_reason || '') : 'нет'}\nПредупреждений: ${(acc.warnings || []).length}`);
  }));
}

// ---- МОДАЛЬНЫЕ ОКНА (БАН/ПРЕДУПРЕЖДЕНИЕ) ----
function showBanModal(login, container) {
  const overlay = $('#modalOverlay');
  overlay.classList.add('active');
  $('#modalBox').innerHTML = `
    <h3>Бан @${login}</h3>
    <select id="banDuration">
      <option value="0">Навсегда</option>
      <option value="1">1 день</option>
      <option value="7">7 дней</option>
      <option value="30">30 дней</option>
    </select>
    <input type="text" id="banReason" placeholder="Причина">
    <button id="applyBanBtn">Забанить</button>
    <button id="cancelBanBtn">Отмена</button>
  `;
  $('#cancelBanBtn').addEventListener('click', () => overlay.classList.remove('active'));
  $('#applyBanBtn').addEventListener('click', async () => {
    const duration = +$('#banDuration').value;
    const reason = $('#banReason').value.trim();
    const acc = await getUser(login);
    if (acc) {
      await updateUser(login, { banned: true, ban_reason: reason, ban_until: duration > 0 ? Date.now() + duration * 86400000 : 0 });
      addLog(`Бан ${login}: ${reason || 'без причины'}`);
      await addModAction('ban', login, reason, duration);
      overlay.classList.remove('active');
      renderAdminPanel(container);
    }
  });
}

function showWarnModal(login, container) {
  const overlay = $('#modalOverlay');
  overlay.classList.add('active');
  $('#modalBox').innerHTML = `
    <h3>Предупреждение @${login}</h3>
    <select id="warnReason">
      <option>Спам</option>
      <option>Оскорбление</option>
      <option>Нарушение авторских прав</option>
      <option>Другое</option>
    </select>
    <button id="applyWarnBtn">Выдать</button>
    <button id="cancelWarnBtn">Отмена</button>
  `;
  $('#cancelWarnBtn').addEventListener('click', () => overlay.classList.remove('active'));
  $('#applyWarnBtn').addEventListener('click', async () => {
    const reason = $('#warnReason').value;
    const acc = await getUser(login);
    if (acc) {
      const warnings = acc.warnings || [];
      warnings.push(reason);
      await updateUser(login, { warnings });
      addLog(`Предупреждение ${login}: ${reason}`);
      await addModAction('warn', login, reason);
      overlay.classList.remove('active');
      renderAdminPanel(container);
    }
  });
}

      banned: false,
      ban_reason: '',
      ban_until: 0,
      warnings: [],
      created: Date.now()
    });
    addLog('Администратор Grustish создан');
  }
}

if (currentUser) {
  $('#authScreen').classList.add('hidden');
  window.addEventListener('DOMContentLoaded', async () => {
    await initStorage();
    await createDefaultAdmin();
    await loadApp();
  });
}
</script>
</body>
