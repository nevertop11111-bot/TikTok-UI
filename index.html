<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Хранилище · N25</title>
  <style>
    :root {
      --bg: #0b0e14; --bg2: #1a1f2b; --card: rgba(10,12,20,0.7);
      --text: #e0e0e0; --accent: #6c8cff; --border: rgba(255,255,255,0.1); --input: #1e2330;
    }
    .light {
      --bg: #e8ecf1; --bg2: #d0d5dc; --card: rgba(255,255,255,0.8);
      --text: #1a1f2b; --accent: #4a6cf7; --border: rgba(0,0,0,0.1); --input: #fff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(150deg, var(--bg), var(--bg2));
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      padding: 20px; color: var(--text); transition: 0.3s;
    }
    .app {
      max-width: 1100px; width: 100%; background: rgba(20,24,33,0.8);
      backdrop-filter: blur(25px); border-radius: 40px; padding: 1.5rem;
      box-shadow: 0 30px 50px rgba(0,0,0,0.5); border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 1rem; margin: auto;
    }
    .light .app { background: rgba(255,255,255,0.7); }
    .header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 0.6rem; justify-content: center; }
    .header h1 { font-size: 1.3rem; font-weight: 500; }
    .badge { padding: 3px 8px; border-radius: 15px; font-size: 0.65rem; }
    .badge.test { background: rgba(255,200,100,0.2); color: #ffcc88; }
    .badge.ok { background: rgba(100,255,150,0.2); color: #8f8; }
    .badge.err { background: rgba(255,100,100,0.2); color: #ff8888; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
    .search {
      background: var(--input); border: 1px solid var(--border); border-radius: 25px;
      padding: 8px 14px; color: var(--text); flex: 1; min-width: 150px; font-size: 0.85rem; max-width: 400px;
    }
    .icon-btn {
      background: rgba(255,255,255,0.1); border: 1px solid var(--border);
      border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
    }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
    .tab {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 25px; padding: 6px 14px; color: var(--text); cursor: pointer; font-size: 0.75rem;
    }
    .tab.active { background: rgba(255,255,255,0.15); }
    .tab.log-tab { background: rgba(255,200,100,0.1); border-color: rgba(255,200,100,0.3); }
    .panel { display: none; flex-direction: column; gap: 0.8rem; }
    .panel.active { display: flex; }
    .drop-zone {
      border: 2px dashed var(--border); border-radius: 16px; padding: 1.5rem;
      text-align: center; cursor: pointer; color: #8890aa; transition: 0.3s; font-size: 0.85rem;
      max-width: 500px; margin: 0 auto; width: 100%;
    }
    .drop-zone.drag { border-color: var(--accent); background: rgba(108,140,255,0.1); }
    .drop-zone:hover { border-color: rgba(255,255,255,0.3); }
    
    .menu-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .menu-btn {
      background: rgba(255,255,255,0.08); border: 1px solid var(--border);
      border-radius: 20px; padding: 8px 14px; color: var(--text); cursor: pointer;
      font-size: 0.8rem; position: relative; display: flex; align-items: center; gap: 6px;
    }
    .menu-btn:hover { background: rgba(255,255,255,0.15); }
    .menu-btn .arrow { font-size: 0.6rem; }
    .mini-menu {
      display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 4px;
      background: #1e2330; border: 1px solid var(--border); border-radius: 12px;
      padding: 6px; z-index: 100; min-width: 180px; max-height: 300px; overflow-y: auto;
    }
    .mini-menu.show { display: block; }
    .mini-menu button {
      display: block; width: 100%; text-align: left; background: none; border: none;
      color: var(--text); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.75rem;
    }
    .mini-menu button:hover { background: rgba(255,255,255,0.1); }
    .mini-menu button.active { background: rgba(108,140,255,0.2); color: #a0b8ff; }
    .mini-menu .section-title { font-size: 0.7rem; color: #8890aa; padding: 6px 10px 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; justify-content: center; }
    .card {
      background: var(--card); border-radius: 14px; overflow: hidden;
      border: 1px solid var(--border); max-width: 240px; margin: 0 auto; width: 100%;
    }
    .card img, .card video { width: 100%; max-height: 120px; object-fit: cover; background: #000; }
    .card-body { padding: 8px; font-size: 0.75rem; }
    .card-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 0.65rem; color: #96a0b8; display: flex; justify-content: space-between; }
    .tag { background: rgba(108,140,255,0.2); padding: 1px 6px; border-radius: 8px; font-size: 0.6rem; color: #a0b8ff; margin: 1px; display: inline-block; }
    .card-actions { display: flex; gap: 3px; margin-top: 3px; justify-content: center; }
    .btn {
      background: rgba(255,255,255,0.1); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 12px; color: var(--text); cursor: pointer; font-size: 0.75rem;
    }
    .btn:hover { background: rgba(255,255,255,0.2); }
    .btn-sm { padding: 3px 8px; font-size: 0.65rem; border-radius: 12px; }
    .btn-accent { background: rgba(100,200,255,0.2); color: #a0d8ff; }
    .btn-danger { background: rgba(255,90,90,0.2); color: #ffaaaa; }
    .chart { width: 50px; height: 50px; border-radius: 50%; position: relative; margin: 0 auto; }
    .chart span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; }
    .gallery {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000;
      display: none; align-items: center; justify-content: center; cursor: pointer;
    }
    .gallery.show { display: flex; }
    .gallery img { max-width: 90%; max-height: 90%; border-radius: 20px; }
    .p2p-box { border: 1px solid rgba(100,200,255,0.3); border-radius: 16px; padding: 0.8rem; text-align: center; }
    .code { font-size: 1.1rem; font-weight: 700; color: #ffcc88; letter-spacing: 2px; }
    .empty { text-align: center; padding: 1.5rem; color: #7b8399; grid-column: 1/-1; }
    .toast {
      position: fixed; top: 20px; right: 20px; background: #ff6b6b; color: white;
      padding: 10px 16px; border-radius: 12px; z-index: 999; display: none;
    }
    .toast.show { display: block; animation: fade 3s forwards; }
    @keyframes fade { 0%,70%{opacity:1} 100%{opacity:0} }
    .current-settings { font-size: 0.7rem; color: #8890aa; text-align: center; }
    .log-container { max-height: 500px; overflow-y: auto; }
    .log-entry {
      padding: 8px 12px; border-radius: 10px; margin-bottom: 4px;
      font-size: 0.75rem; font-family: monospace; display: flex; gap: 10px; align-items: flex-start;
    }
    .log-entry.info { background: rgba(100,200,255,0.1); border-left: 3px solid #6c8cff; }
    .log-entry.warn { background: rgba(255,200,100,0.1); border-left: 3px solid #ffcc88; }
    .log-entry.error { background: rgba(255,100,100,0.1); border-left: 3px solid #ff6b6b; }
    .log-entry.critical { background: rgba(255,50,50,0.2); border-left: 3px solid #ff3333; }
    .log-entry.success { background: rgba(100,255,150,0.1); border-left: 3px solid #8f8; }
    .log-num { min-width: 45px; color: #8890aa; }
    .log-time { min-width: 70px; color: #6670aa; }
    .log-msg { flex: 1; }
    .log-stats { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; justify-content: center; }
    .log-stat { font-size: 0.75rem; padding: 4px 10px; border-radius: 15px; background: rgba(0,0,0,0.3); }
    .log-stat.c { color: #ff6b6b; }
    .log-stat.e { color: #ff8888; }
    .log-stat.w { color: #ffcc88; }
    .log-stat.i { color: #a0d8ff; }
    .log-stat.s { color: #8f8; }
    .status { text-align: center; font-size: 0.75rem; color: #b9c2ff; }
  </style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="gallery" id="gallery"><img id="galleryImg" src="" alt=""></div>

<div class="app" id="app">
  <div class="header">
    <h1>📦 Хранилище</h1>
    <span class="badge test" id="ver">N25</span>
    <span class="badge" id="ffmpegBadge">⏳</span>
    <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
  </div>

  <div class="row">
    <input type="text" class="search" id="search" placeholder="🔍 Поиск...">
    <button class="btn" id="exportBtn">📤 Экспорт</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="video">🎬 Видео</button>
    <button class="tab" data-tab="files">📁 Файлы</button>
    <button class="tab" data-tab="all">🔀 Всё</button>
    <button class="tab" data-tab="p2p">🔗 P2P</button>
    <button class="tab log-tab" data-tab="logs">📋 Логи</button>
  </div>

  <div class="panel active" id="tab-video">
    <div class="drop-zone" id="videoDrop">
      📤 Нажмите сюда для выбора видео
      <input type="file" id="videoInput" accept="video/*" hidden>
    </div>
    <div class="menu-row">
      <div style="position:relative;"><button class="menu-btn" id="modeBtn"><span id="modeLabel">📥 Обычная</span> <span class="arrow">▼</span></button><div class="mini-menu" id="modeMenu"><button class="active" data-mode="normal">📥 Обычная</button><button data-mode="fast">⚡ Быстрая</button></div></div>
      <div style="position:relative;"><button class="menu-btn" id="bitrateBtn"><span id="bitrateLabel">🎬 Битрейт: 5 Мбит/с</span> <span class="arrow">▼</span></button><div class="mini-menu" id="bitrateMenu"><div class="section-title">🎬 Профили битрейта</div><button data-bitrate="2" data-resolution="1280x720">💾 2 Мбит/с</button><button class="active" data-bitrate="5" data-resolution="1920x1080">📺 5 Мбит/с</button><button data-bitrate="10" data-resolution="1920x1080">🎥 10 Мбит/с</button><button data-bitrate="20" data-resolution="3840x2160">🎬 20 Мбит/с</button><button data-bitrate="40" data-resolution="7680x4320">🔥 40 Мбит/с</button></div></div>
      <div style="position:relative;"><button class="menu-btn" id="enhanceBtn"><span id="enhanceLabel">✨ Улучшение: 100%</span> <span class="arrow">▼</span></button><div class="mini-menu" id="enhanceMenu"><div class="section-title">✨ Уровень улучшения</div><button data-enhance="0">🚫 Выкл</button><button data-enhance="25">25%</button><button data-enhance="50">50%</button><button class="active" data-enhance="100">100%</button><button data-enhance="200">200%</button><button data-enhance="300">300%</button><button data-enhance="500">500%</button></div></div>
      <div style="position:relative;"><button class="menu-btn" id="processBtn"><span id="processLabel">🎬 С обработкой</span> <span class="arrow">▼</span></button><div class="mini-menu" id="processMenu"><button class="active" data-process="yes">🎬 С обработкой</button><button data-process="no">📦 Без обработки</button></div></div>
    </div>
    <div class="current-settings" id="currentSettings"></div>
    <div id="progressRow" style="display:none;"><div class="row"><span id="progressLabel">⚙️ Обработка...</span><span id="progressPercent">0%</span></div><div style="height:4px;background:#2a3040;border-radius:10px;overflow:hidden;max-width:400px;margin:0 auto;width:100%;"><div id="progressFill" style="height:100%;background:#6c8cff;width:0%;transition:0.3s;"></div></div></div>
    <div class="grid" id="videoGrid"></div>
  </div>

  <div class="panel" id="tab-files">
    <div class="drop-zone" id="fileDrop">📤 Нажмите сюда для выбора файлов<input type="file" id="fileInput" multiple hidden></div>
    <div class="grid" id="fileGrid"></div>
  </div>

  <div class="panel" id="tab-all">
    <div class="row"><button class="btn" id="shuffleBtn">🔄 Перемешать</button><div class="chart" id="chart"></div></div>
    <div class="grid" id="allGrid"></div>
  </div>

  <div class="panel" id="tab-p2p">
    <div class="p2p-box">
      <p>🔗 Код: <span class="code" id="myCode">—</span> <button class="btn btn-sm" id="copyCode">📋</button></p>
      <p>🔗 Ссылка: <span id="shareLink" style="word-break:break-all;font-size:0.7rem;">—</span> <button class="btn btn-sm" id="copyLink">📋</button></p>
      <div class="row"><input type="text" id="remoteCode" placeholder="Код" maxlength="8" style="background:var(--input);border:1px solid var(--border);border-radius:20px;padding:6px;color:var(--text);width:110px;text-align:center;"><button class="btn btn-accent" id="connectBtn">🔗</button></div>
      <div id="remoteGrid"></div>
    </div>
  </div>

  <div class="panel" id="tab-logs">
    <div class="log-stats" id="logStats"><span class="log-stat c">🔥 0</span><span class="log-stat e">❌ 0</span><span class="log-stat w">⚠️ 0</span><span class="log-stat i">ℹ️ 0</span><span class="log-stat s">✅ 0</span></div>
    <div class="row"><button class="btn btn-sm" id="clearLogsBtn">🗑️ Очистить</button><button class="btn btn-sm" id="exportLogsBtn">📤 Экспорт логов</button></div>
    <div class="log-container" id="logContainer"></div>
  </div>

  <div class="status" id="status"></div>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
(async function() {
  const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
  const logs=[],LOG={C:'critical',E:'error',W:'warn',I:'info',S:'success'};let logCounter=1;
  function addLog(t,m){const e={num:logCounter++,type:t,msg:m,time:new Date().toLocaleTimeString(),date:new Date().toLocaleDateString()};logs.unshift(e);if(logs.length>500)logs.length=500;renderLogs();updateLogStats();console[t===LOG.C||t===LOG.E?'error':t===LOG.W?'warn':'log'](`[${t.toUpperCase()}] #${e.num}: ${m}`);return e.num}
  function renderLogs(){$('#logContainer').innerHTML=logs.map(l=>{const e={critical:'🔥',error:'❌',warn:'⚠️',info:'ℹ️',success:'✅'}[l.type]||'';return `<div class="log-entry ${l.type}"><span class="log-num">#${l.num}</span><span class="log-time">${l.time}</span><span class="log-msg">${e} ${l.msg}</span></div>`}).join('')}
  function updateLogStats(){const c={};logs.forEach(l=>c[l.type]=(c[l.type]||0)+1);$('#logStats').innerHTML=`<span class="log-stat c">🔥 ${c.critical||0}</span><span class="log-stat e">❌ ${c.error||0}</span><span class="log-stat w">⚠️ ${c.warn||0}</span><span class="log-stat i">ℹ️ ${c.info||0}</span><span class="log-stat s">✅ ${c.success||0}</span>`}
  addLog(LOG.I,'🚀 N25 запущен');
  addLog(LOG.I,'📋 Система логирования активна');

  let ffmpegLoaded=false,ffmpeg=null;

  // ============================================
  // ВСТАВЬ НОВЫЙ initFFmpeg ЗДЕСЬ
  // ============================================
  async function initFFmpeg(){
    const startTime=Date.now();
    addLog(LOG.I,'⏳ Загрузка FFmpeg...');
    
    let a=0;
    while(!window.FFmpegWasm && a<80){await new Promise(r=>setTimeout(r,500));a++;}
    
    if(!window.FFmpegWasm){
      addLog(LOG.W,'📡 Пробую запасной CDN...');
      await new Promise((resolve)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js';
        s.onload=resolve;
        s.onerror=()=>resolve();
        document.head.appendChild(s);
      });
      let fa=0;
      while(!window.FFmpegWasm && fa<40){await new Promise(r=>setTimeout(r,500));fa++;}
    }
    
    if(!window.FFmpegWasm){
      addLog(LOG.C,'FFmpeg не загрузился');
      addLog(LOG.W,'Видео без обработки');
      return;
    }
    
    try{
      const{FFmpeg}=window.FFmpegWasm;
      ffmpeg=new FFmpeg();
      await ffmpeg.load();
      ffmpegLoaded=true;
      const t=((Date.now()-startTime)/1000).toFixed(0);
      $('#ffmpegBadge').textContent='✅ FFmpeg';
      $('#ffmpegBadge').className='badge ok';
      addLog(LOG.S,`FFmpeg готов (${t}сек)`);
    }catch(e){
      addLog(LOG.E,`Ошибка FFmpeg: ${e.message}`);
    }
  }
  // ============================================
  // КОНЕЦ ВСТАВКИ
  // ============================================

  let uploadMode='normal',bitrate='5',resolution='1920x1080',enhanceLevel=100,processVideo='yes',myCode,filter='';
  function updateSettings(){$('#currentSettings').textContent=`${uploadMode==='fast'?'⚡ Быстрая':'📥 Обычная'} · ${bitrate}Мбит/с · ${processVideo==='yes'?'обработка':'без'} · ${enhanceLevel}%`}

  const DB='FileStorageDB',Vv=1,VS='videos',FS='files';let db;
  function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,Vv);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(VS))d.createObjectStore(VS,{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains(FS))d.createObjectStore(FS,{keyPath:'id',autoIncrement:true})};r.onsuccess=e=>{db=e.target.result;resolve()};r.onerror=()=>reject()})}
  const getAll=s=>new Promise(r=>{const t=db.transaction([s],'readonly');t.objectStore(s).getAll().onsuccess=e=>r(e.target.result||[])});
  const addItem=(s,d)=>new Promise(r=>{const t=db.transaction([s],'readwrite');t.objectStore(s).add(d).onsuccess=e=>r(e.target.result)});
  const delItem=(s,id)=>new Promise(r=>{const t=db.transaction([s],'readwrite');t.objectStore(s).delete(id);t.oncomplete=()=>r()});

  function toggleMenu(m){const o=m.classList.contains('show');$$('.mini-menu').forEach(x=>x.classList.remove('show'));if(!o)m.classList.add('show')}
  document.addEventListener('click',e=>{if(!e.target.closest('.menu-btn'))$$('.mini-menu').forEach(m=>m.classList.remove('show'))});

  let light=localStorage.getItem('theme')==='light';if(light){$('#app').classList.add('light');$('#themeBtn').textContent='☀️'}
  $('#themeBtn').addEventListener('click',()=>{light=!light;$('#app').classList.toggle('light',light);$('#themeBtn').textContent=light?'☀️':'🌙';localStorage.setItem('theme',light?'light':'dark')});
  $$('.tab').forEach(t=>t.addEventListener('click',()=>{$$('.tab').forEach(b=>b.classList.remove('active'));t.classList.add('active');$$('.panel').forEach(p=>p.classList.remove('active'));$(`#tab-${t.dataset.tab}`).classList.add('active')}));
  $('#modeBtn').addEventListener('click',e=>{e.stopPropagation();toggleMenu($('#modeMenu'))});$$('#modeMenu button').forEach(b=>b.addEventListener('click',()=>{$$('#modeMenu button').forEach(x=>x.classList.remove('active'));b.classList.add('active');uploadMode=b.dataset.mode;$('#modeLabel').textContent=uploadMode==='fast'?'⚡ Быстрая':'📥 Обычная';$('#modeMenu').classList.remove('show');updateSettings()}));
  $('#bitrateBtn').addEventListener('click',e=>{e.stopPropagation();toggleMenu($('#bitrateMenu'))});$$('#bitrateMenu button').forEach(b=>b.addEventListener('click',()=>{$$('#bitrateMenu button').forEach(x=>x.classList.remove('active'));b.classList.add('active');bitrate=b.dataset.bitrate;resolution=b.dataset.resolution;$('#bitrateLabel').textContent=`🎬 ${bitrate} Мбит/с`;$('#bitrateMenu').classList.remove('show');updateSettings()}));
  $('#enhanceBtn').addEventListener('click',e=>{e.stopPropagation();toggleMenu($('#enhanceMenu'))});$$('#enhanceMenu button').forEach(b=>b.addEventListener('click',()=>{$$('#enhanceMenu button').forEach(x=>x.classList.remove('active'));b.classList.add('active');enhanceLevel=parseInt(b.dataset.enhance);$('#enhanceLabel').textContent=`✨ ${enhanceLevel}%`;$('#enhanceMenu').classList.remove('show');updateSettings()}));
  $('#processBtn').addEventListener('click',e=>{e.stopPropagation();toggleMenu($('#processMenu'))});$$('#processMenu button').forEach(b=>b.addEventListener('click',()=>{$$('#processMenu button').forEach(x=>x.classList.remove('active'));b.classList.add('active');processVideo=b.dataset.process;$('#processLabel').textContent=processVideo==='yes'?'🎬 С обработкой':'📦 Без обработки';$('#processMenu').classList.remove('show');updateSettings()}));
  $('#search').addEventListener('input',()=>{filter=$('#search').value.toLowerCase();refresh()});
  function filterItems(items){if(!filter)return items;return items.filter(i=>(i.fileName||'').toLowerCase().includes(filter)||(i.tags||[]).join(' ').toLowerCase().includes(filter))}

  async function encodeVideo(file){if(!ffmpegLoaded)return{blob:file,quality:'original'};if(processVideo==='no')return{blob:file,quality:'original'};if(enhanceLevel===0)return{blob:file,quality:'original'};const fb=(parseFloat(bitrate)*(enhanceLevel/100)).toFixed(0)+'M';$('#progressRow').style.display='block';try{const inn='in_'+Date.now()+'.'+(file.name.split('.').pop()||'mp4'),out='out_'+Date.now()+'.mp4';await ffmpeg.writeFile(inn,new Uint8Array(await file.arrayBuffer()));ffmpeg.on('progress',({progress})=>{const p=Math.round(progress*100);$('#progressFill').style.width=p+'%';$('#progressPercent').textContent=p+'%'});await ffmpeg.exec(['-i',inn,'-vf',`scale=${resolution}`,'-b:v',fb,'-c:v','libx264','-preset','fast','-c:a','aac','-b:a','128k',out]);const od=await ffmpeg.readFile(out),blob=new Blob([od.buffer],{type:'video/mp4'});await ffmpeg.deleteFile(inn);await ffmpeg.deleteFile(out);$('#progressRow').style.display='none';return{blob,quality:`${resolution} ${fb}`}}catch(e){$('#progressRow').style.display='none';return{blob:file,quality:'original'}}}

  function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
  const isImg=n=>/\.(jpg|jpeg|png|gif|webp|bmp|svg)$/i.test(n),isVid=n=>/\.(mp4|webm|mov|mkv|avi)$/i.test(n),isAud=n=>/\.(mp3|wav|ogg|flac|aac)$/i.test(n);
  function card(item,store){const c=document.createElement('div');c.className='card';const url=URL.createObjectURL(item.blob),mb=(item.size/(1024*1024)).toFixed(2),name=item.fileName||'file';let pv='';if(isImg(name))pv=`<img src="${url}" onclick="$('#galleryImg').src='${url}';$('#gallery').classList.add('show')">`;else if(isVid(name))pv=`<video src="${url}" controls></video>`;else if(isAud(name))pv=`<div style="padding:20px;text-align:center;">🎵<br><audio src="${url}" controls style="width:100%;margin-top:8px;"></audio></div>`;else{const e=name.endsWith('.pdf')?'📕':name.endsWith('.zip')||name.endsWith('.rar')?'📦':'📄';pv=`<div style="height:100px;display:flex;align-items:center;justify-content:center;font-size:2rem;">${e}</div>`}const tags=(item.tags||[]).map(t=>`<span class="tag">${t}</span>`).join(''),qi=item.quality?`<div class="card-meta">🎬 ${item.quality}</div>`:'';c.innerHTML=`${pv}<div class="card-body"><div class="card-title">📁 ${name}</div><div class="card-meta">💾 ${mb} МБ</div>${qi}${tags?'<div>'+tags+'</div>':''}<div class="card-actions"><button class="btn btn-sm tag-btn">🏷️</button><button class="btn btn-sm btn-danger del-btn">🗑️</button></div></div>`;c.querySelector('.del-btn').addEventListener('click',async()=>{if(!confirm('Удалить?'))return;await delItem(store,item.id);await refresh()});c.querySelector('.tag-btn').addEventListener('click',async()=>{const t=prompt('Теги:');if(t===null)return;item.tags=t.split(',').map(x=>x.trim()).filter(Boolean);await addItem(store,item);await refresh()});return c}
  async function renderGrid(grid,store){const items=filterItems(await getAll(store));grid.innerHTML='';if(!items.length){grid.innerHTML='<div class="empty">Пусто</div>';return}items.sort((a,b)=>b.timestamp-a.timestamp);items.forEach(i=>grid.appendChild(card(i,store)))}
  async function renderAll(){const v=(await getAll(VS)).map(x=>({...x,store:VS})),f=(await getAll(FS)).map(x=>({...x,store:FS})),all=filterItems([...v,...f]);all.sort(()=>Math.random()-.5);const grid=$('#allGrid');grid.innerHTML='';if(!all.length){grid.innerHTML='<div class="empty">🔀 Пусто</div>';return}all.forEach(i=>grid.appendChild(card(i,i.store)));const tv=v.reduce((s,x)=>s+(x.size||0),0),tf=f.reduce((s,x)=>s+(x.size||0),0),total=tv+tf||1;$('#chart').innerHTML=`<div style="width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--accent) ${(tv/total)*360}deg, #f59e0b ${(tv/total)*360}deg 360deg);"></div><span>🎬${((tv/total)*100).toFixed(0)}%</span>`}
  async function refresh(){await renderGrid($('#videoGrid'),VS);await renderGrid($('#fileGrid'),FS);await renderAll();await checkFull();await updateShared()}
  async function checkFull(){const v=await getAll(VS),f=await getAll(FS);if(v.reduce((s,x)=>s+(x.size||0),0)>120*.9*1024*1024*1024||f.reduce((s,x)=>s+(x.size||0),0)>60*.9*1024*1024*1024)toast('⚠️ Заполнено на 90%')}
  function setupDrop(zone,input,store,isVid){zone.addEventListener('click',()=>input.click());zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag')});zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));zone.addEventListener('drop',async e=>{e.preventDefault();zone.classList.remove('drag');for(const f of e.dataTransfer.files){if(isVid)await uploadVideo(f);else await addItem(store,{blob:f,fileName:f.name,timestamp:Date.now(),size:f.size,tags:[]})}await refresh()});input.addEventListener('change',async e=>{for(const f of e.target.files){if(isVid)await uploadVideo(f);else await addItem(store,{blob:f,fileName:f.name,timestamp:Date.now(),size:f.size,tags:[]})}input.value='';await refresh()})}
  async function uploadVideo(file){if(!file)return;let d=0;if(uploadMode==='normal'){d=await new Promise(r=>{const v=document.createElement('video');v.preload='metadata';const u=URL.createObjectURL(file);v.src=u;v.onloadedmetadata=()=>{URL.revokeObjectURL(u);r(v.duration)};v.onerror=()=>{URL.revokeObjectURL(u);r(0)}});if(d>1200){toast('Длиннее 20 мин!');return}}let blob=file,quality='original';if(uploadMode==='normal'&&processVideo==='yes'&&enhanceLevel>0){const r=await encodeVideo(file);blob=r.blob;quality=r.quality}await addItem(VS,{blob,fileName:file.name,duration:d,quality,timestamp:Date.now(),size:blob.size,tags:[]})}
  function genCode(){return Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('')}
  function getCode(){let c=localStorage.getItem('peer_code');if(!c){c=genCode();localStorage.setItem('peer_code',c)}return c}
  function getShareLink(code){const u=new URL(location.href);u.searchParams.set('code',code);return u.toString()}
  async function updateShared(){const v=await getAll(VS),f=await getAll(FS);localStorage.setItem('p2p_'+myCode,JSON.stringify({files:[...v,...f].map(x=>({name:x.fileName,size:x.size})),ts:Date.now()}))}
  function getRemote(code){const r=localStorage.getItem('p2p_'+code);if(!r)return null;const d=JSON.parse(r);if(Date.now()-d.ts>3e5){localStorage.removeItem('p2p_'+code);return null}return d.files}
  async function connectPeer(code){const files=getRemote(code),grid=$('#remoteGrid');grid.innerHTML='';if(!files||!files.length){grid.innerHTML='<p>🔍 Не найдено</p>';return}files.forEach(f=>{const d=document.createElement('div');d.style.cssText='display:flex;align-items:center;gap:8px;padding:8px;background:rgba(0,0,0,0.3);border-radius:8px;margin-bottom:4px;';d.innerHTML=`<span style="flex:1;">📁 ${f.name}</span><span>💾 ${(f.size/(1024*1024)).toFixed(2)} МБ</span><button class="btn btn-sm btn-accent">⬇️</button>`;d.querySelector('button').addEventListener('click',()=>alert('WebRTC: '+f.name));grid.appendChild(d)})}
  $('#exportBtn').addEventListener('click',async()=>{const all=[...await getAll(VS),...await getAll(FS)];let t='Список:\n\n';all.forEach(i=>t+=`${i.fileName} — ${(i.size/(1024*1024)).toFixed(2)} МБ\n`);const b=new Blob([t],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='files_list.txt';a.click();if(navigator.share)try{await navigator.share({title:'Список',files:[new File([b],'files_list.txt',{type:'text/plain'})]})}catch(e){}});
  $('#gallery').addEventListener('click',()=>$('#gallery').classList.remove('show'));
  $('#copyCode').addEventListener('click',()=>{navigator.clipboard.writeText(myCode);$('#status').textContent='📋 Скопирован'});
  $('#copyLink').addEventListener('click',async()=>{const l=getShareLink(myCode);await navigator.clipboard.writeText(l);$('#status').textContent='🔗 Скопирована';if(navigator.share)try{await navigator.share({title:'Хранилище',url:l})}catch(e){}});
  $('#connectBtn').addEventListener('click',async()=>{const c=$('#remoteCode').value.trim().toUpperCase();if(c)await connectPeer(c)});
  $('#shuffleBtn').addEventListener('click',renderAll);
  $('#clearLogsBtn').addEventListener('click',()=>{logs.length=0;logCounter=1;renderLogs();updateLogStats()});
  $('#exportLogsBtn').addEventListener('click',async()=>{let t='Логи\n\n';logs.forEach(l=>t+=`#${l.num} [${l.time}] [${l.type.toUpperCase()}] ${l.msg}\n`);const b=new Blob([t],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='logs.txt';a.click();if(navigator.share)try{await navigator.share({title:'Логи',files:[new File([b],'logs.txt',{type:'text/plain'})]})}catch(e){}});

  async function init(){
    await initFFmpeg();
    try{await openDB()}catch(e){addLog(LOG.C,'БД не открыта');return}
    const cutoff=Date.now()-30*24*60*60*1000;
    for(const s of[VS,FS]){const items=await getAll(s);for(const i of items)if(i.timestamp&&i.timestamp<cutoff)await delItem(s,i.id)}
    myCode=getCode();$('#myCode').textContent=myCode;$('#shareLink').textContent=getShareLink(myCode);
    $('#ver').textContent='№2.1.10 V3.5 X5 P2P3 F6 LOG2 G2 PL3 "Beta Test" N25';
    setupDrop($('#videoDrop'),$('#videoInput'),VS,true);setupDrop($('#fileDrop'),$('#fileInput'),FS,false);
    updateSettings();await refresh();
    const ac=new URLSearchParams(location.search).get('code');
    if(ac)setTimeout(async()=>{$$('.tab').forEach(b=>b.classList.remove('active'));document.querySelector('[data-tab="p2p"]').classList.add('active');$$('.panel').forEach(p=>p.classList.remove('active'));$('#tab-p2p').classList.add('active');$('#remoteCode').value=ac;await connectPeer(ac)},500);
    setInterval(refresh,3e4);addLog(LOG.S,'Готово');$('#status').textContent='✅ Готово'}
  window.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
