<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }

    #authScreen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; }
    #authScreen.hidden { display: none; }
    #authBox { background: #111; border-radius: 20px; padding: 30px 20px; width: 90%; max-width: 340px; text-align: center; }
    #authBox h1 { font-size: 30px; margin-bottom: 5px; }
    #authBox h1 span { color: #ff0040; }
    #authBox p { color: #888; margin-bottom: 20px; font-size: 14px; }
    #authBox input { width: 100%; padding: 14px; margin: 6px 0; border-radius: 12px; border: 1px solid #222; background: #000; color: #fff; font-size: 16px; outline: none; }
    #authBox button { width: 100%; padding: 14px; margin: 6px 0; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
    #loginBtn { background: #ff0040; color: #fff; }
    #registerBtn { background: #00e5ff; color: #000; }
    #authError { color: #ff4444; margin-top: 10px; font-size: 14px; min-height: 20px; }

    #app { height: 100vh; display: flex; flex-direction: column; }
    #topBar { height: 50px; background: #0a0a0a; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
    #topBar span { font-weight: bold; font-size: 18px; }
    #topBar .coins-display { background: #ff0040; padding: 5px 12px; border-radius: 15px; font-size: 13px; font-weight: bold; }
    #topBar button { background: none; border: 1px solid #333; color: #fff; padding: 7px 15px; border-radius: 15px; font-size: 13px; cursor: pointer; }

    #content { flex: 1; position: relative; overflow: hidden; }
    .page { position: absolute; inset: 0; overflow-y: auto; display: none; padding-bottom: 80px; }
    .page.active { display: block; }

    #feedPage { overflow-y: scroll; }
    .vid { width: 100%; height: calc(100vh - 110px); position: relative; background: #000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-bottom: 2px solid #111; }
    .vid video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    .vid .info { position: absolute; bottom: 20px; left: 15px; right: 55px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 12px; z-index: 5; pointer-events: none; }
    .vid .info .uname { font-weight: bold; font-size: 14px; }
    .vid .info .title { font-size: 12px; color: #ccc; margin-top: 3px; }
    .vid .btns { position: absolute; right: 10px; bottom: 25px; display: flex; flex-direction: column; gap: 15px; z-index: 5; }
    .vid .btns button { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .vid .btns span { font-size: 11px; display: block; text-align: center; }
    .vid .sound { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; border: none; color: #fff; font-size: 18px; }

    #profilePage { padding: 25px; text-align: center; }
    #avatarImg { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #222; cursor: pointer; transition: all 0.3s; }
    #profilePage h3 { margin-top: 10px; font-size: 20px; }
    #profilePage .st { color: #888; font-size: 13px; margin: 5px 0 15px; }
    #profilePage button { display: block; width: 90%; max-width: 300px; margin: 6px auto; padding: 12px; border-radius: 20px; border: 1px solid #333; background: #111; color: #fff; font-size: 14px; cursor: pointer; }
    .verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #22c55e; font-size: 12px; color: #fff; margin-left: 5px; }

    /* МАГАЗИН */
    .shop-item { background: #111; border-radius: 16px; padding: 16px; margin: 10px 0; border: 1px solid #222; display: flex; align-items: center; gap: 14px; }
    .shop-icon { font-size: 36px; min-width: 44px; text-align: center; }
    .shop-info { flex: 1; }
    .shop-info h3 { font-size: 15px; margin-bottom: 3px; }
    .shop-info p { color: #888; font-size: 11px; }
    .shop-price { background: #ff0040; color: #fff; padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; white-space: nowrap; }
    .shop-owned { background: #22c55e; color: #000; padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 12px; border: none; }
    .my-items { background: #111; border-radius: 12px; padding: 15px; margin: 10px 0; }
    .my-item { display: inline-block; background: #1a1a1a; padding: 6px 14px; border-radius: 15px; margin: 4px; font-size: 13px; border: 1px solid #333; }

    /* АДМИН */
    .stat { display: inline-block; background: #111; padding: 12px 16px; border-radius: 12px; margin: 4px; font-size: 13px; text-align: center; min-width: 70px; }
    .stat b { display: block; font-size: 20px; color: #ff0040; }
    h4 { margin: 15px 0 8px; color: #888; font-size: 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #111; border-radius: 10px; margin: 4px 0; font-size: 13px; flex-wrap: wrap; gap: 6px; }
    .row button { padding: 8px 14px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; font-size: 12px; cursor: pointer; min-width: 50px; min-height: 38px; }
    .row .del { background: #ff0040; border-color: #ff0040; }
    .row .ban { background: #ff3333; border-color: #ff3333; }
    .row .ok { background: #22c55e; border-color: #22c55e; color: #000; }
    .gold-block { background: #1a1a1a; border-radius: 16px; padding: 16px; margin: 10px 0; border: 2px solid #ffd700; }
    .gold-block h4 { color: #ffd700; margin: 0 0 10px; }
    .gold-block select, .gold-block input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; margin: 6px 0; font-size: 14px; }
    .gold-block .gold-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; background: #ffd700; color: #000; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 6px; }

    #chatPage { padding: 15px; }
    .chatRow { display: flex; align-items: center; padding: 12px; background: #111; border-radius: 12px; margin: 4px 0; cursor: pointer; }
    .chatAv { width: 40px; height: 40px; border-radius: 50%; background: #222; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; margin: 3px 0; font-size: 13px; }
    .msg.sent { background: #ff0040; align-self: flex-end; }
    .msg.recv { background: #1a1a1a; border: 1px solid #222; align-self: flex-start; }
    #chatInput { display: flex; gap: 8px; padding: 10px; background: #0a0a0a; position: sticky; bottom: 0; }
    #chatInput input { flex: 1; padding: 10px; border-radius: 18px; border: 1px solid #222; background: #000; color: #fff; }
    #chatInput button { background: #ff0040; color: #fff; border: none; border-radius: 18px; padding: 10px 18px; cursor: pointer; font-weight: bold; }

    #bottomBar { height: 60px; background: #0a0a0a; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid #1a1a1a; position: absolute; bottom: 0; left: 0; right: 0; z-index: 20; }
    #bottomBar .nav { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; cursor: pointer; }
    #bottomBar .nav.on { color: #fff; }
    #bottomBar .nav .ico { font-size: 22px; }

    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #ff0040; color: #fff; padding: 10px 20px; border-radius: 20px; z-index: 99; font-weight: bold; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}

async function api(path,method,body){
  method=method||'GET';
  var h={'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY};
  var o={method:method,headers:h};
  if(body)o.body=JSON.stringify(body);
  var r=await fetch(URL+'/rest/v1/'+path,o);
  var t=await r.text();
  if(!r.ok)throw new Error(t);
  return t?JSON.parse(t):[];
}

var VideoCache={
  db:null,
  open:function(){
    var self=this;
    return new Promise(function(resolve){
      var r=indexedDB.open('TikTokCache',1);
      r.onupgradeneeded=function(e){e.target.result.createObjectStore('vids',{keyPath:'url'});};
      r.onsuccess=function(e){self.db=e.target.result;resolve();};
      r.onerror=function(){resolve();};
    });
  },
  get:function(url){var self=this;return new Promise(function(resolve){if(!self.db){resolve(null);return;}var tx=self.db.transaction('vids','readonly');var req=tx.objectStore('vids').get(url);req.onsuccess=function(){resolve(req.result?req.result.blob:null);};req.onerror=function(){resolve(null);};});},
  save:function(url,blob){var self=this;return new Promise(function(resolve){if(!self.db){resolve();return;}var tx=self.db.transaction('vids','readwrite');tx.objectStore('vids').put({url:url,blob:blob,time:Date.now()});tx.oncomplete=function(){resolve();};});},
  fetchAndCache:async function(url){var cached=await this.get(url);if(cached)return URL.createObjectURL(cached);try{var r=await fetch(url);var blob=await r.blob();await this.save(url,blob);return URL.createObjectURL(blob);}catch(e){return url;}},
  clear:function(){var self=this;return new Promise(function(resolve){if(!self.db){resolve();return;}var tx=self.db.transaction('vids','readwrite');tx.objectStore('vids').clear();tx.oncomplete=function(){resolve();};});}
};

// ЛЕНТА (исправлено: видео останавливаются)
async function loadFeed(){
  var fp = document.getElementById('feedPage');
  fp.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">Загрузка...</div>';
  
  try {
    var allVids = await api('videos?select=*');
    var vids = allVids.filter(function(v) { return v.visibility === 'all' || v.user_id === ME; });
    
    if (!vids.length) {
      fp.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">Нет видео</div>';
      return;
    }
    
    fp.innerHTML = '';
    vids.sort(function() { return Math.random() - 0.5; });
    activeVideo = null;
    
    // Сохраняем всех наблюдателей чтобы отключать при уходе со страницы
    var allObservers = [];
    
    for (var i = 0; i < vids.length; i++) {
      var v = vids[i];
      var canDel = (v.user_id === ME) || ADMIN;
      var div = document.createElement('div');
      div.className = 'vid';
      div.innerHTML = '<div style="color:#888;font-size:18px;">⏳</div>';
      fp.appendChild(div);
      
      (function(dd, vd, cd) {
        VideoCache.fetchAndCache(vd.url).then(function(localUrl) {
          dd.innerHTML = '';
          
          var video = document.createElement('video');
          video.src = localUrl;
          video.loop = true;
          video.playsInline = true;
          video.muted = true;
          video.setAttribute('playsinline', '');
          video.setAttribute('webkit-playsinline', '');
          video.style.cssText = 'width:100%;height:100%;object-fit:contain;background:#000;';
          dd.appendChild(video);
          
          var sb = document.createElement('button');
          sb.className = 'sound';
          sb.textContent = '🔇';
          
          var info = document.createElement('div');
          info.className = 'info';
          info.innerHTML = '<div class="uname">@' + vd.user_id + '</div><div class="title">' + (vd.name || '') + '</div>';
          
          var btns = document.createElement('div');
          btns.className = 'btns';
          btns.innerHTML = '<button class="like-btn">❤️<span>' + (vd.likes || 0) + '</span></button>' + (cd ? '<button class="del-btn">🗑️</button>' : '');
          
          dd.appendChild(sb);
          dd.appendChild(info);
          dd.appendChild(btns);
          
          // Observer: строго следит за видимостью
          var observer = new IntersectionObserver(function(entries) {
            var entry = entries[0];
            if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
              // Видео видно больше половины — запускаем
              if (activeVideo && activeVideo !== video) {
                activeVideo.pause();
                activeVideo.muted = true;
                var oldBtn = activeVideo.parentElement ? activeVideo.parentElement.querySelector('.sound') : null;
                if (oldBtn) oldBtn.textContent = '🔇';
              }
              activeVideo = video;
              video.muted = !SOUND;
              sb.textContent = SOUND ? '🔊' : '🔇';
              video.play().catch(function() {});
            } else if (entry.intersectionRatio < 0.3) {
              // Видео почти не видно — пауза
              video.pause();
              if (activeVideo === video) activeVideo = null;
            }
          }, { threshold: [0.1, 0.3, 0.5, 0.7] });
          
          observer.observe(dd);
          allObservers.push(observer);
          
          // Клик по видео
          video.addEventListener('click', function() {
            if (video.paused) {
              if (activeVideo && activeVideo !== video) {
                activeVideo.pause();
                activeVideo.muted = true;
              }
              activeVideo = video;
              video.muted = !SOUND;
              sb.textContent = SOUND ? '🔊' : '🔇';
              video.play().catch(function() {});
            } else {
              video.pause();
              if (activeVideo === video) activeVideo = null;
            }
          });
          
          // Звук
          sb.addEventListener('click', function(e) {
            e.stopPropagation();
            SOUND = !SOUND;
            video.muted = !SOUND;
            sb.textContent = SOUND ? '🔊' : '🔇';
          });
          
          // Лайк
          btns.querySelector('.like-btn').addEventListener('click', async function(e) {
            e.stopPropagation();
            var nl = (vd.likes || 0) + 1;
            this.querySelector('span').textContent = nl;
            await api('videos?id=eq.' + vd.id, 'PATCH', { likes: nl });
          });
          
          // Удаление
          if (cd) {
            btns.querySelector('.del-btn').addEventListener('click', async function(e) {
              e.stopPropagation();
              if (!confirm('Удалить?')) return;
              await api('videos?id=eq.' + vd.id, 'DELETE');
              toast('Удалено');
              loadFeed();
            });
          }
          
          // Запускаем первое видео
          if (!activeVideo && i === 0) {
            setTimeout(function() {
              if (video) {
                activeVideo = video;
                video.play().catch(function() {});
              }
            }, 500);
          }
        });
      })(div, v, canDel);
    }
    
    // Когда уходим со страницы — останавливаем все видео
    var pageObserver = new MutationObserver(function() {
      if (!document.getElementById('feedPage').classList.contains('active')) {
        // Останавливаем все видео
        var allVideos = fp.querySelectorAll('video');
        for (var k = 0; k < allVideos.length; k++) {
          allVideos[k].pause();
        }
        activeVideo = null;
      }
    });
    
    var feedPageEl = document.getElementById('feedPage');
    pageObserver.observe(feedPageEl, { attributes: true, attributeFilter: ['class'] });
    
  } catch (e) {
    fp.innerHTML = '<div style="text-align:center;padding:40px;color:red;">Ошибка</div>';
  }
}

// МАГАЗИН
function loadShop(){
  var sp = document.getElementById('shopPage');
  var html = '<h3 style="margin-bottom:10px;">🛒 Магазин MTikTok UI</h3>';
  html += '<p style="color:#888;margin-bottom:15px;">Баланс: <b style="color:#ff0040;" id="shopBalance">🪙 ' + MY_COINS + '</b></p>';
  
  if (MY_ITEMS.length > 0) {
    html += '<div class="my-items"><b>🎒 Куплено:</b><br>';
    MY_ITEMS.forEach(function(item) {
      var itemName = item;
      SHOP_ITEMS.forEach(function(si) { if (si.id === item) itemName = si.icon + ' ' + si.name; });
      html += '<span class="my-item">' + itemName + '</span>';
    });
    html += '</div>';
  }
  
  SHOP_ITEMS.forEach(function(item) {
    var owned = MY_ITEMS.includes(item.id);
    html += '<div class="shop-item">';
    html += '<div class="shop-icon">' + item.icon + '</div>';
    html += '<div class="shop-info"><h3>' + item.name + '</h3><p>' + item.desc + '</p></div>';
    if (owned) {
      html += '<button class="shop-owned">✓</button>';
    } else {
      html += '<button class="shop-price" data-item="' + item.id + '" data-price="' + item.price + '">🪙 ' + item.price + '</button>';
    }
    html += '</div>';
  });
  
  html += '<div style="height:30px;"></div>';
  sp.innerHTML = html;
  
  var buttons = sp.querySelectorAll('.shop-price');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].onclick = async function() {
      var itemId = this.getAttribute('data-item');
      var price = parseInt(this.getAttribute('data-price'));
      
      if (MY_COINS < price) {
        toast('❌ Не хватает коинов! Нужно: ' + price + ', есть: ' + MY_COINS);
        return;
      }
      
      if (!confirm('Купить за 🪙 ' + price + '?')) return;
      
      MY_COINS = MY_COINS - price;
      MY_ITEMS.push(itemId);
      
      await api('users?login=eq.' + encodeURIComponent(ME), 'PATCH', {
        coins: MY_COINS,
        items: JSON.stringify(MY_ITEMS)
      });
      
      if (itemId === 'upload_x5') {
        await api('users?login=eq.' + encodeURIComponent(ME), 'PATCH', { promo_limit: 5, upload_count: 0 });
      }
      if (itemId === 'upload_x10') {
        await api('users?login=eq.' + encodeURIComponent(ME), 'PATCH', { promo_limit: 10, upload_count: 0 });
      }
      if (itemId === 'upload_unlimited') {
        await api('users?login=eq.' + encodeURIComponent(ME), 'PATCH', { promo_limit: 999, upload_count: 0 });
      }
      
      updateCoinsDisplay();
      document.getElementById('shopBalance').textContent = '🪙 ' + MY_COINS;
      loadShop();
      loadProfile();
      toast('✅ Куплено!');
    };
  }
}

// ПРОФИЛЬ
async function loadProfile(){
  try {
    var u = await api('users?login=eq.' + encodeURIComponent(ME));
    if (!u.length) return;
    var user = u[0];
    
    MY_VISIBILITY = user.visibility || 'all';
    MY_COINS = user.coins || 0;
    
    try {
      MY_ITEMS = typeof user.items === 'string' ? JSON.parse(user.items) : (user.items || []);
    } catch(e) {
      MY_ITEMS = [];
    }
    
    updateCoinsDisplay();
    document.getElementById('avatarImg').src = user.avatar || '';
    
    var nm = '@' + ME;
    if (user.verified) nm += ' <span class="verified-badge">✓</span>';
    if (MY_ITEMS.includes('nick_color')) {
      nm = '<span style="color:#ff0040;">' + nm + '</span>';
    }
    if (MY_ITEMS.includes('secret_badge')) {
      nm += ' <span style="font-size:20px;">🌟</span>';
    }
    if (MY_ITEMS.includes('custom_avatar_bg')) {
      document.getElementById('avatarImg').style.border = '3px solid #ffd700';
      document.getElementById('avatarImg').style.boxShadow = '0 0 10px #ffd700';
    } else {
      document.getElementById('avatarImg').style.border = 'none';
      document.getElementById('avatarImg').style.boxShadow = 'none';
    }
    
    document.getElementById('profileName').innerHTML = nm;
    
    var allVids = await api('videos?select=*');
    var myVids = allVids.filter(function(v) { return v.user_id === ME; });
    var flr = await api('follows?following=eq.' + encodeURIComponent(ME));
    var flg = await api('follows?follower=eq.' + encodeURIComponent(ME));
    document.getElementById('profileStats').textContent = '📹 ' + myVids.length + ' · 👥 ' + flr.length + ' · 🔔 ' + flg.length + ' · 🪙 ' + MY_COINS;
    
    var vb = document.getElementById('visibilityBtn');
    vb.textContent = MY_VISIBILITY === 'private' ? '🔒 Только я' : '🌍 Для всех';
    vb.style.background = MY_VISIBILITY === 'private' ? '#ff3333' : '#22c55e';
    
    ADMIN = (user.role === 'admin');
    document.getElementById('adminNav').style.display = ADMIN ? 'flex' : 'none';
  } catch(e) {
    console.error(e);
  }
}

document.getElementById('visibilityBtn').onclick=async function(){var nv=MY_VISIBILITY==='all'?'private':'all';await api('users?login=eq.'+encodeURIComponent(ME),'PATCH',{visibility:nv});var mv=await api('videos?user_id=eq.'+encodeURIComponent(ME));for(var i=0;i<mv.length;i++)await api('videos?id=eq.'+mv[i].id,'PATCH',{visibility:nv});MY_VISIBILITY=nv;loadProfile();loadFeed();};

document.getElementById('clearCacheBtn').onclick=async function(){await VideoCache.clear();toast('Кеш очищен!');};
document.getElementById('chNickBtn').onclick=async function(){var u=await api('users?login=eq.'+encodeURIComponent(ME));var nn=prompt('Ник:',u[0]?.nickname||ME);if(nn&&nn.trim()){await api('users?login=eq.'+encodeURIComponent(ME),'PATCH',{nickname:nn.trim()});loadProfile();}};
document.getElementById('chPassBtn').onclick=async function(){var u=await api('users?login=eq.'+encodeURIComponent(ME));if(!u.length)return;var op=prompt('Старый:');if(u[0].password!==op){toast('Неверно');return;}var np=prompt('Новый:');if(np&&np.length>=3){await api('users?login=eq.'+encodeURIComponent(ME),'PATCH',{password:np});toast('Готово');}};

async function loadChats(){
  var cp=document.getElementById('chatPage');cp.innerHTML='<div style="padding:30px;">...</div>';
  try{var ms=await api('messages?or=(from_user.eq.'+encodeURIComponent(ME)+',to_user.eq.'+encodeURIComponent(ME)+')');var set={};for(var i=0;i<ms.length;i++){if(ms[i].from_user!==ME)set[ms[i].from_user]=true;if(ms[i].to_user!==ME)set[ms[i].to_user]=true;}var chats=Object.keys(set);if(!chats.length){cp.innerHTML='<div style="padding:30px;">Нет чатов</div>';return;}cp.innerHTML='';chats.forEach(function(c){api('users?login=eq.'+encodeURIComponent(c)).then(function(u){if(!u.length)return;var d=document.createElement('div');d.className='chatRow';d.innerHTML='<div class="chatAv">'+(u[0].nickname||c)[0].toUpperCase()+'</div><div><b>@'+c+'</b></div>';d.onclick=function(){openChat(c);};cp.appendChild(d);});});}catch(e){cp.innerHTML='<div>Ошибка</div>';}
}
async function openChat(wu){
  var cp=document.getElementById('chatPage');cp.innerHTML='<button id="backBtn" style="background:none;border:none;color:#ff0040;cursor:pointer;margin-bottom:10px;">← Назад</button><div id="msgBox" style="flex:1;overflow-y:auto;"></div><div id="chatInput"><input id="msgInput" placeholder="..."><button id="sendMsg">Отпр</button></div>';
  document.getElementById('backBtn').onclick=loadChats;var box=document.getElementById('msgBox');var ms=await api('messages?or=(from_user.eq.'+ME+',to_user.eq.'+ME+')&or=(from_user.eq.'+wu+',to_user.eq.'+wu+')&order=created.asc');ms.forEach(function(m){var d=document.createElement('div');d.className='msg '+(m.from_user===ME?'sent':'recv');d.textContent=m.text;box.appendChild(d);});box.scrollTop=box.scrollHeight;document.getElementById('sendMsg').onclick=async function(){var t=document.getElementById('msgInput').value.trim();if(!t)return;await api('messages','POST',{from_user:ME,to_user:wu,text:t,created:new Date().toISOString()});var d=document.createElement('div');d.className='msg sent';d.textContent=t;box.appendChild(d);document.getElementById('msgInput').value='';box.scrollTop=box.scrollHeight;};
}

// АДМИН-ПАНЕЛЬ
async function loadAdmin(){
  var ap=document.getElementById('adminPage');if(!ADMIN){ap.innerHTML='<div style="padding:30px;">⛔ Нет доступа</div>';return;}
  ap.innerHTML='<div style="padding:10px;">Загрузка...</div>';
  try{
    var users=await api('users?select=*'),vids=await api('videos?select=*');
    var bc=users.filter(function(u){return u.banned;}).length,vc=users.filter(function(u){return u.verified;}).length;
    var totalCoins=users.reduce(function(s,u){return s+(u.coins||0);},0);

    var html='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">';
    html+='<div class="stat"><b>'+users.length+'</b>Польз</div><div class="stat"><b>'+vids.length+'</b>Видео</div><div class="stat"><b>'+bc+'</b>Баны</div><div class="stat"><b>'+vc+'</b>✅</div><div class="stat"><b>🪙'+totalCoins+'</b></div></div>';
    
    html+='<div class="gold-block"><h4>🪙 Выдать коины</h4><select id="coinUser">';
    users.forEach(function(u){html+='<option value="'+u.login+'">@'+u.login+' (🪙'+(u.coins||0)+')</option>';});
    html+='</select><input id="coinAmount" type="number" value="100" placeholder="Сумма"><button class="gold-btn" id="giveCoinsBtn">🪙 Выдать</button></div>';
    
    html+='<h4>👥 Пользователи</h4><div id="aUsers"></div><h4>🎬 Видео</h4><div id="aVideos"></div><div style="height:30px;"></div>';
    ap.innerHTML=html;
    
    document.getElementById('giveCoinsBtn').onclick=async function(){
      var login=document.getElementById('coinUser').value;
      var amount=parseInt(document.getElementById('coinAmount').value)||0;
      if(amount<=0)return toast('Введите сумму!');
      var uu=await api('users?login=eq.'+encodeURIComponent(login));if(!uu.length)return;
      await api('users?login=eq.'+encodeURIComponent(login),'PATCH',{coins:(uu[0].coins||0)+amount});
      toast('✅ +'+amount+' → @'+login);loadAdmin();
    };

    var el=document.getElementById('aUsers');el.innerHTML='';
    for(var i=0;i<users.length;i++){var u=users[i];var w=[];try{w=JSON.parse(u.warnings||'[]');}catch(e){}
      var div=document.createElement('div');div.className='row';
      div.innerHTML='<span><b>@'+u.login+'</b>'+(u.verified?'✓':'')+(u.banned?'🚫':'')+(w.length?'⚠'+w.length:'')+' 🪙'+(u.coins||0)+'</span><div style="display:flex;gap:3px;flex-wrap:wrap;">'+
        '<button class="ok vbtn">'+(u.verified?'Снять':'✓')+'</button><button class="'+(u.banned?'ok':'ban')+' bbtn">'+(u.banned?'Раз':'Бан')+'</button>'+
        '<button class="wbtn" style="background:#f59e0b;">⚠</button><button class="del dbtn">🗑</button></div>';
      (function(login){
        div.querySelector('.vbtn').onclick=async function(){var uu=await api('users?login=eq.'+encodeURIComponent(login));if(uu.length){await api('users?login=eq.'+encodeURIComponent(login),'PATCH',{verified:!uu[0].verified});loadAdmin();}};
        div.querySelector('.bbtn').onclick=async function(){var uu=await api('users?login=eq.'+encodeURIComponent(login));if(!uu.length)return;if(uu[0].banned)await api('users?login=eq.'+encodeURIComponent(login),'PATCH',{banned:false});else{var r=prompt('Причина:');if(!r)return;var d=prompt('Дней:','0');if(d===null)return;await api('users?login=eq.'+encodeURIComponent(login),'PATCH',{banned:true,ban_reason:r,ban_until:parseInt(d)>0?Date.now()+parseInt(d)*86400000:0});}loadAdmin();};
        div.querySelector('.wbtn').onclick=async function(){var r=prompt('Причина:');if(!r)return;var uu=await api('users?login=eq.'+encodeURIComponent(login));if(!uu.length)return;var w=[];try{w=JSON.parse(uu[0].warnings||'[]');}catch(e){}w.push(r);await api('users?login=eq.'+encodeURIComponent(login),'PATCH',{warnings:JSON.stringify(w)});loadAdmin();};
        div.querySelector('.dbtn').onclick=async function(){if(!confirm('Удалить @'+login+'?'))return;var uu=await api('users?login=eq.'+encodeURIComponent(login));if(uu.length){await api('users?id=eq.'+uu[0].id,'DELETE');loadAdmin();}};
      })(u.login);
      el.appendChild(div);
    }

    var av=document.getElementById('aVideos');av.innerHTML='';
    for(var i=0;i<vids.length;i++){var v=vids[i];var div=document.createElement('div');div.className='row';
      div.innerHTML='<span>🎬 '+(v.name||'')+' · @'+v.user_id+' ❤'+(v.likes||0)+'</span><button class="del">🗑</button>';
      (function(vid){div.querySelector('button').onclick=async function(){if(!confirm('Удалить?'))return;await api('videos?id=eq.'+vid,'DELETE');loadAdmin();};})(v.id);
      av.appendChild(div);
    }
  }catch(e){ap.innerHTML='<div style="padding:20px;color:red;">Ошибка</div>';}
}
