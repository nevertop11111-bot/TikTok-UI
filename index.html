<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>TikTok UI ☁️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }

    #authScreen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; }
    #authScreen.hidden { display: none; }
    #authBox { background: #111; border-radius: 20px; padding: 30px 20px; width: 90%; max-width: 340px; text-align: center; }
    #authBox h1 { font-size: 30px; margin-bottom: 5px; }
    #authBox h1 span { color: #ff0040; }
    #authBox p { color: #888; margin-bottom: 20px; font-size: 14px; }
    #authBox input { width: 100%; padding: 14px; margin: 6px 0; border-radius: 12px; border: 1px solid #222; background: #000; color: #fff; font-size: 16px; outline: none; }
    #authBox button { width: 100%; padding: 14px; margin: 6px 0; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
    #loginBtn { background: #ff0040; color: #fff; }
    #registerBtn { background: #00e5ff; color: #000; }
    #authError { color: #ff4444; margin-top: 10px; font-size: 14px; min-height: 20px; }

    #app { height: 100vh; display: flex; flex-direction: column; }
    #topBar { height: 50px; background: #0a0a0a; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #1a1a1a; }
    #topBar span { font-weight: bold; font-size: 18px; }
    #topBar button { background: none; border: 1px solid #333; color: #fff; padding: 7px 15px; border-radius: 15px; font-size: 13px; cursor: pointer; }

    #content { flex: 1; position: relative; overflow: hidden; }
    .page { position: absolute; inset: 0; overflow-y: auto; display: none; padding-bottom: 70px; }
    .page.active { display: block; }

    #feedPage { overflow-y: scroll; scroll-snap-type: y mandatory; }
    .vid { width: 100%; height: calc(100vh - 120px); scroll-snap-align: start; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    .vid video { width: 100%; height: 100%; object-fit: contain; }
    .vid .info { position: absolute; bottom: 20px; left: 15px; right: 55px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 12px; }
    .vid .info .uname { font-weight: bold; font-size: 14px; }
    .vid .info .title { font-size: 12px; color: #ccc; margin-top: 3px; }
    .vid .btns { position: absolute; right: 10px; bottom: 25px; display: flex; flex-direction: column; gap: 15px; }
    .vid .btns button { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .vid .btns span { font-size: 11px; display: block; text-align: center; }
    .vid .sound { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    #profilePage { padding: 25px; text-align: center; }
    #avatarImg { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #222; cursor: pointer; }
    #profilePage h3 { margin-top: 10px; font-size: 20px; }
    #profilePage .st { color: #888; font-size: 13px; margin: 5px 0 15px; }
    #profilePage button { display: block; width: 90%; max-width: 300px; margin: 6px auto; padding: 12px; border-radius: 20px; border: 1px solid #333; background: #111; color: #fff; font-size: 14px; cursor: pointer; }
    .verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #22c55e; font-size: 12px; color: #fff; margin-left: 5px; vertical-align: middle; }

    #adminPage { padding: 15px; }
    #adminPage .stat { display: inline-block; background: #111; padding: 12px 16px; border-radius: 12px; margin: 4px; font-size: 13px; text-align: center; }
    #adminPage .stat b { display: block; font-size: 20px; color: #ff0040; }
    #adminPage input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #222; background: #000; color: #fff; margin: 8px 0; font-size: 14px; outline: none; }
    #adminPage .row { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #111; border-radius: 10px; margin: 4px 0; font-size: 13px; flex-wrap: wrap; gap: 6px; }
    #adminPage .row button { padding: 8px 14px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; font-size: 12px; cursor: pointer; min-width: 50px; min-height: 38px; }
    #adminPage .row .del { background: #ff0040; border-color: #ff0040; }
    #adminPage .row .ban { background: #ff3333; border-color: #ff3333; }
    #adminPage .row .ok { background: #22c55e; border-color: #22c55e; color: #000; }

    #chatPage { padding: 15px; }
    .chatRow { display: flex; align-items: center; padding: 12px; background: #111; border-radius: 12px; margin: 4px 0; cursor: pointer; }
    .chatAv { width: 40px; height: 40px; border-radius: 50%; background: #222; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; margin: 3px 0; font-size: 13px; }
    .msg.sent { background: #ff0040; align-self: flex-end; }
    .msg.recv { background: #1a1a1a; border: 1px solid #222; align-self: flex-start; }
    #chatInput { display: flex; gap: 8px; padding: 10px; background: #0a0a0a; position: sticky; bottom: 0; }
    #chatInput input { flex: 1; padding: 10px; border-radius: 18px; border: 1px solid #222; background: #000; color: #fff; }
    #chatInput button { background: #ff0040; color: #fff; border: none; border-radius: 18px; padding: 10px 18px; cursor: pointer; font-weight: bold; }

    #bottomBar { height: 60px; background: #0a0a0a; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid #1a1a1a; position: absolute; bottom: 0; left: 0; right: 0; z-index: 20; }
    #bottomBar .nav { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 11px; cursor: pointer; }
    #bottomBar .nav.on { color: #fff; }
    #bottomBar .nav .ico { font-size: 22px; }

    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #ff0040; color: #fff; padding: 10px 20px; border-radius: 20px; z-index: 99; font-weight: bold; font-size: 14px; opacity: 0; transition: opacity 0.3s; }
    #toast.show { opacity: 1; }
  </style>
</head>

<div id="toast"></div>

<script>

const URL = 'https://gtyjjzmvdhglxfjrwejh.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0eWpqem12ZGhnbHhmanJ3ZWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDc1NjMsImV4cCI6MjEwMTYyMzU2M30.8KOimAzsQbj5xPukQswdW05dvW5sat3xvyfxB44_J5Y';

let ME = '';
let ADMIN = false;

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

// ЗАПРОС К БАЗЕ ДАННЫХ
async function api(path, method, body) {
  method = method || 'GET';
  var h = {
    'Content-Type': 'application/json',
    apikey: KEY,
    Authorization: 'Bearer ' + KEY
  };
  var o = { method: method, headers: h };
  if (body) { o.body = JSON.stringify(body); }
  var r = await fetch(URL + '/rest/v1/' + path, o);
  var t = await r.text();
  if (!r.ok) { throw new Error(t); }
  if (t) { return JSON.parse(t); }
  return [];
}

// НАВИГАЦИЯ
var navs = document.querySelectorAll('#bottomBar .nav');
for (var i = 0; i < navs.length; i++) {
  navs[i].onclick = function() {
    var allNavs = document.querySelectorAll('#bottomBar .nav');
    for (var j = 0; j < allNavs.length; j++) { allNavs[j].classList.remove('on'); }

    for (var k = 0; k < allPages.length; k++) { allPages[k].classList.remove('active'); }

    document.getElementById(panelId).classList.add('active');
    
    if (panelId === 'feedPage') { loadFeed(); }
    if (panelId === 'chatPage') { loadChats(); }

}

function enter(user) {
  ME = user.login;
  ADMIN = (user.role === 'admin');

  document.getElementById('authScreen').classList.add('hidden');
  
  if (ADMIN) {

}

document.getElementById('logoutBtn').onclick = function() {

// ЛЕНТА
async function loadFeed() {
  var fp = document.getElementById('feedPage');
  fp.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">Загрузка...</div>';
  
  try {
    var allVids = await api('videos?select=*');
    
    // Фильтруем: только публичные ИЛИ свои
    var vids = [];
    for (var i = 0; i < allVids.length; i++) {
      var v = allVids[i];
      if (v.visibility === 'all' || v.user_id === ME) {
        vids.push(v);
      }
    }
    
    if (vids.length === 0) {
      fp.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">📹 Нет видео. Загрузите первое!</div>';
      return;
    }
    
    fp.innerHTML = '';
    
    // Перемешиваем
    vids.sort(function() { return Math.random() - 0.5; });
    
    for (var i = 0; i < vids.length; i++) {
      var v = vids[i];
      var canDel = (v.user_id === ME) || ADMIN;
      
      var div = document.createElement('div');
      div.className = 'vid';
      
      var html = '<video src="' + v.url + '" loop playsinline muted></video>';
      html += '<div class="sound">🔇</div>';
      html += '<div class="info"><div class="uname">@' + v.user_id + '</div><div class="title">' + (v.name || '') + '</div></div>';
      html += '<div class="btns"><button class="like-btn">❤️<span>' + (v.likes || 0) + '</span></button>';
      if (canDel) { html += '<button class="del-btn">🗑️</button>'; }
      html += '</div>';
      
      div.innerHTML = html;
      
      var video = div.querySelector('video');
      var soundBtn = div.querySelector('.sound');
      
      // Автовоспроизведение
      var observer = new IntersectionObserver(function(entries) {
        if (entries[0].isIntersecting) {
          video.muted = !SOUND;
          soundBtn.textContent = SOUND ? '🔊' : '🔇';
          video.play().catch(function() {});
        } else {
          video.muted = true;
          soundBtn.textContent = '🔇';
          video.pause();
        }
      }, { threshold: 0.7 });
      observer.observe(div);
      
      // Кнопка звука
      soundBtn.onclick = function(e) {
        e.stopPropagation();
        SOUND = !SOUND;
        video.muted = !SOUND;
        soundBtn.textContent = SOUND ? '🔊' : '🔇';
        if (SOUND) { video.play().catch(function() {}); }
      };
      
      // Лайк
      div.querySelector('.like-btn').onclick = async function(e) {
        e.stopPropagation();
        var nl = (v.likes || 0) + 1;
        div.querySelector('.like-btn span').textContent = nl;
        await api('videos?id=eq.' + v.id, 'PATCH', { likes: nl });
      };
      
      // Удаление
      var delBtn = div.querySelector('.del-btn');
      if (delBtn) {
        delBtn.onclick = async function(e) {
          e.stopPropagation();
          if (!confirm('Удалить видео?')) { return; }
          await api('videos?id=eq.' + v.id, 'DELETE');
          toast('🗑️ Видео удалено');
          loadFeed();
        };
      }
      
      fp.appendChild(div);
    }
  } catch (e) {
    fp.innerHTML = '<div style="text-align:center;padding:40px;color:red;">Ошибка загрузки</div>';
  }
}

// ПРОФИЛЬ
async function loadProfile() {
  try {
    var users = await api('users?login=eq.' + encodeURIComponent(ME));
    if (users.length === 0) { return; }
    var user = users[0];
    
    MY_VISIBILITY = user.visibility || 'all';
    
    document.getElementById('avatarImg').src = user.avatar || '';
    
    var nm = '@' + ME;
    if (user.verified) {
      nm += ' <span class="verified-badge">✓</span>';
    }
    var warns = [];
    try { warns = JSON.parse(user.warnings || '[]'); } catch(e) { warns = []; }
    if (warns.length > 0) {
      nm += ' <span style="background:#f59e0b;color:#000;border-radius:8px;padding:1px 6px;font-size:11px;margin-left:4px;">⚠' + warns.length + '</span>';
    }
    document.getElementById('profileName').innerHTML = nm;
    
    var allVids = await api('videos?select=*');
    var myVids = allVids.filter(function(v) { return v.user_id === ME; });
    var flr = await api('follows?following=eq.' + encodeURIComponent(ME));
    var flg = await api('follows?follower=eq.' + encodeURIComponent(ME));
    document.getElementById('profileStats').textContent = '📹 ' + myVids.length + ' видео · 👥 ' + flr.length + ' подп. · 🔔 ' + flg.length + ' подписок';
    
    var vb = document.getElementById('visibilityBtn');
    if (MY_VISIBILITY === 'private') {
      vb.textContent = '🔒 Видимость: Только я';
      vb.style.background = '#ff3333';
    } else {
      vb.textContent = '🌍 Видимость: Для всех';
      vb.style.background = '#22c55e';
    }
    
    ADMIN = (user.role === 'admin');
    if (ADMIN) {
      document.getElementById('adminNav').style.display = 'flex';
    } else {
      document.getElementById('adminNav').style.display = 'none';
    }
  } catch (e) {}
}

// КНОПКА ВИДИМОСТИ
document.getElementById('visibilityBtn').onclick = async function() {
  var nv = (MY_VISIBILITY === 'all') ? 'private' : 'all';
  await api('users?login=eq.' + encodeURIComponent(ME), 'PATCH', { visibility: nv });
  
  var myVids = await api('videos?user_id=eq.' + encodeURIComponent(ME));
  for (var i = 0; i < myVids.length; i++) {
    await api('videos?id=eq.' + myVids[i].id, 'PATCH', { visibility: nv });
  }
  
  MY_VISIBILITY = nv;
  loadProfile();

  if (!f) { return; }
  var reader = new FileReader();
  reader.onload = async function(ev) {
    await api('users?login=eq.' + encodeURIComponent(ME), 'PATCH', { avatar: ev.target.result });

// ЗАГРУЗКА ВИДЕО
document.getElementById('uploadBtn').onclick = function() {
  document.getElementById('videoFile').click();
};
document.getElementById('videoFile').onchange = async function(e) {
  var f = e.target.files[0];
  if (!f) { return; }
  
  document.getElementById('uploadStatus').textContent = '⏳ Загрузка...';
  
  try {
    var fn = Date.now() + '_' + f.name.replace(/[^a-zA-Z0-9.]/g, '_');
    
    // Загружаем в Storage
    await fetch(URL + '/storage/v1/object/tiktok-videos/' + fn, {
      method: 'POST',
      headers: {
        apikey: KEY,
        Authorization: 'Bearer ' + KEY,
        'Content-Type': f.type || 'video/mp4'
      },
      body: f
    });
    
    var vurl = URL + '/storage/v1/object/public/tiktok-videos/' + fn;
    
    // Сохраняем в базу
    await api('videos', 'POST', {
      user_id: ME,
      name: f.name,
      url: vurl,
      duration: 0,
      likes: 0,
      views: 0,
      comments: 0,
      visibility: MY_VISIBILITY,
      created: new Date().toISOString()
    });
    
    document.getElementById('uploadStatus').textContent = '✅ Готово!';
    toast('📤 Видео загружено!');
    document.getElementById('videoFile').value = '';
    loadFeed();
    loadProfile();
    setTimeout(function() { document.getElementById('uploadStatus').textContent = ''; }, 3000);
  } catch (er) {
    document.getElementById('uploadStatus').textContent = '❌ Ошибка загрузки';
  }
};

    return;
  }
  var np = prompt('Новый пароль (мин. 3 символа):');
  if (np && np.length >= 3) {
    await api('users?login=eq.' + encodeURIComponent(ME), 'PATCH', { password: np });
    toast('🔒 Пароль изменён');
  }
};

// ЧАТ
async function loadChats() {
  var cp = document.getElementById('chatPage');
  cp.innerHTML = '<div style="text-align:center;padding:30px;color:#888;">Загрузка...</div>';
  
  try {
    var msgs = await api('messages?or=(from_user.eq.' + encodeURIComponent(ME) + ',to_user.eq.' + encodeURIComponent(ME) + ')');
    var usersSet = {};
    for (var i = 0; i < msgs.length; i++) {
      var m = msgs[i];
      if (m.from_user !== ME) { usersSet[m.from_user] = true; }
      if (m.to_user !== ME) { usersSet[m.to_user] = true; }
    }
    var chats = Object.keys(usersSet);
    
    if (chats.length === 0) {
      cp.innerHTML = '<div style="text-align:center;padding:30px;color:#888;">💬 Нет сообщений</div>';
      return;
    }
    
    cp.innerHTML = '';
    for (var i = 0; i < chats.length; i++) {
      var c = chats[i];
      var users = await api('users?login=eq.' + encodeURIComponent(c));
      if (users.length === 0) { continue; }
      var user = users[0];
      
      var div = document.createElement('div');
      div.className = 'chatRow';
      div.innerHTML = '<div class="chatAv">' + (user.nickname || c)[0].toUpperCase() + '</div><div><b>@' + c + '</b></div>';
      div.onclick = (function(chatUser) {
        return function() { openChat(chatUser); };
      })(c);
      cp.appendChild(div);
    }
  } catch (e) {
    cp.innerHTML = '<div style="color:red;">Ошибка</div>';
  }
}

async function openChat(wu) {
  var cp = document.getElementById('chatPage');
  cp.innerHTML = '<button id="backBtn" style="background:none;border:none;color:#ff0040;font-size:16px;cursor:pointer;margin-bottom:10px;">← Назад</button><div id="msgBox" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;"></div><div id="chatInput"><input id="msgInput" placeholder="Сообщение..."><button id="sendMsg">Отправить</button></div>';
  
  document.getElementById('backBtn').onclick = loadChats;
  
  var box = document.getElementById('msgBox');
  var msgs = await api('messages?or=(from_user.eq.' + ME + ',to_user.eq.' + ME + ')&or=(from_user.eq.' + wu + ',to_user.eq.' + wu + ')&order=created.asc');
  
  for (var i = 0; i < msgs.length; i++) {
    var m = msgs[i];
    var div = document.createElement('div');
    div.className = 'msg ' + (m.from_user === ME ? 'sent' : 'recv');
    div.textContent = m.text;
    box.appendChild(div);
  }
  box.scrollTop = box.scrollHeight;
  
  document.getElementById('sendMsg').onclick = async function() {
    var t = document.getElementById('msgInput').value.trim();
    if (!t) { return; }
    await api('messages', 'POST', { from_user: ME, to_user: wu, text: t, created: new Date().toISOString() });
    var div = document.createElement('div');
    div.className = 'msg sent';
    div.textContent = t;
    box.appendChild(div);
    document.getElementById('msgInput').value = '';
    box.scrollTop = box.scrollHeight;
  };
}

// АДМИН-ПАНЕЛЬ
async function loadAdmin() {
  var ap = document.getElementById('adminPage');
  
  if (!ADMIN) {
    ap.innerHTML = '<div style="padding:30px;text-align:center;color:red;">⛔ Доступ запрещён</div>';
    return;
  }
  
  ap.innerHTML = '<div style="text-align:center;padding:30px;color:#888;">Загрузка...</div>';
  
  try {
    var users = await api('users?select=*');
    var vids = await api('videos?select=*');
    var bannedCount = 0;
    var verifiedCount = 0;
    
    for (var i = 0; i < users.length; i++) {
      if (users[i].banned) { bannedCount++; }
      if (users[i].verified) { verifiedCount++; }
    }
    
    ap.innerHTML = '<div><span class="stat"><b>' + users.length + '</b>Польз.</span><span class="stat"><b>' + vids.length + '</b>Видео</span><span class="stat"><b>' + bannedCount + '</b>Банов</span><span class="stat"><b>' + verifiedCount + '</b>Вериф.</span></div><h4 style="margin-top:10px;">👥 Пользователи</h4><div id="aUsers"></div><h4 style="margin-top:10px;">🎬 Видео</h4><div id="aVideos"></div><div style="height:20px;"></div>';
    
    renderAdminUsers(users);
    renderAdminVideos(vids);
  } catch (e) {
    ap.innerHTML = '<div style="color:red;">Ошибка</div>';
  }
}

function renderAdminUsers(users) {
  var el = document.getElementById('aUsers');
  if (!el) { return; }
  
  var html = '';
  for (var i = 0; i < users.length; i++) {
    var u = users[i];
    var warns = [];
    try { warns = JSON.parse(u.warnings || '[]'); } catch(e) { warns = []; }
    
    var badges = '';
    if (u.verified) { badges += ' <span style="color:#22c55e;">✓</span>'; }
    if (u.banned) { badges += ' <span style="color:red;">БАН</span>'; }
    if (warns.length > 0) { badges += ' <span style="color:#f59e0b;">⚠' + warns.length + '</span>'; }
    
    html += '<div class="row"><span><b>@' + u.login + '</b>' + badges + '</span><div>';
    html += '<button class="ok vbtn" data-login="' + u.login + '">' + (u.verified ? 'Снять ✓' : '✓ Вериф.') + '</button>';
    html += '<button class="' + (u.banned ? 'ok' : 'ban') + ' bbtn" data-login="' + u.login + '">' + (u.banned ? 'Разбанить' : 'Забанить') + '</button>';
    html += '<button class="wbtn" data-login="' + u.login + '" style="background:#f59e0b;color:#000;">⚠</button>';
    html += '<button class="del dbtn" data-login="' + u.login + '">🗑</button>';
    html += '</div></div>';
  }
  el.innerHTML = html;
  
  // Вешаем обработчики
  var vbtns = el.querySelectorAll('.vbtn');
  for (var i = 0; i < vbtns.length; i++) {
    vbtns[i].onclick = async function() {
      var login = this.getAttribute('data-login');
      var u = await api('users?login=eq.' + encodeURIComponent(login));
      if (u.length > 0) {
        await api('users?login=eq.' + encodeURIComponent(login), 'PATCH', { verified: !u[0].verified });
        toast(u[0].verified ? '❌ Верификация снята' : '✅ Верифицирован');
        loadAdmin();
      }
    };
  }
  
  var bbtns = el.querySelectorAll('.bbtn');
  for (var i = 0; i < bbtns.length; i++) {
    bbtns[i].onclick = async function() {
      var login = this.getAttribute('data-login');
      var u = await api('users?login=eq.' + encodeURIComponent(login));
      if (u.length === 0) { return; }
      
      if (u[0].banned) {
        await api('users?login=eq.' + encodeURIComponent(login), 'PATCH', { banned: false, ban_reason: '', ban_until: 0 });
        toast('🔓 Разбанен');
      } else {
        var reason = prompt('Причина бана:');
        if (!reason) { return; }
        var days = prompt('На сколько дней? (0 = навсегда)', '0');
        if (days === null) { return; }
        var banUntil = parseInt(days) > 0 ? Date.now() + parseInt(days) * 86400000 : 0;
        await api('users?login=eq.' + encodeURIComponent(login), 'PATCH', { banned: true, ban_reason: reason, ban_until: banUntil });
        toast('🚫 Забанен');
      }
      loadAdmin();
    };
  }
  
  var wbtns = el.querySelectorAll('.wbtn');
  for (var i = 0; i < wbtns.length; i++) {
    wbtns[i].onclick = async function() {
      var login = this.getAttribute('data-login');
      var reason = prompt('Причина предупреждения:');
      if (!reason) { return; }
      var u = await api('users?login=eq.' + encodeURIComponent(login));
      if (u.length === 0) { return; }
      var warns = [];
      try { warns = JSON.parse(u[0].warnings || '[]'); } catch(e) { warns = []; }
      warns.push(reason);
      await api('users?login=eq.' + encodeURIComponent(login), 'PATCH', { warnings: JSON.stringify(warns) });
      toast('⚠️ Предупреждение выдано');
      loadAdmin();
    };
  }
  
  var dbtns = el.querySelectorAll('.dbtn');
  for (var i = 0; i < dbtns.length; i++) {
    dbtns[i].onclick = async function() {
      var login = this.getAttribute('data-login');
      if (!confirm('Удалить пользователя @' + login + '?')) { return; }
      var u = await api('users?login=eq.' + encodeURIComponent(login));
      if (u.length > 0) {
        await api('users?id=eq.' + u[0].id, 'DELETE');
        toast('🗑️ Пользователь удалён');
        loadAdmin();
      }
    };
  }
}

function renderAdminVideos(vids) {
  var el = document.getElementById('aVideos');
  if (!el) { return; }
  
  var html = '';
  for (var i = 0; i < vids.length; i++) {
    var v = vids[i];
    html += '<div class="row"><span>🎬 ' + (v.name || 'Без названия') + ' · @' + v.user_id + ' ' + (v.visibility === 'private' ? '🔒' : '') + '</span><button class="del" data-vid="' + v.id + '">🗑</button></div>';
  }
  el.innerHTML = html;
  
  var btns = el.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = async function() {
      var vid = this.getAttribute('data-vid');
      if (!confirm('Удалить видео?')) { return; }
      await api('videos?id=eq.' + vid, 'DELETE');
      toast('🗑️ Видео удалено');
      loadAdmin();
    };
  }
}
